<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra · Tickets</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
<style>
  .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 10px; border-bottom:1px solid var(--border); background:var(--panel) }
  .toolbar label { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center }
  .toolbar button { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px }
  .toolbar .filter { margin:0; width:260px }
  #stage { height:calc(100vh - 42px - 43px); overflow:hidden; cursor:grab; background:var(--bg) } #stage.dragging { cursor:grabbing }
  #stage svg { width:100%; height:100%; min-height:0; display:block }
  .ms { cursor:pointer } .ms rect { fill:var(--panel2); stroke:var(--accent); stroke-width:1.5; rx:8 } .ms.closed rect { stroke:var(--muted); stroke-dasharray:4 3 }
  .ms text { fill:var(--text); font-size:11px; pointer-events:none } .ms .sub { fill:var(--muted) }
  .edge.ms-edge { stroke:#3a4152; stroke-dasharray:3 3 } .edge.collapsed { stroke:#6ea8fe; stroke-dasharray:6 3 }
  .group rect { fill:none; stroke:var(--border); stroke-dasharray:4 3; rx:10 } .group text { fill:var(--muted); font-size:12px; font-weight:600 }
</style>
</head>
<body>
<nav id="nav"><a href="/">Dashboard</a><a href="/tickets" class="on">Tickets</a><span class="muted" id="proj"></span><span class="muted" id="conn" style="margin-left:auto"></span></nav>
<div class="toolbar">
  <input id="filter" class="filter" placeholder="filter (id, title, state, milestone)">
  <label><input type="checkbox" id="collapse" checked> collapse done into milestone</label>
  <button onclick="expandAll()">expand all</button><button onclick="collapseAll()">collapse all</button>
  <button onclick="fit()">fit</button>
  <span id="legend" class="muted"></span>
  <span class="muted" style="margin-left:auto">drag or scroll to pan · pinch or ⌘/ctrl+scroll to zoom · click a milestone to toggle</span>
</div>
<div id="stage"><svg id="svg"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5368"/></marker>
  <marker id="arrow-c" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6ea8fe"/></marker>
</defs><g id="view"></g></svg></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDrawer()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js?v={{v}}"></script>
<script>
let STATE = null;
const view = { x: 20, y: 20, k: 1 };
const expanded = new Set();          // milestone ids the user expanded despite collapse mode
const DONE = new Set(["DONE", "CANCELLED"]);
const W = 200, H = 46, MW = 170, MH = 46, GX = 70, GY = 18, PAD = 24, GROUP_GAP = 26;
let bounds = { w: 800, h: 600 };

async function refresh() {
  try { STATE = await (await fetch("/api/state")).json(); renderNav("tickets", STATE.project); $("conn").textContent = "live"; render(); }
  catch (e) { if ($("conn")) $("conn").textContent = "disconnected"; }
}

// ---- graph model: milestone nodes + visible tickets + rerouted edges ------------
function buildModel(s) {
  const q = $("filter").value.trim().toLowerCase();
  const collapse = $("collapse").checked;
  const byId = Object.fromEntries(s.tickets.map((t) => [t.id, t]));
  const groups = [];
  const nodes = {};
  const edges = new Map();
  const addEdge = (from, to, cls) => { if (from !== to) edges.set(`${from}->${to}`, { from, to, cls }); };
  for (const m of s.milestones) {
    const all = s.tickets.filter((t) => t.milestone_id === m.id);
    const done = all.filter((t) => DONE.has(t.state));
    const isCollapsed = (m.status === "closed" || (collapse && all.length > 0 && done.length === all.length)) && !expanded.has(m.id);
    const hideDone = (collapse || m.status === "closed") && !expanded.has(m.id);
    let visible = isCollapsed ? [] : (hideDone ? all.filter((t) => !DONE.has(t.state)) : all);
    if (q) visible = visible.filter((t) => [t.id, t.title, t.state, m.id, m.name].join(" ").toLowerCase().includes(q));
    const mid = `ms:${m.id}`;
    nodes[mid] = { kind: "ms", m, total: all.length, done: done.length, collapsed: isCollapsed, hidden: all.length - visible.length };
    for (const t of visible) nodes[t.id] = { kind: "ticket", t, group: m.id };
    groups.push({ m, mid, tickets: visible });
  }
  // Edges: ticket -> ticket when both visible; a hidden (done) source reroutes to its milestone node.
  for (const t of s.tickets) for (const dep of t.depends_on) {
    const d = byId[dep]; if (!d || !nodes[t.id]) continue;
    if (nodes[dep]) addEdge(dep, t.id, "");
    else if (DONE.has(d.state)) addEdge(`ms:${d.milestone_id}`, t.id, "collapsed");
  }
  // The milestone node anchors its root tickets (no visible in-group dependency).
  for (const g of groups) for (const t of g.tickets)
    if (!t.depends_on.some((d) => nodes[d] && nodes[d].group === g.m.id)) addEdge(g.mid, t.id, "ms-edge");
  return { groups, nodes, edges: [...edges.values()] };
}

// ---- layout: per group, milestone node at column 0, tickets layered by in-group depth --
function layout(model) {
  const pos = {};
  let y = 10, maxW = 0;
  const boxes = [];
  for (const g of model.groups) {
    const depth = {};
    const d = (t) => depth[t.id] ??= 1 + Math.max(0, ...t.depends_on.filter((x) => model.nodes[x] && model.nodes[x].group === g.m.id).map((x) => d(model.nodes[x].t)));
    g.tickets.forEach(d);
    const cols = {}; g.tickets.forEach((t) => (cols[depth[t.id]] ??= []).push(t));
    const nCols = g.tickets.length ? Math.max(...Object.keys(cols).map(Number)) : 0;
    const rows = g.tickets.length ? Math.max(...Object.values(cols).map((c) => c.length)) : 1;
    const top = y, h = 30 + Math.max(rows, 1) * (H + GY) + 2;
    pos[g.mid] = { x: PAD, y: top + 30 + Math.max(0, (rows * (H + GY) - GY - MH) / 2), w: MW, h: MH };
    Object.entries(cols).forEach(([c, list]) => list.sort((a, b) => a.priority - b.priority || a.id.localeCompare(b.id, undefined, { numeric: true }))
      .forEach((t, i) => { pos[t.id] = { x: PAD + MW + GX + (c - 1) * (W + GX), y: top + 30 + i * (H + GY), w: W, h: H }; }));
    const w = PAD * 2 + MW + (nCols ? GX + nCols * (W + GX) - GX : 0);
    boxes.push({ g, top, h, w }); maxW = Math.max(maxW, w); y += h + GROUP_GAP;
  }
  bounds = { w: maxW + 10, h: y };
  return { pos, boxes };
}

function render() {
  const s = STATE; if (!s) return;
  $("legend").innerHTML = Object.entries(s.counts).filter(([, v]) => v).map(([k, v]) => `<span class="badge" style="background:${color(k)}">${k} ${v}</span>`).join(" ");
  if (!s.tickets.length) { $("view").innerHTML = `<text x="20" y="40" fill="#8a90a3">No tickets yet. Talk to the Supervisor on the dashboard.</text>`; return; }
  const model = buildModel(s); const { pos, boxes } = layout(model);
  let svg = "";
  for (const b of boxes) svg += `<g class="group"><rect x="4" y="${b.top}" width="${b.w}" height="${b.h}"/><text x="14" y="${b.top + 17}">${esc(b.g.m.id)} · ${esc(b.g.m.name)}${b.g.m.status === "closed" ? " (closed)" : ""}</text></g>`;
  for (const e of model.edges) {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    svg += `<path class="edge ${e.cls}" d="M${x1},${y1} C${x1 + 35},${y1} ${x2 - 35},${y2} ${x2},${y2}" ${e.cls === "collapsed" ? 'marker-end="url(#arrow-c)"' : ""}/>`;
  }
  for (const [id, n] of Object.entries(model.nodes)) {
    const p = pos[id]; if (!p) continue;
    if (n.kind === "ms") {
      const sub = n.collapsed ? `${n.done}/${n.total} done · collapsed` : n.hidden ? `${n.done}/${n.total} done · ${n.hidden} hidden` : `${n.done}/${n.total} done`;
      svg += `<g class="ms ${n.m.status}" transform="translate(${p.x},${p.y})" onclick="toggleMilestone('${n.m.id}')"><rect width="${p.w}" height="${p.h}"/>
        <text x="10" y="18" style="font-weight:700">${esc(n.m.id)} ${esc(n.m.name.slice(0, 16))}</text><text class="sub" x="10" y="34">${esc(sub)}</text><title>${esc(n.m.name)}: click to ${n.collapsed || n.hidden ? "expand" : "collapse"}</title></g>`;
    } else {
      const t = n.t, act = ["IN_PROGRESS", "IN_REVIEW", "MERGING"].includes(t.state), waiting = t.state === "OPEN" && !t.ready;
      const label = t.state === "OPEN" ? (t.ready ? "OPEN · ready" : "OPEN · " + (t.waiting_on && t.waiting_on.length ? "waits " + t.waiting_on.join(",") : "closed")) : t.state;
      svg += `<g class="node ${act ? "active" : ""}" transform="translate(${p.x},${p.y})" onclick="openTicket('${t.id}')"><rect width="${p.w}" height="${p.h}" fill="${color(t.state)}" fill-opacity="${waiting ? ".45" : ".85"}" ${waiting ? 'stroke-dasharray="5 3"' : ""}/>
        <text x="8" y="17" style="font-weight:700">${esc(t.id)} <tspan style="font-weight:400;fill:#e6e8ee">${esc(label)}</tspan></text><text x="8" y="34">${esc(t.title.slice(0, 32))}${t.title.length > 32 ? "…" : ""}</text><title>${esc(t.why_waiting || t.state)}</title></g>`;
    }
  }
  $("view").innerHTML = svg;
  applyView();
}

// ---- interaction -----------------------------------------------------------------
function toggleMilestone(id) { if (expanded.has(id)) expanded.delete(id); else expanded.add(id); render(); }
function expandAll() { STATE.milestones.forEach((m) => expanded.add(m.id)); render(); }
function collapseAll() { expanded.clear(); render(); }
function applyView() { $("view").setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`); }
function fit() {
  const st = $("stage").getBoundingClientRect();
  view.k = Math.min(1.5, Math.max(0.15, Math.min((st.width - 40) / bounds.w, (st.height - 40) / bounds.h)));
  view.x = 20; view.y = 20; applyView();
}
(function wire() {
  const stage = $("stage"); let drag = null, moved = false;
  stage.addEventListener("mousedown", (e) => { if (e.button !== 0) return; moved = false; drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; stage.classList.add("dragging"); });
  window.addEventListener("mousemove", (e) => { if (!drag) return; if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) moved = true; view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); applyView(); });
  window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("dragging"); });
  stage.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); } }, true);
  // Trackpads fire many small wheel events, so zoom is proportional to the delta
  // (exponential, clamped per event) rather than a fixed step. Pinch and ctrl/cmd+wheel
  // zoom; a plain two-finger scroll or mouse wheel pans, like most graph tools.
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;   // lines/pages -> pixels
    const dx = e.deltaX * scale, dy = e.deltaY * scale;
    if (e.ctrlKey || e.metaKey) {
      const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const factor = Math.exp(Math.max(-40, Math.min(40, -dy)) * 0.006);  // ~5% per 8px of delta
      const k = Math.min(3, Math.max(0.1, view.k * factor));
      view.x = mx - (mx - view.x) * (k / view.k); view.y = my - (my - view.y) * (k / view.k); view.k = k;
    } else {
      view.x -= dx; view.y -= dy;
    }
    applyView();
  }, { passive: false });
})();
$("filter").addEventListener("input", render);
$("collapse").addEventListener("change", render);
refresh().then(fit); setInterval(refresh, 2500);
openFromHash();
</script>
</body>
</html>
