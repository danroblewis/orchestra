<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra · Tickets</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
<nav id="nav"><a href="/">Dashboard</a><a href="/tickets" class="on">Tickets</a><span class="muted" id="proj"></span><span class="muted" id="conn" style="margin-left:auto"></span></nav>
<div class="page">
  <input id="filter" class="filter" placeholder="filter tickets (id, title, state, milestone)">
  <span id="legend" class="muted" style="margin-left:12px"></span>
  <div id="graph"></div>
</div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDrawer()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js?v={{v}}"></script>
<script>
let STATE = null;
async function refresh() {
  try { STATE = await (await fetch("/api/state")).json(); renderNav("tickets", STATE.project); $("conn").textContent = "live"; render(); }
  catch (e) { if ($("conn")) $("conn").textContent = "disconnected"; }
}

function render() {
  const s = STATE; if (!s) return;
  $("legend").innerHTML = Object.entries(s.counts).filter(([, v]) => v).map(([k, v]) => `<span class="badge" style="background:${color(k)}">${k} ${v}</span>`).join(" ");
  const q = $("filter").value.trim().toLowerCase();
  const tickets = s.tickets.filter((t) => !q || [t.id, t.title, t.state, t.milestone_id].join(" ").toLowerCase().includes(q));
  if (!tickets.length) { $("graph").innerHTML = '<div class="empty" style="margin-top:12px">No tickets yet. Talk to the Supervisor with <code>orchestra chat</code>.</div>'; return; }
  const byId = Object.fromEntries(tickets.map((t) => [t.id, t]));
  const depth = {}; const d = (t) => depth[t.id] ??= 1 + Math.max(0, ...t.depends_on.filter((x) => byId[x]).map((x) => d(byId[x])));
  tickets.forEach(d);
  const W = 200, H = 46, GX = 60, GY = 18, PAD = 24;
  const groups = s.milestones.map((m) => ({ m, tickets: tickets.filter((t) => t.milestone_id === m.id) })).filter((g) => g.tickets.length);
  let y = 10; const pos = {}; const gboxes = [];
  for (const g of groups) {
    const cols = {}; g.tickets.forEach((t) => (cols[depth[t.id]] ??= []).push(t));
    const nCols = Math.max(...Object.keys(cols).map(Number)), rows = Math.max(...Object.values(cols).map((c) => c.length));
    const top = y;
    Object.entries(cols).forEach(([c, list]) => list.forEach((t, i) => { pos[t.id] = { x: PAD + (c - 1) * (W + GX), y: top + 28 + i * (H + GY) }; }));
    const h = 28 + rows * (H + GY) + 6; gboxes.push({ g, top, h, w: PAD * 2 + nCols * (W + GX) - GX }); y += h + 24;
  }
  const width = Math.max(700, ...gboxes.map((b) => b.w + 10));
  let svg = `<svg viewBox="0 0 ${width} ${y}" style="min-height:${Math.max(400, y)}px"><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5368"/></marker></defs>`;
  for (const b of gboxes) svg += `<g class="group"><rect x="4" y="${b.top}" width="${b.w}" height="${b.h}"/><text x="14" y="${b.top + 17}">${esc(b.g.m.id)} · ${esc(b.g.m.name)}${b.g.m.status === "closed" ? " (closed)" : ""}</text></g>`;
  for (const t of tickets) for (const dep of t.depends_on) { const a = pos[dep], b = pos[t.id]; if (!a || !b) continue;
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2; svg += `<path class="edge" d="M${x1},${y1} C${x1 + 30},${y1} ${x2 - 30},${y2} ${x2},${y2}"/>`; }
  for (const t of tickets) { const p = pos[t.id]; const act = ["IN_PROGRESS", "IN_REVIEW", "MERGING"].includes(t.state);
    const waiting = t.state === "OPEN" && !t.ready;
    const label = t.state === "OPEN" ? (t.ready ? "OPEN · ready" : "OPEN · " + (t.waiting_on && t.waiting_on.length ? "waits " + t.waiting_on.join(",") : "closed")) : t.state;
    svg += `<g class="node ${act ? "active" : ""} ${waiting ? "waiting" : ""}" transform="translate(${p.x},${p.y})" onclick="openTicket('${t.id}')"><rect width="${W}" height="${H}" fill="${color(t.state)}" fill-opacity="${waiting ? ".45" : ".85"}" ${waiting ? 'stroke-dasharray="5 3"' : ""}/>
      <text x="8" y="17" style="font-weight:700">${esc(t.id)} <tspan style="font-weight:400;fill:#e6e8ee">${esc(label)}</tspan></text><text x="8" y="34">${esc(t.title.slice(0, 32))}${t.title.length > 32 ? "…" : ""}</text><title>${esc(t.why_waiting || t.state)}</title></g>`; }
  $("graph").innerHTML = svg + "</svg>";
}
$("filter").addEventListener("input", render);
refresh(); setInterval(refresh, 2500);
openFromHash();
</script>
</body>
</html>
