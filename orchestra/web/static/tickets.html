<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra · Tickets</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
<style>
  .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:8px 10px; border-bottom:1px solid var(--border); background:var(--panel) }
  .toolbar label { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center }
  .toolbar button { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px }
  .toolbar .filter { margin:0; width:260px }
  #stage { height:calc(100vh - 44px - 43px); overflow:hidden; cursor:grab; background:radial-gradient(ellipse at 50% 40%, #10141c 0%, var(--bg) 70%) } #stage.dragging { cursor:grabbing }
  #stage svg { width:100%; height:100%; min-height:0; display:block }
  .ms { cursor:pointer } .ms rect { fill:var(--panel2); stroke:var(--accent); stroke-width:1.5; rx:10 } .ms.closed rect { stroke:var(--muted); stroke-dasharray:4 3 }
  .ms text { fill:var(--text); font-size:11px; pointer-events:none } .ms .sub { fill:var(--muted) }
  .edge.ms-edge { stroke:#2f3645; stroke-dasharray:3 3; marker-end:none } .edge.collapsed { stroke:#6ea8fe; stroke-dasharray:6 3 }
  .edge.ms-chain { stroke:#7c86a0; stroke-width:2.4; stroke-opacity:.9 }
  .node { cursor:grab } .node.dragging { cursor:grabbing }
</style>
</head>
<body>
<nav id="nav"><a href="/">Dashboard</a><a href="/tickets" class="on">Tickets</a><span class="muted" id="proj"></span><span class="muted" id="conn" style="margin-left:auto"></span></nav>
<div class="toolbar">
  <input id="filter" class="filter" placeholder="filter (id, title, state, milestone)">
  <label><input type="checkbox" id="collapse" checked> collapse done into milestone</label>
  <button onclick="expandAll()">expand all</button><button onclick="collapseAll()">collapse all</button>
  <button onclick="fit()">fit</button><button onclick="reheat()">shake</button>
  <span id="legend" class="muted"></span>
  <span class="muted hint" style="margin-left:auto">drag nodes · drag or scroll to pan · pinch or ⌘/ctrl+scroll to zoom · click a milestone to toggle</span>
</div>
<div id="stage"><svg id="svg"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4b5368"/></marker>
  <marker id="arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6ea8fe"/></marker>
  <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c86a0"/></marker>
</defs><g id="view"><g id="edges"></g><g id="nodes"></g></g></svg></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDrawer()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js?v={{v}}"></script>
<script>
let STATE = null;
const view = { x: 20, y: 20, k: 1 };
const expanded = new Set();
const DONE = new Set(["DONE", "CANCELLED"]);
const TW = 200, TH = 46, MW = 170, MH = 46;
const ACTIVE = new Set(["IN_PROGRESS", "IN_REVIEW", "MERGING"]);

async function refresh() {
  try { STATE = await (await fetch("/api/state")).json(); renderNav("tickets", STATE.project); $("conn").textContent = "live"; render(); }
  catch (e) { if ($("conn")) $("conn").textContent = "disconnected"; }
}

// ---- graph model: milestone nodes + visible tickets + rerouted edges ----------------
function buildModel(s) {
  const q = $("filter").value.trim().toLowerCase();
  const collapse = $("collapse").checked;
  const byId = Object.fromEntries(s.tickets.map((t) => [t.id, t]));
  const nodes = {}, edges = new Map();
  const addEdge = (from, to, cls) => { if (from !== to) edges.set(`${from}->${to}`, { source: from, target: to, cls }); };
  const ordered = [...s.milestones].sort((a, b) => a.order - b.order || a.id.localeCompare(b.id, undefined, { numeric: true }));
  ordered.forEach((m, mi) => {
    const all = s.tickets.filter((t) => t.milestone_id === m.id);
    const done = all.filter((t) => DONE.has(t.state));
    const isCollapsed = (m.status === "closed" || (collapse && all.length > 0 && done.length === all.length)) && !expanded.has(m.id);
    const hideDone = (collapse || m.status === "closed") && !expanded.has(m.id);
    let visible = isCollapsed ? [] : (hideDone ? all.filter((t) => !DONE.has(t.state)) : all);
    if (q) visible = visible.filter((t) => [t.id, t.title, t.state, m.id, m.name].join(" ").toLowerCase().includes(q));
    nodes[`ms:${m.id}`] = { id: `ms:${m.id}`, kind: "ms", m, mi, total: all.length, done: done.length, collapsed: isCollapsed, hidden: all.length - visible.length, w: MW, h: MH };
    for (const t of visible) nodes[t.id] = { id: t.id, kind: "ticket", t, mi, w: TW, h: TH };
  });
  for (const t of s.tickets) for (const dep of t.depends_on) {
    const d = byId[dep]; if (!d || !nodes[t.id]) continue;
    if (nodes[dep]) addEdge(dep, t.id, "dep");
    else if (DONE.has(d.state)) addEdge(`ms:${d.milestone_id}`, t.id, "collapsed");
  }
  for (let i = 1; i < ordered.length; i++) addEdge(`ms:${ordered[i - 1].id}`, `ms:${ordered[i].id}`, "ms-chain");
  for (const n of Object.values(nodes)) if (n.kind === "ticket" && !n.t.depends_on.some((d) => nodes[d])) addEdge(`ms:${n.t.milestone_id}`, n.id, "ms-edge");
  // Dependency depth drives a gentle left-to-right flow; milestone order a gentle top-to-bottom one.
  const depth = {};
  const dOf = (id) => { if (depth[id] !== undefined) return depth[id]; const n = nodes[id]; depth[id] = 0;
    if (n.kind === "ticket") depth[id] = 1 + Math.max(0, ...n.t.depends_on.filter((x) => nodes[x]).map(dOf)); return depth[id]; };
  Object.keys(nodes).forEach(dOf);
  for (const n of Object.values(nodes)) n.depth = depth[n.id];
  return { nodes: Object.values(nodes), edges: [...edges.values()] };
}

// ---- force simulation ------------------------------------------------------------------
let sim = null, simNodes = [], simLinks = [], lastKey = "";
const posMemory = new Map();   // id -> {x, y}; keeps the picture stable across refreshes

function layout(model) {
  const key = model.nodes.map((n) => n.id).sort().join("|") + "#" + model.edges.map((e) => e.source + ">" + e.target).sort().join("|");
  if (key === lastKey && sim) return false;
  lastKey = key;
  // Each milestone gets a horizontal band: narrow when collapsed to a single node, wide
  // enough for its dependency depth when expanded, so the progression stays compact.
  const bands = []; let x0 = 140;
  const byMi = {}; model.nodes.forEach((n) => (byMi[n.mi] ??= []).push(n));
  Object.keys(byMi).map(Number).sort((a, b) => a - b).forEach((mi) => {
    const maxDepth = Math.max(0, ...byMi[mi].map((n) => n.depth));
    bands[mi] = x0; x0 += maxDepth ? 260 + maxDepth * 210 : 300;
  });
  const targetX = (n) => bands[n.mi] + n.depth * 210;
  simNodes = model.nodes.map((n) => { const p = posMemory.get(n.id); return Object.assign(n, p ? { x: p.x, y: p.y } : { x: targetX(n) + (Math.random() - .5) * 40, y: 300 + (n.kind === "ticket" ? (Math.random() - .5) * 400 : 0) }); });
  simLinks = model.edges.map((e) => ({ ...e }));
  if (sim) sim.stop();
  sim = d3.forceSimulation(simNodes)
    .force("link", d3.forceLink(simLinks).id((d) => d.id)
      .distance((l) => l.cls === "ms-chain" ? 300 : l.cls === "ms-edge" ? 170 : l.cls === "collapsed" ? 240 : 190)
      .strength((l) => l.cls === "ms-edge" ? 0.35 : l.cls === "ms-chain" ? 0.5 : 0.8))
    .force("charge", d3.forceManyBody().strength((d) => d.kind === "ms" ? -1100 : -650).distanceMax(900))
    .force("collide", d3.forceCollide((d) => d.kind === "ms" ? 100 : 118).iterations(2))
    // Left-to-right progression: the first milestone is pulled furthest left, each later one
    // further right, and within a milestone deeper dependencies sit further right. Vertical
    // position is left to repulsion, so clusters spread by relationship, not by rule.
    .force("x", d3.forceX(targetX).strength((d) => d.kind === "ms" ? 0.6 : 0.3))
    .force("y", d3.forceY(300).strength((d) => d.kind === "ms" ? 0.12 : 0.03))
    .alpha(0.9).alphaDecay(0.035)
    .on("tick", tick)
    .on("end", () => { simNodes.forEach((n) => posMemory.set(n.id, { x: n.x, y: n.y })); });
  // Settle most of the way synchronously so the page opens on a readable picture instead
  // of a cloud of nodes converging; the remaining animation is gentle.
  sim.tick(Math.min(200, 60 + simNodes.length * 3));
  sim.alpha(0.15);
  if (!fitted) { tick(); fit(); fitted = true; }
  return true;
}
let fitted = false;
function reheat() { if (sim) sim.alpha(0.8).restart(); }

// ---- render: DOM built per model, positions updated per tick -----------------------------
function render() {
  const s = STATE; if (!s) return;
  $("legend").innerHTML = Object.entries(s.counts).filter(([, v]) => v).map(([k, v]) => `<span class="badge" style="background:${color(k)}">${k} ${v}</span>`).join(" ");
  if (!s.tickets.length) { $("nodes").innerHTML = `<text x="20" y="40" fill="#8a90a3">No tickets yet. Talk to the Supervisor on the dashboard.</text>`; $("edges").innerHTML = ""; return; }
  const model = buildModel(s);
  const changed = layout(model);
  // Node and edge DOM: rebuilt each refresh (labels and states change), positioned by tick().
  $("edges").innerHTML = simLinks.map((e, i) => `<path id="e${i}" class="edge ${e.cls}${e.cls === "dep" && ACTIVE.has(e.target.t ? e.target.t.state : "") ? " into-active" : ""}" ${e.cls === "collapsed" ? 'marker-end="url(#arrow-c)"' : e.cls === "ms-chain" ? 'marker-end="url(#arrow-m)"' : ""}/>`).join("");
  $("nodes").innerHTML = simNodes.map((n) => {
    if (n.kind === "ms") {
      const sub = n.collapsed ? `${n.done}/${n.total} done · collapsed` : n.hidden ? `${n.done}/${n.total} done · ${n.hidden} hidden` : `${n.done}/${n.total} done`;
      return `<g class="ms ${n.m.status}" data-id="${esc(n.id)}" onclick="toggleMilestone('${n.m.id}')"><rect width="${n.w}" height="${n.h}"/>
        <text x="10" y="18" style="font-weight:700">${esc(n.m.id)} ${esc(n.m.name.slice(0, 16))}</text><text class="sub" x="10" y="34">${esc(sub)}</text><title>${esc(n.m.name)}: click to ${n.collapsed || n.hidden ? "expand" : "collapse"}</title></g>`;
    }
    const t = n.t, active = ACTIVE.has(t.state), queued = t.state === "APPROVED" || t.state === "READY_FOR_REVIEW", done = DONE.has(t.state), waiting = t.state === "OPEN" && !t.ready;
    const label = t.state === "OPEN" ? (t.ready ? "READY" : (t.waiting_on && t.waiting_on.length ? "WAITS " + t.waiting_on.join(",") : "CLOSED")) : t.state.replace(/_/g, " ");
    const cls = ["node", active ? "active" : "", queued ? "queued" : "", done ? "done" : "", waiting ? "waiting" : ""].join(" ");
    return `<g class="${cls}" data-id="${esc(n.id)}" style="--c:${color(t.state)}" onclick="if(!dragMoved)openTicket('${t.id}')">
      <rect class="card-bg" width="${n.w}" height="${n.h}"/><rect class="bar" width="6" height="${n.h}" fill="${color(t.state)}"/>
      <text x="14" y="17" style="font-weight:700;fill:#e6e8ee">${esc(t.id)}</text>
      <text class="pill" x="${n.w - 8}" y="17" text-anchor="end" fill="${color(t.state)}">${esc(label)}</text>
      <text class="title" x="14" y="34" fill="#c9d1d9">${esc(t.title.slice(0, 30))}${t.title.length > 30 ? "…" : ""}</text>
      <title>${esc(t.why_waiting || t.state)}: ${esc(t.title)}</title></g>`;
  }).join("");
  wireNodeDrag();
  tick();
}

function edgeEnd(a, b) {  // point on b's box boundary along the a->b line
  const dx = b.x - a.x, dy = b.y - a.y, hw = b.w / 2, hh = b.h / 2;
  if (!dx && !dy) return [b.x, b.y];
  const t = Math.min(hw / Math.abs(dx || 1e-9), hh / Math.abs(dy || 1e-9));
  return [b.x - dx * t, b.y - dy * t];
}
let tickCount = 0;
function tick() {
  // Follow the layout as it settles on first load, then leave the view alone.
  simNodes.forEach((n) => { const g = document.querySelector(`[data-id="${CSS.escape(n.id)}"]`); if (g) g.setAttribute("transform", `translate(${(n.x - n.w / 2).toFixed(1)},${(n.y - n.h / 2).toFixed(1)})`); });
  simLinks.forEach((e, i) => { const p = $(`e${i}`); if (!p || typeof e.source !== "object") return;
    const [x2, y2] = edgeEnd(e.source, e.target), [x1, y1] = edgeEnd(e.target, e.source);
    const mx = (x1 + x2) / 2 + (y2 - y1) * 0.12, my = (y1 + y2) / 2 - (x2 - x1) * 0.12;
    p.setAttribute("d", `M${x1.toFixed(1)},${y1.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`); });
}

// ---- node dragging (fixes the node in the simulation while held) -------------------------
let dragMoved = false;
function wireNodeDrag() {
  document.querySelectorAll("#nodes > g").forEach((g) => {
    g.addEventListener("mousedown", (e) => {
      e.stopPropagation(); const n = simNodes.find((x) => x.id === g.dataset.id); if (!n) return;
      dragMoved = false; const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y; g.classList.add("dragging");
      const move = (ev) => { const dx = (ev.clientX - sx) / view.k, dy = (ev.clientY - sy) / view.k; if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true; n.fx = ox + dx; n.fy = oy + dy; if (sim) sim.alpha(Math.max(sim.alpha(), 0.25)).restart(); };
      const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); g.classList.remove("dragging"); n.fx = null; n.fy = null; posMemory.set(n.id, { x: n.x, y: n.y }); setTimeout(() => { dragMoved = false; }, 0); };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    });
  });
}

// ---- interaction -------------------------------------------------------------------------
function toggleMilestone(id) { if (expanded.has(id)) expanded.delete(id); else expanded.add(id); render(); }
function expandAll() { STATE.milestones.forEach((m) => expanded.add(m.id)); render(); }
function collapseAll() { expanded.clear(); render(); }
function applyView() { $("view").setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`); }
function fit() {
  if (!simNodes.length) return;
  const xs = simNodes.map((n) => n.x - n.w / 2), ys = simNodes.map((n) => n.y - n.h / 2), xe = simNodes.map((n) => n.x + n.w / 2), ye = simNodes.map((n) => n.y + n.h / 2);
  const minX = Math.min(...xs), minY = Math.min(...ys), w = Math.max(...xe) - minX, h = Math.max(...ye) - minY;
  const st = $("stage").getBoundingClientRect();
  view.k = Math.min(1.4, Math.max(0.12, Math.min((st.width - 60) / w, (st.height - 60) / h)));
  view.x = 30 - minX * view.k + ((st.width - 60) - w * view.k) / 2; view.y = 30 - minY * view.k; applyView();
}
(function wire() {
  const stage = $("stage"); let drag = null, moved = false;
  stage.addEventListener("mousedown", (e) => { if (e.button !== 0) return; moved = false; drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; stage.classList.add("dragging"); });
  window.addEventListener("mousemove", (e) => { if (!drag) return; if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) moved = true; view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); applyView(); });
  window.addEventListener("mouseup", () => { drag = null; stage.classList.remove("dragging"); });
  stage.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); } }, true);
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1, dx = e.deltaX * scale, dy = e.deltaY * scale;
    if (e.ctrlKey || e.metaKey) {
      const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const factor = Math.exp(Math.max(-40, Math.min(40, -dy)) * 0.006), k = Math.min(3, Math.max(0.1, view.k * factor));
      view.x = mx - (mx - view.x) * (k / view.k); view.y = my - (my - view.y) * (k / view.k); view.k = k;
    } else { view.x -= dx; view.y -= dy; }
    applyView();
  }, { passive: false });
  let touch = null;
  const dist = (ts) => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  const mid = (ts) => [(ts[0].clientX + ts[1].clientX) / 2, (ts[0].clientY + ts[1].clientY) / 2];
  stage.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, vx: view.x, vy: view.y, moved: false };
    else if (e.touches.length === 2) touch = { d: dist(e.touches), k: view.k, m: mid(e.touches), vx: view.x, vy: view.y, moved: true };
  }, { passive: true });
  stage.addEventListener("touchmove", (e) => {
    if (!touch) return; e.preventDefault();
    if (e.touches.length === 1 && touch.d === undefined) { const dx = e.touches[0].clientX - touch.x, dy = e.touches[0].clientY - touch.y; if (Math.abs(dx) + Math.abs(dy) > 4) touch.moved = true; view.x = touch.vx + dx; view.y = touch.vy + dy; applyView(); }
    else if (e.touches.length === 2 && touch.d !== undefined) { const r = stage.getBoundingClientRect(), m = mid(e.touches), mx = m[0] - r.left, my = m[1] - r.top; const k = Math.min(3, Math.max(0.1, touch.k * dist(e.touches) / touch.d)); view.x = mx - (mx - touch.vx) * (k / touch.k) + (m[0] - touch.m[0]); view.y = my - (my - touch.vy) * (k / touch.k) + (m[1] - touch.m[1]); view.k = k; applyView(); }
  }, { passive: false });
  stage.addEventListener("touchend", (e) => { if (touch && touch.moved) moved = true; if (!e.touches.length) touch = null; }, { passive: true });
})();
$("filter").addEventListener("input", render);
$("collapse").addEventListener("change", render);
refresh(); setInterval(refresh, 2500);
openFromHash();
</script>
</body>
</html>
