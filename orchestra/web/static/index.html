<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra</title>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
<nav id="nav"><a href="/" class="on">Dashboard</a><a href="/tickets">Tickets</a><span class="muted" id="proj"></span><span class="muted" id="conn" style="margin-left:auto"></span></nav>
<div class="layout">
  <div class="col"><h2>Agents</h2><div id="agents"></div></div>
  <div class="col"><h2>Merge gate</h2><div id="queue"></div></div>
  <div class="col">
    <h2>System</h2>
    <div class="panel">
      <div class="cores" id="cores"></div>
      <div class="meters">
        <div class="meter"><div class="lbl"><span>memory</span><span id="mem-lbl"></span></div><div class="bar"><i id="mem-bar"></i></div></div>
        <div class="meter"><div class="lbl"><span>disk</span><span id="disk-lbl"></span></div><div class="bar"><i id="disk-bar"></i></div></div>
      </div>
      <div class="muted" id="load" style="font-size:11px;margin-top:6px"></div>
    </div>
    <h2>Staging environment</h2>
    <div class="panel" id="staging-head"></div>
    <div class="term" id="staging"></div>
  </div>
</div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDrawer()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js?v={{v}}"></script>
<script>
const BASE_AGENTS = [["supervisor", "supervisor"], ["coordinator", "coordinator"], ["pipeline-manager", "pipeline_manager"]];
const TERMINAL = ["DONE", "CANCELLED"];
let STATE = null;

async function refresh() {
  try {
    STATE = await (await fetch("/api/state")).json();
    renderNav("dashboard", STATE.project); $("conn").textContent = "live";
    renderAgents(STATE); renderQueue(STATE);
  } catch (e) { $("conn").textContent = "disconnected"; }
}

function baseCard(id, kind, s) {
  const running = s && s.status === "running";
  return `<div class="card ${running ? "" : "idle"}" style="border-left-color:${kindColor(kind)}" onclick="openTranscript('${id}')">
    <div class="t"><span><span class="dot ${running ? "" : "off"}"></span>${id}</span><span class="muted">${running ? ago(STATE.now - (s.started_at || STATE.now)) : (s ? "idle" : "no session yet")}</span></div>
    <div class="m">${esc(s ? (s.last_text || "") : "")}</div></div>`;
}

function agentLine(label, s) {
  if (!s) return `<div class="line"><span><b>${label}</b> —</span></div>`;
  const running = s.status === "running";
  const right = running ? `<span class="dot"></span>${ago(STATE.now - (s.started_at || STATE.now))}` : "idle";
  return `<div class="line" onclick="event.stopPropagation();openTranscript('${s.id}')" title="open transcript"><span><b>${label}</b> ${esc(s.last_text || "")}</span><span>${right}</span></div>`;
}

function renderAgents(s) {
  const byId = Object.fromEntries(s.sessions.map((x) => [x.id, x]));
  let html = BASE_AGENTS.map(([id, kind]) => baseCard(id, kind, byId[id])).join("");
  // One card per ticket that has a worker or reviewer session and is not finished.
  const cards = s.tickets.filter((t) => !TERMINAL.includes(t.state) && (byId[`worker-${t.id}`] || byId[`reviewer-${t.id}`]))
    .map((t) => ({ t, w: byId[`worker-${t.id}`], r: byId[`reviewer-${t.id}`] }))
    .sort((a, b) => ((b.w?.status === "running" || b.r?.status === "running") ? 1 : 0) - ((a.w?.status === "running" || a.r?.status === "running") ? 1 : 0));
  html += `<h2>Tickets in work (${cards.length})</h2>` + (cards.map(({ t, w, r }) => {
    const live = (w && w.status === "running") || (r && r.status === "running");
    return `<div class="card ${live ? "" : "idle"}" style="border-left-color:${color(t.state)}" onclick="openTicket('${t.id}')">
      <div class="t"><span>${esc(t.id)} <span class="muted" style="font-weight:400">${esc(t.title)}</span></span><span class="badge" style="background:${color(t.state)}">${t.state}</span></div>
      ${agentLine("worker", w)}${agentLine("reviewer", r)}</div>`;
  }).join("") || '<div class="empty">no tickets being worked</div>');
  $("agents").innerHTML = html;
}

const stageLine = (st) => `<div class="stage"><span>${esc(st.stage)}:${esc(st.name)}</span><span class="${st.status === "passed" ? "ok" : "bad"}">${st.status}${st.duration ? " " + st.duration + "s" : ""}</span></div>`;
const ticketRow = (t, extra) => `<div class="queue-item" onclick="openTicket('${t.id}')"><div class="t">${esc(t.id)} ${esc(t.title)}</div><div class="m">${extra}</div></div>`;

function renderQueue(s) {
  const byT = Object.fromEntries(s.tickets.map((t) => [t.id, t]));
  const cur = (s.gate_runs || []).find((r) => r.status === "running");
  let html = s.pipeline.paused ? `<div class="panel bad">PIPELINE PAUSED: ${esc(s.pipeline.reason)}</div>` : "";
  html += `<h2>In this gate run</h2>`;
  if (cur) {
    html += cur.batch.map((id) => byT[id] ? ticketRow(byT[id], `commit ${esc((byT[id].reviewed_commit || "").slice(0, 10))}`) : "").join("");
    html += `<div class="panel" onclick="openGateRun('${cur.id}')" style="cursor:pointer"><div class="kv"><div>run</div><div>${cur.id}</div><div>started</div><div>${ago(s.now - Date.parse(cur.started_at) / 1000)} ago</div></div>${(cur.stages || []).map(stageLine).join("") || '<div class="muted">assembling…</div>'}</div>`;
  } else html += `<div class="empty">gate idle</div>`;
  const queue = s.tickets.filter((t) => t.state === "APPROVED").sort((a, b) => a.state_since.localeCompare(b.state_since));
  const n = s.batch_size || 1;
  html += `<h2>Next gate run</h2>` + (queue.slice(0, n).map((t) => ticketRow(t, `approved ${ago(s.now - Date.parse(t.state_since) / 1000)} ago · commit ${esc((t.reviewed_commit || "").slice(0, 10))}`)).join("") || '<div class="empty">nothing approved yet</div>');
  if (queue.length > n) html += `<h2>Waiting for a later run (${queue.length - n})</h2>` + queue.slice(n).map((t) => ticketRow(t, `approved ${ago(s.now - Date.parse(t.state_since) / 1000)} ago`)).join("");
  const upstream = s.tickets.filter((t) => ["IN_REVIEW", "READY_FOR_REVIEW", "REJECTED", "IN_PROGRESS"].includes(t.state));
  html += `<h2>On the way (${upstream.length})</h2>` + (upstream.map((t) => `<div class="row" onclick="openTicket('${t.id}')"><span>${esc(t.id)} ${esc(t.title)}</span><span class="badge" style="background:${color(t.state)}">${t.state}</span></div>`).join("") || '<div class="empty">nothing in flight</div>');
  $("queue").innerHTML = html;
}

const SYSTEM_POLL_MS = 2000;
let coreBars = [];

async function refreshSystem() {
  try {
    const d = await (await fetch("/api/system")).json();
    // Hue runs blue (idle) -> green -> yellow -> red (saturated).
    const hue = (p) => Math.round(210 - 210 * Math.min(100, Math.max(0, p)) / 100);
    if (coreBars.length !== d.cpu_percent.length) {
      // Build the bars once; afterwards only their styles change, so CSS transitions
      // carry each bar from the previous sample to the new one over the poll interval.
      $("cores").innerHTML = d.cpu_percent.map((_, i) => `<div class="core" title="core ${i}"><i style="height:2%;transition-duration:${SYSTEM_POLL_MS}ms"></i></div>`).join("");
      coreBars = Array.from($("cores").querySelectorAll(".core"));
    }
    d.cpu_percent.forEach((p, i) => {
      const bar = coreBars[i]; const fill = bar.firstElementChild;
      bar.title = `core ${i}: ${p}%`;
      fill.style.height = `${Math.max(2, Math.round(p))}%`;
      fill.style.background = `linear-gradient(to top, hsl(210,80%,50%), hsl(${hue(p)},90%,55%))`;
    });
    $("mem-lbl").textContent = `${d.memory.percent}% · ${fmtBytes(d.memory.used)} / ${fmtBytes(d.memory.total)}`;
    $("mem-bar").style.width = `${d.memory.percent}%`;
    $("disk-lbl").textContent = `${d.disk.percent}% · ${fmtBytes(d.disk.used)} / ${fmtBytes(d.disk.total)}`;
    $("disk-bar").style.width = `${d.disk.percent}%`;
    $("load").textContent = `${d.cpu_percent.length} cores · load ${d.load.join(" / ")}`;
  } catch (e) {}
}

async function refreshStaging() {
  try {
    const d = await (await fetch("/api/staging")).json();
    const head = $("staging-head");
    if (!d.configured) head.innerHTML = '<span class="empty">not configured: add a [staging] section to orchestra.toml</span>';
    else if (!d.current_build_id) head.innerHTML = '<span class="empty">no build deployed yet: the gate deploys the next landed build, or run <code>orchestra staging deploy</code></span>';
    else {
      const cls = d.status === "running" && d.alive ? "ok" : d.status === "starting" ? "" : "bad";
      head.innerHTML = `<div class="kv"><div>status</div><div class="${cls}">${esc(d.status)}${d.alive ? "" : " (process not running)"}</div>
        <div>build</div><div>${esc(d.current_build_id)} · ${esc((d.build && d.build.commit || "").slice(0, 10))}</div>
        <div>deployed</div><div>${d.deployed_at ? esc(d.deployed_at) : "—"}</div>
        <div>local</div><div><a href="${esc(d.local_url || "")}" target="_blank">${esc(d.local_url || "")}</a></div>
        ${d.public_url ? `<div>public</div><div><a href="${esc(d.public_url)}" target="_blank">${esc(d.public_url)}</a></div>` : ""}
        ${d.previous_build_id ? `<div>previous</div><div>${esc(d.previous_build_id)}</div>` : ""}</div>`;
    }
    const el = $("staging"); const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    el.innerHTML = highlightLog(d.log || "");
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch (e) {}
}

refresh(); refreshSystem(); refreshStaging();
setInterval(refresh, 2500); setInterval(refreshSystem, SYSTEM_POLL_MS); setInterval(refreshStaging, 3000);
try { const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/events"); ws.onmessage = () => refresh(); } catch (e) {}
</script>
</body>
</html>
