<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra</title>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
<style>
  /* the Dashboard: panels as sections of one page on a grid (dashboard.js) */
  body { overflow-y:auto }
  #board { margin:3px }
  .dpanel { background:var(--panel); border:1px solid var(--border); border-radius:3px; display:flex; flex-direction:column; overflow:hidden !important }
  .dhead { display:flex; align-items:baseline; gap:8px; padding:5px 10px; border-bottom:1px solid var(--border); background:var(--panel2); cursor:move; user-select:none; flex:none }
  .dhead h1 { font-size:12px; margin:0; letter-spacing:.02em; text-transform:uppercase; color:var(--text2) }
  .dhead .sub { font-size:11px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .dhead .dx { background:none; border:0; color:var(--muted); cursor:pointer; font-size:11px; padding:0 2px; opacity:0 } .dpanel:hover .dx { opacity:.7 } .dhead .dx:hover { opacity:1; color:var(--text) }
  .dbody { padding:8px 10px; overflow:auto; flex:1; min-height:0 }
  .dbody > .panel { background:none; border:0; border-bottom:1px solid var(--border); border-radius:0; padding:4px 0 8px; margin:0 0 8px } .dbody > .panel:last-child { border-bottom:0; margin:0 }
  .grid-stack-placeholder > .placeholder-content { background:rgba(110,168,254,.08); border:1px dashed var(--accent); border-radius:3px }
  .grid-stack > .grid-stack-item > .ui-resizable-se { filter:invert(1); opacity:.35 }
  #panels-menu { position:relative; margin-left:auto } #panels-menu + #conn { margin-left:12px !important }
  .pmenu[hidden] { display:none } .pmenu { position:absolute; right:0; top:28px; z-index:30; background:var(--panel2); border:1px solid var(--border2); border-radius:8px; padding:6px; display:grid; gap:4px; min-width:200px; box-shadow:0 8px 24px rgba(0,0,0,.4) }
  .pmenu button { text-align:left; background:var(--panel3); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:5px 8px; font:inherit; font-size:12px; cursor:pointer } .pmenu button:hover { border-color:var(--accent) }
  .mline { display:grid; grid-template-columns:10px max-content max-content minmax(0, 1fr); gap:8px; align-items:center; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:12.5px }
  .mline:hover { background:var(--panel3) } .mline + .mline { border-top:1px solid var(--border) }
  .mline .d { width:8px; height:8px; border-radius:50% } .mline b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .mline > span:nth-child(3) { display:flex; gap:4px; flex-wrap:nowrap } .mline .k { font-size:10px; padding:0 6px; border-radius:999px; border:1px solid var(--border2); color:var(--text2); white-space:nowrap }
  .mline .r { text-align:right; color:var(--muted); font-size:11.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
</style>
</head>
<body>
<nav id="nav"><a href="/" class="on">Dashboard</a><a href="/machines">Machines</a><a href="/instruments">Instruments</a><a href="/dynamics">Dynamics</a><a href="/core">Core</a><span class="muted" id="proj"></span><span class="muted" id="conn" style="margin-left:auto"></span></nav>
<div class="grid-stack" id="board"></div>
<div id="tip" class="tip" hidden></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeMachine()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js?v={{v}}"></script>
<script src="/static/machine-dialog.js?v={{v}}"></script>
<script>
// Orchestra's own panels: the machines running now, and the host. A package adds its own
// (Orchestra.panels.register, from its every-page script); dashboard.js lays them all out.
let MACHINES = null;
Orchestra.machineList = () => (MACHINES && MACHINES.machines) || [];

// ---- Machines: a short list of what runs now (continuous machines, and any other while it is
// active); a click opens the machine's dialog. Every machine is on the Machines page.
Orchestra.panels.register({ id: "machines", title: "Machines", size: { w: 5, h: 9 }, mount(body, ui) {
  async function refresh() {
    try {
      MACHINES = await (await fetch("/api/machines?era=all")).json();
      $("conn").textContent = "live";
      if (!MACHINES.ok) { body.innerHTML = `<div class="empty">${esc(MACHINES.error)}</div>`; return; }
      const run = MACHINES.machines.filter((m) => !m.unseen && (m.mode === "continuous" || m.active));
      ui.setSub(`${run.length} running · ${run.filter((m) => m.active).length} active now · ${MACHINES.machines.length} on the Machines page`);
      body.innerHTML = run.length ? Orchestra.machineCards.sort(run).map((m) => {
        const kind = m.kind || "";
        const own = Orchestra.machineCards.summary(m);
        const right = own != null ? own : m.last_seen ? `${m.active ? "active" : "quiet"} · last event ${ago(Date.now() / 1000 - m.last_seen)} ago` : "";
        return `<div class="mline" data-id="${esc(m.id)}" onclick="openMachine(this.dataset.id)" title="click for its details">
          <span class="d" style="background:${m.active ? "#22c55e" : "#64748b"}"></span><b>${esc(m.id)}</b>
          <span>${kind ? `<span class="k">${esc(kind)}</span> ` : ""}${m.mode ? `<span class="k">${esc(m.mode)}</span>` : ""}${m.package ? `<span class="k" title="the package this machine belongs to">${esc(m.package)}</span>` : ""}</span>
          <span class="r">${right}</span></div>`;
      }).join("") : `<div class="empty">Nothing is running: no continuous machine, and nothing has published in the last two minutes.</div>`;
    } catch (e) { $("conn").textContent = "disconnected"; }
  }
  refresh(); setInterval(refresh, 5000);
  document.addEventListener("orchestra:machinecards", refresh);
} });

// ---- Host: the Core services in a line, and the machine Orchestra runs on
Orchestra.panels.register({ id: "host", title: "Host", size: { w: 7, h: 9 }, mount(body, ui) {
  body.innerHTML = `<a class="panel corestrip" id="corestrip" href="/core" title="Orchestra's fundamental services: the Core page">Core …</a>
    <div class="panel" style="margin-bottom:0">
      <div class="lbl-row"><span>GPU <select id="gpu-range" class="range"><option value="60">1m</option><option value="240" selected>4m</option><option value="900">15m</option><option value="3600">1h</option></select></span><span id="gpu-lbl" class="num">—</span></div>
      <svg id="gpu" class="gpu" viewBox="0 0 300 64" preserveAspectRatio="none"><path id="gpu-area"/><path id="gpu-line"/><line id="gpu-cursor" x1="0" x2="0" y1="0" y2="64"/></svg>
      <div class="lbl-row" style="margin-top:8px"><span>CPU</span><span id="cpu-lbl" class="num"></span></div>
      <div class="cores" id="cores"></div>
      <div class="meters">
        <div class="meter"><div class="lbl"><span>memory</span><span id="mem-lbl" class="num"></span></div><div class="bar"><i id="mem-bar"></i></div></div>
        <div class="meter"><div class="lbl"><span>disk</span><span id="disk-lbl" class="num"></span></div><div class="bar"><i id="disk-bar"></i></div></div>
      </div>
      <div class="muted num" id="load" style="font-size:11px;margin-top:8px"></div>
    </div>`;
  HOST_SUB = ui.setSub;
  wireRanges(); refreshSystem(); refreshCoreStrip();
  setInterval(refreshSystem, SYSTEM_POLL_MS); setInterval(refreshCoreStrip, 5000);
} });
let HOST_SUB = () => {};
// ---- a one-line Core status; the detail is on the Core page ----
async function refreshCoreStrip() {
  try {
    const c = await (await fetch("/api/core")).json();
    const led = (ok) => `<span class="cled" style="background:${ok ? "#22c55e" : "#ef4444"}"></span>`;
    $("corestrip").innerHTML = `<b>Core</b> ${led(c.host.ok && c.host.loop && c.host.loop.alive)} host ${c.host.loop && c.host.loop.alive ? "running" : "stopped"} · ${led(c.bus.ok)} bus ${esc(c.bus.backend || "")} · ${led(c.metrics.ok)} metrics ${esc(c.metrics.backend || "")} <span class="muted" style="margin-left:auto">open →</span>`;
  } catch (e) { $("corestrip").innerHTML = `<b>Core</b> <span class="cled" style="background:#ef4444"></span> unreachable`; }
}

const SYSTEM_POLL_MS = 2000; let coreBars = [];
const RANGE_KEYS = ["gpu-range"];
function rangeOf(id) { return Number($(id).value); }
function wireRanges() { RANGE_KEYS.forEach((id) => {
  try { const v = localStorage.getItem("orchestra." + id); if (v && [...$(id).options].some((o) => o.value === v)) $(id).value = v; } catch (e) {}
  $(id).addEventListener("change", () => { try { localStorage.setItem("orchestra." + id, $(id).value); } catch (e) {} ({ "gpu-range": refreshSystem })[id](); });
  $(id).addEventListener("click", (e) => e.stopPropagation());
}); }
async function refreshSystem() {
  try {
    const d = await (await fetch(`/api/system?gpu_window=${rangeOf("gpu-range")}`)).json();
    // One solid colour per bar, chosen by its load on a blue -> green -> yellow -> red scale,
    // and crossfaded over the poll interval, so a core ramping from idle to busy visibly
    // shifts colour over time rather than carrying a static gradient.
    const loadColor = (p) => { const q = Math.min(100, Math.max(0, p)) / 100; const hue = 215 - 215 * q; const sat = 70 + 25 * q; const light = 48 + 10 * q; return `hsl(${hue.toFixed(0)},${sat.toFixed(0)}%,${light.toFixed(0)}%)`; };
    if (coreBars.length !== d.cpu_percent.length) {
      $("cores").innerHTML = d.cpu_percent.map((_, i) => `<div class="core" title="core ${i}"><i style="height:2%;background-color:${loadColor(0)};transition-duration:${SYSTEM_POLL_MS}ms"></i></div>`).join("");
      coreBars = Array.from($("cores").querySelectorAll(".core"));
    }
    d.cpu_percent.forEach((p, i) => { const f = coreBars[i].firstElementChild; coreBars[i].title = `core ${i}: ${p}%`; f.style.height = `${Math.max(2, Math.round(p))}%`; f.style.backgroundColor = loadColor(p); });
    const avg = Math.round(d.cpu_percent.reduce((a, b) => a + b, 0) / d.cpu_percent.length);
    $("cpu-lbl").textContent = `${avg}% avg`;
    $("mem-lbl").textContent = `${d.memory.percent}% · ${fmtBytes(d.memory.used)} / ${fmtBytes(d.memory.total)}`; $("mem-bar").style.width = `${d.memory.percent}%`;
    $("disk-lbl").textContent = `${d.disk.percent}% · ${fmtBytes(d.disk.used)} / ${fmtBytes(d.disk.total)}`; $("disk-bar").style.width = `${d.disk.percent}%`;
    $("load").textContent = `${d.cpu_percent.length} cores · load ${d.load.join(" / ")}`;
    HOST_SUB(d.gpu ? `gpu ${d.gpu.utilization}% · cpu ${avg}%` : `cpu ${avg}%`);
    renderGpu(d);
  } catch (e) {}
}
function renderGpu(d) {
  if (!d.gpu) { $("gpu-lbl").textContent = "not available on this host"; return; }
  const h = d.gpu_history, W = 300, H = 64, win = d.gpu_window || 240, now = d.now;
  const pts = h.map((s) => [W * (1 - (now - s.t) / win), H - (H - 2) * s.u / 100]).filter((p) => p[0] >= -5);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  $("gpu-line").setAttribute("d", line); $("gpu-area").setAttribute("d", pts.length ? line + ` L${W},${H} L${pts[0][0].toFixed(1)},${H} Z` : "");
  const last = pts[pts.length - 1]; if (last) { $("gpu-cursor").setAttribute("x1", last[0]); $("gpu-cursor").setAttribute("x2", last[0]); }
  $("gpu-lbl").textContent = `${d.gpu.utilization}% · ${fmtBytes(d.gpu.memory_used)} in use`;
  $("gpu").setAttribute("title", `GPU utilization, last ${win >= 3600 ? win / 3600 + "h" : win / 60 + "m"}`);
}

</script>
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
<script src="/static/dashboard.js?v={{v}}"></script>
</body>
</html>
