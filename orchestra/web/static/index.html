<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
<nav id="nav"><a href="/" class="on">Dashboard</a><a href="/tickets">Tickets</a><a href="/machines">Machines</a><a href="/core">Core</a><span class="muted" id="proj"></span><span class="muted" id="conn" style="margin-left:auto"></span></nav>
<div class="tabs"><button class="on" onclick="showCol(0,this)">Machines</button><button onclick="showCol(1,this)">Host</button></div>
<div class="layout two">
  <div class="col on">
    <div class="col-head"><h1>Machines</h1><span class="sub" id="machines-sub"></span></div>
    <div id="machines"></div>
  </div>
  <div class="col">
    <div class="col-head"><h1>Host</h1><span class="sub" id="host-sub"></span></div>
    <a class="panel corestrip" id="corestrip" href="/core" title="Orchestra's fundamental services: the Core page">Core …</a>
    <div class="panel">
      <div class="lbl-row"><span>GPU <select id="gpu-range" class="range"><option value="60">1m</option><option value="240" selected>4m</option><option value="900">15m</option><option value="3600">1h</option></select></span><span id="gpu-lbl" class="num">—</span></div>
      <svg id="gpu" class="gpu" viewBox="0 0 300 64" preserveAspectRatio="none"><path id="gpu-area"/><path id="gpu-line"/><line id="gpu-cursor" x1="0" x2="0" y1="0" y2="64"/></svg>
      <div class="lbl-row" style="margin-top:8px"><span>CPU</span><span id="cpu-lbl" class="num"></span></div>
      <div class="cores" id="cores"></div>
      <div class="meters">
        <div class="meter"><div class="lbl"><span>memory</span><span id="mem-lbl" class="num"></span></div><div class="bar"><i id="mem-bar"></i></div></div>
        <div class="meter"><div class="lbl"><span>disk</span><span id="disk-lbl" class="num"></span></div><div class="bar"><i id="disk-bar"></i></div></div>
      </div>
      <div class="muted num" id="load" style="font-size:11px;margin-top:8px"></div>
    </div>
    <h2>Staging environment</h2>
    <div class="panel env" id="staging-head"></div>
    <div class="term" id="staging"></div>
  </div>
</div>
<div id="tip" class="tip" hidden></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDrawer()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js?v={{v}}"></script>
<script>
function showCol(i, btn) {
  document.querySelectorAll(".layout > .col").forEach((c, j) => c.classList.toggle("on", j === i));
  document.querySelectorAll(".tabs button").forEach((b, j) => b.classList.toggle("on", j === i));
  try { localStorage.setItem("orchestra.tab", String(i)); } catch (e) {}
}
try { const t = Number(localStorage.getItem("orchestra.tab") || 0); if (t) showCol(t); } catch (e) {}
const TERMINAL = ["DONE", "CANCELLED"];
let STATE = null, MACHINES = null, CORE = null, PROBE = null;

async function refresh() {
  try {
    const [st, mc] = await Promise.all([fetch("/api/state").then((r) => r.json()), fetch("/api/machines").then((r) => r.json())]);
    STATE = st; MACHINES = mc;
    renderNav("dashboard", STATE.project); $("conn").textContent = "live";
    renderMachines();
  } catch (e) { $("conn").textContent = "disconnected"; }
}

// ---- machines that are running now; every machine is on the Machines page ----
function renderMachines() {
  const all = MACHINES.machines, ms = all.filter((m) => !MACHINE_STOPPED.includes(m.status));
  const working = ms.reduce((n, m) => n + m.jobs.length, 0);
  $("machines-sub").textContent = `${ms.length} of ${all.length} running · ${working} job${working === 1 ? "" : "s"}`;
  $("machines").innerHTML = ms.map((m) => machineCard(m, { controls: m.id === "worker" && STATE ? `<div class="mctl">${capacityCtl(STATE)}${STATE.pickup_paused ? "<span>new work PAUSED</span>" : ""}<button class="ctl ${STATE.pickup_paused ? "paused" : ""}" onclick="event.stopPropagation();togglePause()">${STATE.pickup_paused ? "▶ resume" : "⏸ pause new work"}</button></div>` : "" })).join("")
    || `<div class="empty">No machines running. Machines that run inside Orchestra come up with <code>orchestra run</code>. Every machine, running or not, is on the <a href="/machines">Machines</a> page.</div>`;
}

async function control(body) {
  const r = await fetch("/api/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) alert(await r.text()); refresh();
}
function capacityCtl(s) {
  const c = s.capacity || {};
  const step = (kind, n) => `<button class="ctl" style="padding:0 6px" onclick="event.stopPropagation();setCapacity('${kind}',${n})" title="${n < 0 ? "one fewer" : "one more"} ${kind}">${n < 0 ? "−" : "+"}</button>`;
  return `<span title="Concurrent workers and reviewers: the machines' capacity.">${step("workers", -1)}<b>${c.max_workers ?? "?"}</b>${step("workers", 1)} workers · ${step("reviewers", -1)}<b>${c.max_reviewers ?? "?"}</b>${step("reviewers", 1)} reviewers</span>`;
}
function setCapacity(kind, delta) {
  const c = (STATE && STATE.capacity) || {};
  const body = { action: "capacity", workers: c.max_workers, reviewers: c.max_reviewers };
  body[kind] = Math.max(0, (c["max_" + kind] || 0) + delta);
  control(body);
}
function togglePause() { control({ action: STATE && STATE.pickup_paused ? "resume" : "pause" }); }

// ---- a one-line Core status; the detail is on the Core page ----
async function refreshCoreStrip() {
  try {
    const c = await (await fetch("/api/core")).json();
    const led = (ok) => `<span class="cled" style="background:${ok ? "#22c55e" : "#ef4444"}"></span>`;
    $("corestrip").innerHTML = `<b>Core</b> ${led(c.host.ok && c.host.loop && c.host.loop.alive)} host ${c.host.loop && c.host.loop.alive ? "running" : "loop stopped"} · ${led(c.bus.ok)} bus ${esc(c.bus.backend || "")} · ${led(c.metrics.ok)} metrics ${esc(c.metrics.backend || "")} <span class="muted" style="margin-left:auto">open →</span>`;
  } catch (e) { $("corestrip").innerHTML = `<b>Core</b> <span class="cled" style="background:#ef4444"></span> unreachable`; }
}

const SYSTEM_POLL_MS = 2000; let coreBars = [];
const RANGE_KEYS = ["gpu-range"];
function rangeOf(id) { return Number($(id).value); }
RANGE_KEYS.forEach((id) => {
  try { const v = localStorage.getItem("orchestra." + id); if (v && [...$(id).options].some((o) => o.value === v)) $(id).value = v; } catch (e) {}
  $(id).addEventListener("change", () => { try { localStorage.setItem("orchestra." + id, $(id).value); } catch (e) {} ({ "gpu-range": refreshSystem })[id](); });
  $(id).addEventListener("click", (e) => e.stopPropagation());
});
async function refreshSystem() {
  try {
    const d = await (await fetch(`/api/system?gpu_window=${rangeOf("gpu-range")}`)).json();
    // One solid colour per bar, chosen by its load on a blue -> green -> yellow -> red scale,
    // and crossfaded over the poll interval, so a core ramping from idle to busy visibly
    // shifts colour over time rather than carrying a static gradient.
    const loadColor = (p) => { const q = Math.min(100, Math.max(0, p)) / 100; const hue = 215 - 215 * q; const sat = 70 + 25 * q; const light = 48 + 10 * q; return `hsl(${hue.toFixed(0)},${sat.toFixed(0)}%,${light.toFixed(0)}%)`; };
    if (coreBars.length !== d.cpu_percent.length) {
      $("cores").innerHTML = d.cpu_percent.map((_, i) => `<div class="core" title="core ${i}"><i style="height:2%;background-color:${loadColor(0)};transition-duration:${SYSTEM_POLL_MS}ms"></i></div>`).join("");
      coreBars = Array.from($("cores").querySelectorAll(".core"));
    }
    d.cpu_percent.forEach((p, i) => { const f = coreBars[i].firstElementChild; coreBars[i].title = `core ${i}: ${p}%`; f.style.height = `${Math.max(2, Math.round(p))}%`; f.style.backgroundColor = loadColor(p); });
    const avg = Math.round(d.cpu_percent.reduce((a, b) => a + b, 0) / d.cpu_percent.length);
    $("cpu-lbl").textContent = `${avg}% avg`;
    $("mem-lbl").textContent = `${d.memory.percent}% · ${fmtBytes(d.memory.used)} / ${fmtBytes(d.memory.total)}`; $("mem-bar").style.width = `${d.memory.percent}%`;
    $("disk-lbl").textContent = `${d.disk.percent}% · ${fmtBytes(d.disk.used)} / ${fmtBytes(d.disk.total)}`; $("disk-bar").style.width = `${d.disk.percent}%`;
    $("load").textContent = `${d.cpu_percent.length} cores · load ${d.load.join(" / ")}`;
    $("host-sub").textContent = d.gpu ? `gpu ${d.gpu.utilization}% · cpu ${avg}%` : `cpu ${avg}%`;
    renderGpu(d);
  } catch (e) {}
}
function renderGpu(d) {
  if (!d.gpu) { $("gpu-lbl").textContent = "not available on this host"; return; }
  const h = d.gpu_history, W = 300, H = 64, win = d.gpu_window || 240, now = d.now;
  const pts = h.map((s) => [W * (1 - (now - s.t) / win), H - (H - 2) * s.u / 100]).filter((p) => p[0] >= -5);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  $("gpu-line").setAttribute("d", line); $("gpu-area").setAttribute("d", pts.length ? line + ` L${W},${H} L${pts[0][0].toFixed(1)},${H} Z` : "");
  const last = pts[pts.length - 1]; if (last) { $("gpu-cursor").setAttribute("x1", last[0]); $("gpu-cursor").setAttribute("x2", last[0]); }
  $("gpu-lbl").textContent = `${d.gpu.utilization}% · ${fmtBytes(d.gpu.memory_used)} in use`;
  $("gpu").setAttribute("title", `GPU utilization, last ${win >= 3600 ? win / 3600 + "h" : win / 60 + "m"}`);
}

async function refreshStaging() {
  try {
    const d = await (await fetch("/api/staging")).json();
    const head = $("staging-head");
    const ok = d.status === "running" && d.alive;
    head.style.setProperty("--ec", !d.configured ? "var(--muted)" : ok ? "#22c55e" : d.status === "starting" ? "#f59e0b" : "#ef4444");
    if (!d.configured) head.innerHTML = '<span class="muted">Not configured. Add a [staging] section to orchestra.toml.</span>';
    else if (!d.current_build_id) head.innerHTML = '<span class="muted">No build deployed yet. The gate deploys the next landed build, or run <code>orchestra staging deploy</code>.</span>';
    else head.innerHTML = `<div class="kv"><div>status</div><div><span class="led"></span>${esc(d.status)}${d.alive ? "" : " (process not running)"}</div>
        <div>build</div><div class="num">${esc(d.current_build_id)} · ${esc((d.build && d.build.commit || "").slice(0, 10))}</div>
        <div>deployed</div><div class="num">${d.deployed_at ? esc(d.deployed_at) : "—"}</div>
        <div>local</div><div><a href="${esc(d.local_url || "")}" target="_blank">${esc(d.local_url || "")}</a></div>
        ${d.public_url ? `<div>public</div><div><a href="${esc(d.public_url)}" target="_blank">${esc(d.public_url)}</a></div>` : ""}
        ${d.previous_build_id ? `<div>previous</div><div class="num">${esc(d.previous_build_id)}</div>` : ""}</div>`;
    const el = $("staging"); const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    el.innerHTML = highlightLog(d.log || "");
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch (e) {}
}

refresh(); refreshSystem(); refreshStaging(); refreshCoreStrip();
setInterval(refresh, 2500); setInterval(refreshSystem, SYSTEM_POLL_MS); setInterval(refreshStaging, 3000); setInterval(refreshCoreStrip, 5000);
openFromHash();
try { const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/events"); ws.onmessage = () => refresh(); } catch (e) {}
</script>
</body>
</html>
