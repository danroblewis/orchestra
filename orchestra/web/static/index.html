<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav id="nav"></nav>
<div class="layout">
  <div class="col"><h2>Agents</h2><div id="agents"></div></div>
  <div class="col"><h2>Merge queue</h2><div id="queue"></div></div>
  <div class="col">
    <h2>System</h2>
    <div class="panel">
      <div class="cores" id="cores"></div>
      <div class="meters">
        <div class="meter"><div class="lbl"><span>memory</span><span id="mem-lbl"></span></div><div class="bar"><i id="mem-bar" style="width:0"></i></div></div>
        <div class="meter"><div class="lbl"><span>disk</span><span id="disk-lbl"></span></div><div class="bar"><i id="disk-bar" style="width:0"></i></div></div>
      </div>
      <div class="muted" id="load" style="font-size:11px;margin-top:6px"></div>
    </div>
    <h2>Staging environment</h2>
    <div class="term" id="staging"></div>
  </div>
</div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDrawer()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js"></script>
<script>
const BASE_AGENTS = [["supervisor", "supervisor"], ["coordinator", "coordinator"], ["pipeline-manager", "pipeline_manager"]];
let STATE = null;

async function refresh() {
  try {
    STATE = await (await fetch("/api/state")).json();
    renderNav("dashboard", STATE.project); $("conn").textContent = "live";
    renderAgents(STATE); renderQueue(STATE);
  } catch (e) { if ($("conn")) $("conn").textContent = "disconnected"; }
}

function agentCard(s, ticket, fixed) {
  const running = s && s.status === "running";
  const elapsed = running && s.started_at ? ago(STATE.now - s.started_at) : "";
  const kind = s ? s.kind : fixed;
  const last = s ? (s.last_text || "") : "no session yet";
  return `<div class="card ${running ? "" : "idle"}" style="border-left-color:${kindColor(kind)}" onclick="openTranscript('${esc(s ? s.id : fixed)}')">
    <div class="t"><span><span class="dot ${running ? "" : "off"}"></span>${esc(s ? s.id : fixed)}</span><span class="muted">${running ? elapsed : (s ? "idle" : "")}</span></div>
    ${ticket ? `<div class="tk">${esc(ticket.id)} · ${esc(ticket.title)}</div>` : ""}
    <div class="m">${esc(last)}</div></div>`;
}

function renderAgents(s) {
  const byId = Object.fromEntries(s.sessions.map((x) => [x.id, x]));
  const byT = Object.fromEntries(s.tickets.map((t) => [t.id, t]));
  let html = BASE_AGENTS.map(([id, kind]) => agentCard(byId[id], null, id)).join("");
  const others = s.sessions.filter((x) => !BASE_AGENTS.some(([id]) => id === x.id));
  const running = others.filter((x) => x.status === "running").sort((a, b) => (a.started_at || 0) - (b.started_at || 0));
  const idle = others.filter((x) => x.status !== "running").sort((a, b) => (b.settled_at || 0) - (a.settled_at || 0)).slice(0, 12);
  html += `<h2>Working (${running.length})</h2>` + (running.map((x) => agentCard(x, byT[x.ticket_id])).join("") || '<div class="empty">no workers or reviewers running</div>');
  if (idle.length) html += `<h2>Recent</h2>` + idle.map((x) => agentCard(x, byT[x.ticket_id])).join("");
  $("agents").innerHTML = html;
}

function stageLine(st) {
  return `<div class="stage"><span>${esc(st.stage)}:${esc(st.name)}</span><span class="${st.status === "passed" ? "ok" : "bad"}">${st.status}${st.duration ? " " + st.duration + "s" : ""}</span></div>`;
}

function renderQueue(s) {
  const byT = Object.fromEntries(s.tickets.map((t) => [t.id, t]));
  const runs = s.gate_runs || [];
  const cur = runs.find((r) => r.status === "running");
  let html = s.pipeline.paused ? `<div class="panel bad">PIPELINE PAUSED: ${esc(s.pipeline.reason)}</div>` : "";
  html += `<h2>Now merging</h2>`;
  if (cur) {
    html += `<div class="panel" onclick="openGateRun('${cur.id}')" style="cursor:pointer"><div class="kv"><div>run</div><div>${cur.id}</div><div>batch</div><div>${cur.batch.map((id) => `${id} ${esc((byT[id] || {}).title || "")}`).join("<br>")}</div><div>started</div><div>${ago(s.now - Date.parse(cur.started_at) / 1000)} ago</div></div>${(cur.stages || []).map(stageLine).join("")}</div>`;
  } else html += `<div class="empty">gate idle</div>`;
  const queue = s.tickets.filter((t) => t.state === "APPROVED").sort((a, b) => a.state_since.localeCompare(b.state_since));
  html += `<h2>Queued (${queue.length})</h2>` + (queue.map((t, i) => `<div class="queue-item" onclick="openTicket('${t.id}')"><div class="t">${i + 1}. ${esc(t.id)} ${esc(t.title)}</div><div class="m">approved ${ago(s.now - Date.parse(t.state_since) / 1000)} ago · commit ${esc((t.reviewed_commit || "").slice(0, 10))}</div></div>`).join("") || '<div class="empty">nothing approved</div>');
  const upstream = s.tickets.filter((t) => ["READY_FOR_REVIEW", "IN_REVIEW", "IN_PROGRESS", "REJECTED"].includes(t.state));
  html += `<h2>Upstream (${upstream.length})</h2>` + (upstream.map((t) => `<div class="row" onclick="openTicket('${t.id}')"><span>${esc(t.id)} ${esc(t.title)}</span><span class="badge" style="background:${color(t.state)}">${t.state}</span></div>`).join("") || '<div class="empty">nothing in flight</div>');
  const hist = runs.filter((r) => r.status !== "running").slice(-12).reverse();
  html += `<h2>History</h2>` + (hist.map((r) => `<div class="row" onclick="openGateRun('${r.id}')"><span><span class="${r.status === "landed" ? "ok" : "bad"}">${r.status}</span> ${r.batch.join(", ")} <span class="muted">${esc(r.summary || "")}</span></span><span class="muted">${r.finished_at ? ago(s.now - Date.parse(r.finished_at) / 1000) : ""}</span></div>`).join("") || '<div class="empty">no gate runs yet</div>');
  $("queue").innerHTML = html;
}

async function refreshSystem() {
  try {
    const d = await (await fetch("/api/system")).json();
    $("cores").innerHTML = d.cpu_percent.map((p, i) => `<div class="core ${p > 85 ? "hot" : p > 50 ? "warm" : ""}" title="core ${i}: ${p}%"><i style="height:${Math.max(2, p)}%"></i></div>`).join("");
    $("mem-lbl").textContent = `${d.memory.percent}% · ${fmtBytes(d.memory.used)} / ${fmtBytes(d.memory.total)}`;
    $("mem-bar").style.width = `${d.memory.percent}%`;
    $("disk-lbl").textContent = `${d.disk.percent}% · ${fmtBytes(d.disk.used)} / ${fmtBytes(d.disk.total)}`;
    $("disk-bar").style.width = `${d.disk.percent}%`;
    $("load").textContent = `${d.cpu_percent.length} cores · load ${d.load.join(" / ")}`;
  } catch (e) {}
}

async function refreshStaging() {
  try {
    const d = await (await fetch("/api/staging")).json();
    const el = $("staging"); const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    el.textContent = d.log || (d.configured ? `[staging: ${d.status}]` : "[staging not configured: add a [staging] section to orchestra.toml; the gate promotes landed builds here]");
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch (e) {}
}

refresh(); refreshSystem(); refreshStaging();
setInterval(refresh, 2500); setInterval(refreshSystem, 2000); setInterval(refreshStaging, 3000);
try { const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/events"); ws.onmessage = () => refresh(); } catch (e) {}
</script>
</body>
</html>
