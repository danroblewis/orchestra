<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
<nav id="nav"><a href="/" class="on">Dashboard</a><a href="/tickets">Tickets</a><a href="/agents">Agents</a><span class="muted" id="proj"></span><span class="muted" id="conn" style="margin-left:auto"></span></nav>
<div class="tabs"><button class="on" onclick="showCol(0,this)">Agents</button><button onclick="showCol(1,this)">Merge gate</button><button onclick="showCol(2,this)">Host</button></div>
<div class="layout">
  <div class="col on">
    <div class="col-head"><h1>Agents</h1><span class="sub"><span id="agents-sub"></span> <button id="pause-btn" class="ctl" onclick="togglePause()" title="Pause or resume starting new workers">⏸ pause</button></span></div>
    <div id="agents"></div>
  </div>
  <div class="col">
    <div class="col-head"><h1>Merge gate</h1><span class="sub" id="gate-sub"></span></div>
    <h2><span>Burndown <select id="burn-range" class="range"><option value="1">1h</option><option value="6">6h</option><option value="24" selected>24h</option><option value="72">3d</option><option value="168">7d</option><option value="720">30d</option></select></span><span class="count" id="burn-sum"></span></h2>
    <div class="panel"><svg id="burndown" class="landings" viewBox="0 0 300 100" preserveAspectRatio="none"></svg><div class="lbl-row"><span id="burn-from"></span><span><span style="color:#6ea8fe">■</span> remaining &nbsp;<span style="color:#6f7889">■</span> total &nbsp;now</span></div></div>
    <h2><span>Landings <select id="land-range" class="range"><option value="6">6h</option><option value="24" selected>24h</option><option value="72">3d</option><option value="168">7d</option><option value="720">30d</option></select></span><span class="count" id="land-sum"></span></h2>
    <div class="panel"><svg id="landings" class="landings" viewBox="0 0 300 90" preserveAspectRatio="none"></svg><div class="lbl-row"><span id="land-from"></span><span>now</span></div></div>
    <div id="queue"></div>
  </div>
  <div class="col">
    <div class="col-head"><h1>Host</h1><span class="sub" id="host-sub"></span></div>
    <div class="panel">
      <div class="lbl-row"><span>GPU <select id="gpu-range" class="range"><option value="60">1m</option><option value="240" selected>4m</option><option value="900">15m</option><option value="3600">1h</option></select></span><span id="gpu-lbl" class="num">—</span></div>
      <svg id="gpu" class="gpu" viewBox="0 0 300 64" preserveAspectRatio="none"><path id="gpu-area"/><path id="gpu-line"/><line id="gpu-cursor" x1="0" x2="0" y1="0" y2="64"/></svg>
      <div class="lbl-row" style="margin-top:8px"><span>CPU</span><span id="cpu-lbl" class="num"></span></div>
      <div class="cores" id="cores"></div>
      <div class="meters">
        <div class="meter"><div class="lbl"><span>memory</span><span id="mem-lbl" class="num"></span></div><div class="bar"><i id="mem-bar"></i></div></div>
        <div class="meter"><div class="lbl"><span>disk</span><span id="disk-lbl" class="num"></span></div><div class="bar"><i id="disk-bar"></i></div></div>
      </div>
      <div class="muted num" id="load" style="font-size:11px;margin-top:8px"></div>
    </div>
    <h2>Staging environment</h2>
    <div class="panel env" id="staging-head"></div>
    <div class="term" id="staging"></div>
  </div>
</div>
<div id="tip" class="tip" hidden></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeDrawer()"><div id="drawer" class="drawer"></div></div>
<script src="/static/app.js?v={{v}}"></script>
<script>
function showCol(i, btn) {
  document.querySelectorAll(".layout > .col").forEach((c, j) => c.classList.toggle("on", j === i));
  document.querySelectorAll(".tabs button").forEach((b, j) => b.classList.toggle("on", j === i));
  try { localStorage.setItem("orchestra.tab", String(i)); } catch (e) {}
}
try { const t = Number(localStorage.getItem("orchestra.tab") || 0); if (t) showCol(t); } catch (e) {}
const BASE_AGENTS = [["supervisor", "supervisor", "S"], ["coordinator", "coordinator", "C"], ["pipeline-manager", "pipeline_manager", "P"]];
const ROLE_COLOR = { supervisor: "var(--r-supervisor)", coordinator: "var(--r-coordinator)", pipeline_manager: "var(--r-pipeline)", worker: "var(--r-worker)", reviewer: "var(--r-reviewer)" };
const TERMINAL = ["DONE", "CANCELLED"];
let STATE = null;

async function refresh() {
  try {
    STATE = await (await fetch("/api/state")).json();
    renderNav("dashboard", STATE.project); $("conn").textContent = "live";
    renderAgents(STATE); renderQueue(STATE);
  } catch (e) { $("conn").textContent = "disconnected"; }
}

function chip(s) { return sessionChip(s, STATE.now); }

function renderAgents(s) {
  const byId = Object.fromEntries(s.sessions.map((x) => [x.id, x]));
  const live = s.sessions.filter((x) => x.status === "running").length;
  $("agents-sub").textContent = `${live} turn${live === 1 ? "" : "s"} running` + ` · capacity ${s.capacity ? s.capacity.workers : "?"} workers` + (s.pickup_paused ? " · PAUSED" : "");
  const pb = $("pause-btn"); pb.textContent = s.pickup_paused ? "▶ resume" : "⏸ pause"; pb.classList.toggle("paused", !!s.pickup_paused);
  const customs = (s.roles || []).filter((r) => !r.builtin).map((r) => [r.session_id, r.name, r.name[0].toUpperCase(), r]);
  let html = [...BASE_AGENTS, ...customs].map(([id, kind, letter, r]) => {
    const x = byId[id];
    const paused = r && r.paused;
    return `<div class="agent" style="--rc:${ROLE_COLOR[kind] || "#94a3b8"}" onclick="openTranscript('${id}')">
      <div class="av">${letter}</div><div><div class="name">${id}</div><div class="role">${r ? esc(r.description || "custom role") : kind.replace("_", " ")}</div></div>${paused ? '<span class="chip"><span class="dot"></span>paused</span>' : chip(x)}
      <div class="say">${esc(x && x.alive ? (x.last_text || "waiting for work") : (r && r.session === "ephemeral" ? "ephemeral: runs when woken" : "not running: start `orchestra run`"))}</div></div>`;
  }).join("");
  const isLive = (x) => x && x.status === "running";
  const cards = s.tickets.filter((t) => !TERMINAL.includes(t.state) && (byId[`worker-${t.id}`] || byId[`reviewer-${t.id}`]))
    .map((t) => ({ t, w: byId[`worker-${t.id}`], r: byId[`reviewer-${t.id}`] }))
    .sort((a, b) => Number(isLive(b.w) || isLive(b.r)) - Number(isLive(a.w) || isLive(a.r)));
  const lane = (who, x) => x ? `<div class="lane"><span class="who">${who}</span><span class="msg">${esc(x.last_text || "")}</span>${isLive(x) ? chip(x) : '<span class="muted">idle</span>'}</div>` : "";
  html += `<h2><span>Tickets in work</span><span class="count">${cards.length}</span></h2>` + (cards.map(({ t, w, r }) =>
    `<div class="work" style="--c:${color(t.state)}" onclick="openTicket('${t.id}')"><div class="top"><span><span class="id">${esc(t.id)}</span> <span class="title">${esc(t.title)}</span></span><span class="right">${turns(t)}<span class="pill">${t.state.replace(/_/g, " ")}</span></span></div>${lane("worker", w)}${lane("reviewer", r)}</div>`).join("")
    || '<div class="empty">No tickets being worked. Ready tickets start as soon as a worker slot is free.</div>');
  $("agents").innerHTML = html;
}

// How many times the worker has been re-engaged on this ticket, and why. Shown only once
// there is a second turn, so a clean first attempt stays uncluttered.
function turns(t) {
  if (!t.worker_turns || t.worker_turns < 2) return "";
  const parts = [];
  if (t.reviewer_rejections) parts.push(`${t.reviewer_rejections} review`);
  if (t.gate_rejections) parts.push(`${t.gate_rejections} gate`);
  const other = t.worker_turns - 1 - (t.reviewer_rejections || 0) - (t.gate_rejections || 0);
  if (other > 0) parts.push(`${other} retry`);
  const why = parts.length ? ` · ${parts.join(" · ")}` : "";
  const title = `worker opened ${t.worker_turns} times: ${t.reviewer_rejections || 0} after a reviewer rejection, ${t.gate_rejections || 0} after the merge gate sent it back` + (other > 0 ? `, ${other} after a crash, timeout, or operator stop` : "");
  return `<span class="turns" title="${esc(title)}">↺ turn ${t.worker_turns}${why}</span>`;
}

function renderQueue(s) {
  const byT = Object.fromEntries(s.tickets.map((t) => [t.id, t]));
  const cur = (s.gate_runs || []).find((r) => r.status === "running");
  const queue = s.tickets.filter((t) => t.state === "APPROVED").sort((a, b) => a.state_since.localeCompare(b.state_since));
  const last = [...(s.gate_runs || [])].reverse().find((r) => r.status !== "running");
  const bs = s.batch_size || 1;
  $("gate-sub").textContent = cur ? "running" : queue.length ? `${queue.length} waiting` : "idle";
  let html = s.pipeline.paused ? `<div class="banner">Pipeline paused<div style="font-weight:400;margin-top:4px">${esc(s.pipeline.reason)}</div></div>` : "";
  html += `<h2><span>In this run</span><span class="count">${cur ? cur.batch.length : 0}</span></h2>`;
  if (cur) {
    const plan = ["assemble", "build", "unit", "start", "acceptance"];
    const got = new Map((cur.stages || []).map((st) => [st.stage, st]));
    const failed = (cur.stages || []).some((st) => st.status === "failed");
    let marked = false;
    const steps = plan.map((p) => { const st = got.get(p); let cls = st ? (st.status === "passed" ? "pass" : "fail") : ""; if (!st && !failed && !marked) { cls = "run"; marked = true; } return { p, st, cls }; });
    html += `<div class="run"><div class="hdr"><b>${cur.id}</b><span class="muted num">${ago(s.now - Date.parse(cur.started_at) / 1000)}</span></div>
      ${cur.batch.map((id) => `<div class="qitem" onclick="openTicket('${id}')"><div class="n">▶</div><div><span class="id">${esc(id)}</span> ${esc((byT[id] || {}).title || "")}</div></div>`).join("")}
      <div class="steps">${steps.map((x) => `<div class="step ${x.cls}"><span class="ic"></span><span>${x.p}${x.st ? " · " + esc(x.st.name) : ""}</span><span class="t">${x.st ? (x.st.duration ? x.st.duration + "s" : x.st.status) : ""}</span></div>`).join("")}</div>
      <a href="#" class="muted" style="font-size:11px" onclick="openGateRun('${cur.id}');return false">open run</a></div>`;
  } else html += `<div class="empty">${last ? `Gate idle. Last run ${esc(last.status)}: ${esc(last.summary || "")}` : "Gate idle. Nothing has been through it yet."}</div>`;
  html += `<h2><span>Next run</span><span class="count">${Math.min(queue.length, bs)}</span></h2>`;
  html += (queue.slice(0, bs).map((t, i) => `<div class="qitem" onclick="openTicket('${t.id}')"><div class="n">${i + 1}</div><div><span class="id">${esc(t.id)}</span> ${esc(t.title)}<div class="m">approved ${ago(s.now - Date.parse(t.state_since) / 1000)} ago · ${esc((t.reviewed_commit || "").slice(0, 10))}</div></div></div>`).join("")
    || '<div class="empty">Nothing approved yet. Tickets arrive here after review.</div>');
  if (queue.length > bs) html += `<h2><span>Waiting for a later run</span><span class="count">${queue.length - bs}</span></h2>` +
    queue.slice(bs).map((t, i) => `<div class="qitem" onclick="openTicket('${t.id}')"><div class="n">${i + 1 + bs}</div><div><span class="id">${esc(t.id)}</span> ${esc(t.title)}</div></div>`).join("");
  $("queue").innerHTML = html;
}

async function control(body) {
  const r = await fetch("/api/control", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) alert(await r.text()); refresh();
}
function togglePause() { control({ action: STATE && STATE.pickup_paused ? "resume" : "pause" }); }
function killAgent(id) { if (confirm(`Stop the agent working on ${id}? The ticket goes back to OPEN (or back to review) and its branch and session are kept.`)) control({ action: "kill", ticket: id }); }

const SYSTEM_POLL_MS = 2000; let coreBars = [];
const RANGE_KEYS = ["gpu-range", "burn-range", "land-range"];
function rangeOf(id) { return Number($(id).value); }
RANGE_KEYS.forEach((id) => {
  try { const v = localStorage.getItem("orchestra." + id); if (v && [...$(id).options].some((o) => o.value === v)) $(id).value = v; } catch (e) {}
  $(id).addEventListener("change", () => { try { localStorage.setItem("orchestra." + id, $(id).value); } catch (e) {} ({ "gpu-range": refreshSystem, "burn-range": refreshBurndown, "land-range": refreshLandings })[id](); });
  $(id).addEventListener("click", (e) => e.stopPropagation());
});
async function refreshSystem() {
  try {
    const d = await (await fetch(`/api/system?gpu_window=${rangeOf("gpu-range")}`)).json();
    // One solid colour per bar, chosen by its load on a blue -> green -> yellow -> red scale,
    // and crossfaded over the poll interval, so a core ramping from idle to busy visibly
    // shifts colour over time rather than carrying a static gradient.
    const loadColor = (p) => { const q = Math.min(100, Math.max(0, p)) / 100; const hue = 215 - 215 * q; const sat = 70 + 25 * q; const light = 48 + 10 * q; return `hsl(${hue.toFixed(0)},${sat.toFixed(0)}%,${light.toFixed(0)}%)`; };
    if (coreBars.length !== d.cpu_percent.length) {
      $("cores").innerHTML = d.cpu_percent.map((_, i) => `<div class="core" title="core ${i}"><i style="height:2%;background-color:${loadColor(0)};transition-duration:${SYSTEM_POLL_MS}ms"></i></div>`).join("");
      coreBars = Array.from($("cores").querySelectorAll(".core"));
    }
    d.cpu_percent.forEach((p, i) => { const f = coreBars[i].firstElementChild; coreBars[i].title = `core ${i}: ${p}%`; f.style.height = `${Math.max(2, Math.round(p))}%`; f.style.backgroundColor = loadColor(p); });
    const avg = Math.round(d.cpu_percent.reduce((a, b) => a + b, 0) / d.cpu_percent.length);
    $("cpu-lbl").textContent = `${avg}% avg`;
    $("mem-lbl").textContent = `${d.memory.percent}% · ${fmtBytes(d.memory.used)} / ${fmtBytes(d.memory.total)}`; $("mem-bar").style.width = `${d.memory.percent}%`;
    $("disk-lbl").textContent = `${d.disk.percent}% · ${fmtBytes(d.disk.used)} / ${fmtBytes(d.disk.total)}`; $("disk-bar").style.width = `${d.disk.percent}%`;
    $("load").textContent = `${d.cpu_percent.length} cores · load ${d.load.join(" / ")}`;
    $("host-sub").textContent = d.gpu ? `gpu ${d.gpu.utilization}% · cpu ${avg}%` : `cpu ${avg}%`;
    renderGpu(d);
  } catch (e) {}
}
function renderGpu(d) {
  if (!d.gpu) { $("gpu-lbl").textContent = "not available on this host"; return; }
  const h = d.gpu_history, W = 300, H = 64, win = d.gpu_window || 240, now = d.now;
  const pts = h.map((s) => [W * (1 - (now - s.t) / win), H - (H - 2) * s.u / 100]).filter((p) => p[0] >= -5);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  $("gpu-line").setAttribute("d", line); $("gpu-area").setAttribute("d", pts.length ? line + ` L${W},${H} L${pts[0][0].toFixed(1)},${H} Z` : "");
  const last = pts[pts.length - 1]; if (last) { $("gpu-cursor").setAttribute("x1", last[0]); $("gpu-cursor").setAttribute("x2", last[0]); }
  $("gpu-lbl").textContent = `${d.gpu.utilization}% · ${fmtBytes(d.gpu.memory_used)} in use`;
  $("gpu").setAttribute("title", `GPU utilization, last ${win >= 3600 ? win / 3600 + "h" : win / 60 + "m"}`);
}

let burnData = null, landData = null;
function showTip(ev, html) { const t = $("tip"); t.innerHTML = html; t.hidden = false; const x = ev.clientX + 14, y = ev.clientY + 14; t.style.left = Math.min(x, window.innerWidth - t.offsetWidth - 8) + "px"; t.style.top = Math.min(y, window.innerHeight - t.offsetHeight - 8) + "px"; }
function hideTip() { $("tip").hidden = true; }
const fmtT = (t, hrs) => hrs >= 48 ? new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
(function wireChartHover() {
  const bd = $("burndown");
  bd.addEventListener("mousemove", (ev) => {
    if (!burnData) return;
    const r = bd.getBoundingClientRect(), fx = (ev.clientX - r.left) / r.width;
    const { s, t0, t1, W, H, X, Y } = burnData, tx = t0 + fx * (t1 - t0);
    let p = s[0]; for (const q of s) { if (q.t <= tx) p = q; else break; }
    const xl = $("burn-x"), dot = $("burn-dot"); xl.hidden = false; dot.hidden = false;
    xl.setAttribute("x1", (fx * W).toFixed(1)); xl.setAttribute("x2", (fx * W).toFixed(1)); dot.setAttribute("cx", (fx * W).toFixed(1)); dot.setAttribute("cy", Y(p.remaining).toFixed(1));
    showTip(ev, `<b>${fmtT(tx, rangeOf("burn-range"))}</b><br>remaining <b>${p.remaining}</b> · total <b>${p.total}</b> · done <b>${p.total - p.remaining}</b>`);
  });
  bd.addEventListener("mouseleave", () => { hideTip(); const xl = $("burn-x"), dot = $("burn-dot"); if (xl) { xl.hidden = true; dot.hidden = true; } });
  const ld = $("landings");
  ld.addEventListener("mousemove", (ev) => {
    if (!landData) return;
    const r = ld.getBoundingClientRect(), i = Math.min(landData.buckets.length - 1, Math.max(0, Math.floor((ev.clientX - r.left) / r.width * landData.buckets.length)));
    const b = landData.buckets[i];
    ld.querySelectorAll(".lbar").forEach((el, j) => el.classList.toggle("hover", j === i));
    const span = landData.bucket === 24 ? new Date(b.t * 1000).toLocaleDateString([], { month: "short", day: "numeric" }) : fmtT(b.t, rangeOf("land-range")) + " – " + fmtT(b.t + 3600, 0);
    showTip(ev, `<b>${span}</b><br>landed <b>${b.landed}</b> · gate runs <b>${b.runs}</b>${b.failed ? ` · failed <b>${b.failed}</b>` : ""}`);
  });
  ld.addEventListener("mouseleave", () => { hideTip(); ld.querySelectorAll(".lbar.hover").forEach((el) => el.classList.remove("hover")); });
})();

async function refreshBurndown() {
  try {
    const d = await (await fetch(`/api/burndown?hours=${rangeOf("burn-range")}`)).json();
    const W = 300, H = 100, s = d.series; if (!s.length) return;
    const t0 = s[0].t, t1 = s[s.length - 1].t || t0 + 1, max = Math.max(1, ...s.map((p) => p.total));
    const X = (t) => (W * (t - t0) / Math.max(1, t1 - t0)), Y = (v) => H - 12 - (H - 18) * v / max;
    const step = (key) => s.map((p, i) => (i ? `L${X(p.t).toFixed(1)},${Y(s[i - 1][key]).toFixed(1)} ` : "M") + `${X(p.t).toFixed(1)},${Y(p[key]).toFixed(1)}`).join(" ");
    let svg = "";
    for (let y = 1; y <= 4; y++) { const yy = Y(max * y / 4); svg += `<line x1="0" x2="${W}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" class="grid"/><text class="tick" x="2" y="${(yy - 2).toFixed(1)}">${Math.round(max * y / 4)}</text>`; }
    svg += `<path d="${step("total")}" class="total"/>`;
    svg += `<path d="${step("remaining")} L${W},${(H - 12).toFixed(1)} L0,${(H - 12).toFixed(1)} Z" class="remain-area"/><path d="${step("remaining")}" class="remain"/>`;
    svg += `<line id="burn-x" class="xhair" y1="0" y2="${H - 12}" hidden/><circle id="burn-dot" class="xdot" r="3" hidden/>`;
    $("burndown").innerHTML = svg;
    burnData = { s, t0, t1, max, W, H, X, Y };
    $("burn-sum").textContent = `${d.remaining} remaining of ${d.total}`;
    $("burn-from").textContent = d.hours >= 48 ? new Date(t0 * 1000).toLocaleDateString([], { month: "short", day: "numeric" }) : new Date(t0 * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {}
}

async function refreshLandings() {
  try {
    const hrs = rangeOf("land-range"), bucket = hrs > 72 ? 24 : 1;
    const d = await (await fetch(`/api/landings?hours=${hrs}&bucket=${bucket}`)).json();
    const W = 300, H = 90, pad = 2, n = d.buckets.length, bw = (W - pad * (n + 1)) / n;
    const tickEvery = Math.max(1, Math.round(n / 5));
    const tickLabel = (t) => bucket === 24 ? new Date(t * 1000).toLocaleDateString([], { month: "short", day: "numeric" }) : new Date(t * 1000).getHours() + "h";
    const max = Math.max(1, ...d.buckets.map((b) => b.landed));
    let svg = "";
    for (let y = 1; y <= max && y <= 8; y++) { const yy = H - 12 - (H - 16) * y / max; svg += `<line x1="0" x2="${W}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" class="grid"/>`; }
    d.buckets.forEach((b, i) => {
      const x = pad + i * (bw + pad), hh = (H - 16) * b.landed / max;
      svg += `<rect class="lbar ${b.failed && !b.landed ? "bad" : ""}" x="${x.toFixed(1)}" y="${(H - 12 - hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(hh, b.landed ? 1 : 0).toFixed(1)}"/>`;
      if (i % tickEvery === 0) svg += `<text class="tick" x="${(x + bw / 2).toFixed(1)}" y="${H - 2}" text-anchor="middle">${tickLabel(b.t)}</text>`;
    });
    $("landings").innerHTML = svg;
    landData = d;
    $("land-sum").textContent = `${d.total} in ${hrs >= 24 ? hrs / 24 + "d" : hrs + "h"} · ${d.per_hour}/h`;
    $("land-from").textContent = new Date(d.buckets[0].t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  } catch (e) {}
}

async function refreshStaging() {
  try {
    const d = await (await fetch("/api/staging")).json();
    const head = $("staging-head");
    const ok = d.status === "running" && d.alive;
    head.style.setProperty("--ec", !d.configured ? "var(--muted)" : ok ? "#22c55e" : d.status === "starting" ? "#f59e0b" : "#ef4444");
    if (!d.configured) head.innerHTML = '<span class="muted">Not configured. Add a [staging] section to orchestra.toml.</span>';
    else if (!d.current_build_id) head.innerHTML = '<span class="muted">No build deployed yet. The gate deploys the next landed build, or run <code>orchestra staging deploy</code>.</span>';
    else head.innerHTML = `<div class="kv"><div>status</div><div><span class="led"></span>${esc(d.status)}${d.alive ? "" : " (process not running)"}</div>
        <div>build</div><div class="num">${esc(d.current_build_id)} · ${esc((d.build && d.build.commit || "").slice(0, 10))}</div>
        <div>deployed</div><div class="num">${d.deployed_at ? esc(d.deployed_at) : "—"}</div>
        <div>local</div><div><a href="${esc(d.local_url || "")}" target="_blank">${esc(d.local_url || "")}</a></div>
        ${d.public_url ? `<div>public</div><div><a href="${esc(d.public_url)}" target="_blank">${esc(d.public_url)}</a></div>` : ""}
        ${d.previous_build_id ? `<div>previous</div><div class="num">${esc(d.previous_build_id)}</div>` : ""}</div>`;
    const el = $("staging"); const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
    el.innerHTML = highlightLog(d.log || "");
    if (atBottom) el.scrollTop = el.scrollHeight;
  } catch (e) {}
}

refresh(); refreshSystem(); refreshStaging(); refreshLandings(); refreshBurndown();
setInterval(refresh, 2500); setInterval(refreshSystem, SYSTEM_POLL_MS); setInterval(refreshStaging, 3000); setInterval(refreshLandings, 30000); setInterval(refreshBurndown, 30000);
openFromHash();
try { const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/events"); ws.onmessage = () => refresh(); } catch (e) {}
</script>
