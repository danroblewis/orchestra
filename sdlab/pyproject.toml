[project]
name = "sdlab"
version = "0.1.0"
description = "Design system dynamics models, then apply machines to their flows"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "highspy>=1.15.1",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.30",
    "z3-solver>=5.3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# packages only some research strategies need (numopt_cma, gradient, sindy); without them those
# strategies raise MissingExtra (sdlab/discovery/optional.py)
research = ["cma>=4.5.0", "cvxpy>=1.9.3", "jax>=0.11.2", "pysindy>=2.1.0"]

[project.scripts]
sdlab = "sdlab.server:main"
sdlab-ladder = "sdlab.ladder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdlab"]
