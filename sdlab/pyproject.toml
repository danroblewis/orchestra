[project]
name = "sdlab"
version = "0.1.0"
description = "Design system dynamics models, then apply machines to their flows"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.3",
    "fastapi>=0.115",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pysindy>=2.1.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sdlab = "sdlab.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdlab"]
