# Strategies the ladder skips by default ("all" in run / watch / status), because they are slow
# and no better than the main line on the ladder. They still run when named (--strategies numopt_bo),
# with --strategies everything, and in `sync` (which reads "all" as "everything": they are still
# active, and their stale cells must not be left behind). Measured on the full ladder, 2026-10-18 (compute summed over runs).
numopt_bo: Bayesian optimisation of the numbers; 969 s per ladder, 34% pass (matrix 35%)
numopt_fd_coarse: finite differences with coarse learnable inflows; 325 s, 22% pass
numopt_fd: finite-difference refit; 142 s, 20% pass
numopt_fd_profile: finite-difference refit with profiled inflows; 164 s, 22% pass
numopt_cma: CMA-ES refit; 229 s, 34% pass
numopt_lbfgs: L-BFGS-B refit; 188 s, 31% pass
numopt_nm: Nelder-Mead refit; 186 s, 34% pass
numopt_powell: Powell refit; 173 s, 34% pass
gradient: JAX refit through a differentiable simulator; 197 s, 35% pass (same as matrix)
held_out_blend: held-out judge blended with the in-sample one; 124 s, 36% pass
kalman_bayes: kalman_lna with a block bootstrap and MCMC posterior; median 21 s per cell against 2.9 s (7.4x), 164 of 484 passes against its point answer's 177 (docs/research/kalman_bayes.md, 2026-10-20)
combined: selection composite (runs copies of specialists, keeps one answer); ~4.4 h of discovery per ladder; parked 2026-10-20 (the user) to save CPU, combined2 kept
combined_lean: selection composite variant; ~4.2 h per ladder; parked 2026-10-20 (the user)
combined_misfit: selection composite variant; ~4.2 h per ladder; parked 2026-10-20 (the user)
combined_r2: selection composite variant; parked 2026-10-20 (the user)
