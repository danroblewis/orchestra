# The kubernetes competition (the user, 2026-10-20): every non-retired strategy enters at rung 300;
# each rung's investigation (300-317, one at a time) fixes what fails and eliminates a strategy only
# for a hard reason. Eliminated strategies stay on the rest of the ladder and keep their docs; their
# ideas may be reused, their code is not run on later rungs. Select the survivors with
# `--strategies roster:kubernetes`.
#
# A winner passes every variant of every rung, 300-317. If no survivor wins at 317, the eliminated
# strategies are revisited (the user, 2026-10-20): latest eliminations first, each re-run on the rungs it
# missed with the fixes made since, and brought back if the reason no longer holds.
#
# kind: impossible  - the method cannot represent the rung's mechanism, and adding it would rewrite
#                     the method (verified by two skeptics)
#       duplicate   - gives the same result as another survivor (`of`) on every cell run so far
#       not-entered - not in the competition (and why)
#       withdrawn   - taken out by the user (parked to save CPU), not for a fault
# Entered later (they compete from the rung named; the roster selects every non-retired strategy not
# eliminated, so an entry here is a record, not a switch):
#   milp at 306 (the user, 2026-10-21): the first strategy to pass the ready-replicas cap (MIN)
eliminated:
  kalman_bayes:
    rung: "302"
    kind: not-entered
    reason: parked on 2026-10-20 (7x kalman_lna's cost, no better; docs/research/kalman_bayes.md)
  unified:
    rung: "304"
    kind: duplicate
    of: matrix
    reason: >-
      same status and found model (3 s.f.) as matrix on every shared cell (438 current-hash cells
      incl. all 24 of 300-304, plus 710 re-run in process on current code; 0 differ). identify() is
      eiv.apply(main_line(...)) with main_line byte-identical to matrix's and eiv.py equal to matrix's
      inline _eiv_; unified's own search is unbuilt ("WORK IN PROGRESS"). Comes back if it is built.
      Package kept (objective_test.py imports it). docs/research/k8s-304.md
  combined:
    rung: "305"
    kind: withdrawn
    reason: selection composite parked by the user on 2026-10-20 to save CPU (combined2 stays in)
  combined_lean:
    rung: "305"
    kind: withdrawn
    reason: selection composite parked by the user on 2026-10-20 to save CPU (combined2 stays in)
  combined_misfit:
    rung: "305"
    kind: withdrawn
    reason: selection composite parked by the user on 2026-10-20 to save CPU (combined2 stays in)
  combined_r2:
    rung: "305"
    kind: withdrawn
    reason: selection composite parked by the user on 2026-10-20 to save CPU (combined2 stays in)
