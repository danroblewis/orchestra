# Plain-language explanations of the discovery strategies and of the words the ladder pages use.
#
# One entry per strategy under sdlab/discovery/strategies/ (tests/test_ladder_explanations.py checks
# that none is missing). They live here, not in the strategy packages, because the ladder hashes a
# strategy's source: an edit there would mark all its results stale.
#
# Each strategy: idea (one sentence), how (2-4 short sentences), helps_with, builds_on, status
# (active | parked | work in progress | retire-candidate) and an optional note. Sources: the
# strategy's own docstring and its document in docs/research/ (README.md maps names to documents).
# status: parked = in sdlab/ladder/parked.yaml; retire-candidate = its research document's verdict
# is "reject"; work in progress = said so in its code or documents.
#
# Served by /api/ladder/strategies (as "about") and /api/ladder/glossary (sdlab/ladder/explain.py).

strategies:

  matrix:
    idea: The main line - fit each stock's change per step as a sum of simple terms, then keep the candidate model that behaves best.
    how: >-
      For every stock, the change in each step is fitted by a straight-line formula of the stocks'
      levels (a regression), with the stock's outside inflow allowed to change in pieces. The
      fitted numbers are read back as flows: moves, links, drains. Several ways of doing the fit
      give several candidate models, and a judge runs each one forward on the data and keeps the
      one that tracks the measured levels best.
    helps_with: Ordinary linear systems - chains, drains, moves between stocks, links, constant or stepped inflows.
    builds_on: nothing (it is the base the others extend)
    status: active

  blockwise:
    idea: The main line made to scale to hundreds of measured stocks (a Kubernetes platform), with unseen one-step stages and links in place of moves.
    how: >-
      Every stock's regression shares the same columns, so their sums are computed once and each
      stock is fitted from small matrices (a 230-stock week takes seconds, not hours). Delayed copies
      of other stocks' levels stand for unmeasured stages in front of a stock (a load balancer's
      queue between two services), and what one stock does to another is read as a link that takes
      nothing from it. Floored rates (scale up on a gap, down after it) and ratios of levels (memory
      per request per pod) are offered to the best candidates. The stocks are split into weakly
      coupled blocks, each block keeps the candidate that predicts it best, and every model is judged
      with the measured inputs. Below 15 measured stocks it is the main line itself.
    helps_with: Large models driven by a measured input (requests through a service graph), hidden one-step queues, links between services.
    builds_on: matrix (the shared library's row reading, conservation and judge; no strategy imported)
    status: active

  matrix_v2:
    idea: The main line with the fixes other strategies found for it, each one a switch that can be turned on or off.
    how: >-
      The same per-stock regression as matrix, in its own copy, with these switches: no fit is
      trusted below the data's rounding; noise-free data that fit exactly several ways keep the
      plainest set of terms; a stock's changing outside inflow is pooled into a few values and
      re-cut where it really changes; an inflow that falls as another stock rises is written as one
      floored inflow (a goal gap); a drain from one stock and a link into another at the same level
      become one move; products of two stocks (an infection, crowding) are offered to a finished row;
      a drain's tie to what other stocks receive is tested with both rows' uncertainty. Each switch
      was measured alone on the whole ladder, and the defaults are the ones that helped.
    helps_with: Spurious inflow pieces and the fast drains they cause, goal gaps, exactly collinear noise-free stocks, products of stocks.
    builds_on: matrix (a copy), with fixes from earned_pieces, censored, effect_hats, common_cause and structures
    status: work in progress

  change_price:
    idea: The main line, but a stock's outside inflow may change over time only if the change is worth its textbook price.
    how: >-
      The main line lets an outside inflow change in many cheap pieces. Here, before any pieces
      are allowed, a gate asks whether a changing inflow beats a constant one when each change
      pays the standard BIC price. Inside the fit the main line's cheaper price is kept, because
      the textbook price made the fit spiral on inflows that really do change often.
    helps_with: Stocks whose inflow is really constant but gets cut into spurious pieces.
    builds_on: matrix
    status: retire-candidate
    note: Research verdict "reject (a narrower gate is neutral)" (docs/research/change-price.md).

  held_out:
    idea: Choose among the main line's candidate models by how well they predict data they were not fitted on.
    how: >-
      The run is cut into blocks. Each candidate is fitted on all blocks but one and run forward
      inside the one left out (cross-validation). The candidate with the smallest error on the
      left-out blocks is then fitted on all the data.
    helps_with: Candidates that look good only because they were fitted to the same data they are judged on.
    builds_on: matrix
    status: retire-candidate
    note: Research verdict "reject" on benchmark v1 (docs/research/held-out-judge.md).

  held_out_blend:
    idea: The main line's judge, nudged a little by the held-out error of held_out.
    how: >-
      Each candidate gets a score that is mostly the usual in-sample error plus a small weight on
      its error on left-out blocks. The lowest blended score wins.
    helps_with: The same as held_out, with less risk of throwing away the in-sample judge's good picks.
    builds_on: held_out
    status: parked
    note: Parked as slow and no better than the main line (124 s per ladder, 36% pass; parked.yaml).

  output_error:
    idea: Take the main line's model and polish its rate numbers so that runs many steps ahead stay close to the data.
    how: >-
      The main line fits one step at a time. Here the best few candidates have their rates
      adjusted so the model, started from many moments and run 5, 20 and 100 steps, stays close to
      the measured levels (output error). The outside inflows stay as found. The judge keeps
      whichever version, polished or not, it rates best.
    helps_with: Rates that are slightly off because one-step fits are biased by noise.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination - keep as a final step after structural fixes".

  odefit:
    idea: For smooth measured data (physics, sensors), fit each stock's change as a sum of terms by how well whole runs follow the measurements, not one step at a time.
    how: >-
      Each stock's change in a step is a number times each level, each measured input and a
      constant (later also products of two levels). The numbers are chosen so that the model,
      started from an estimated state at the start of each 100-step stretch, follows the measured
      levels (output error). Measurement error then cannot shrink the numbers as it does in a
      one-step fit. Terms are dropped while BIC improves. Products are kept only if they save BIC,
      predict a held-out last 30% clearly better, and do not make the model run away when the inputs
      go beyond what was seen. The main line runs too, and the model that follows the data better
      (each stretch's start fitted) is kept. Counted data (whole numbers), uneven times and
      announced eras go to the main line.
    helps_with: Measurement noise that loses couplings (the spring, the reaction chain), products written as linear links (Lotka-Volterra), and measured inputs driving coupled stocks.
    builds_on: matrix
    status: active
    note: Physics cases 25 of 28 (best before 15); standard tests 20 more passes than matrix, none lost; docs/research/odefit.md.

  shared_noise:
    idea: Tell moves, links and co-flows apart by which stocks' random wiggles happen together.
    how: >-
      When whole things move from A to B, a random extra unit leaving A shows up as an extra unit
      arriving in B in the same step. A link or an independent drain does not produce that
      matched pattern. So the leftovers of the fit (what the formulas do not explain) are
      compared between stocks to decide which reading is right.
    helps_with: Counting-noise data where a move, a link plus a drain, or a co-flow would explain the averages equally well.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination (with a fix for drain bias)". Its idea lives on in lna.

  floors:
    idea: Fit flows in the form the simulator steps them - rates never below zero, and no stock giving more than it holds.
    how: >-
      Where a stock runs empty, the outflows it could not pay are added back and the rows are
      fitted again (caps). Optionally a "hinge" column, zero below a threshold, lets a rate stop
      at zero (floors; off by default). Every version is judged like the main line's candidates.
    helps_with: Stocks that run dry and rates that hit zero.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination"; continued by censored.

  censored:
    idea: Rewrite a row's outside flows as a rate that stops at zero, or as a demand capped by what the stock holds, where the data say so.
    how: >-
      Taking the main line's model, each stock is offered rewrites. A floor is a rate that
      falls with a stock's level until it hits zero and stays there; a cap is a constant demand
      that cannot take more than the stock holds. Its outside inflow is also re-cut into fewer
      pieces (each change must pay a higher price), and a negative link is read as an inflow
      that falls with another stock. A rewrite is kept only if it scores clearly better (BIC,
      with floors and caps applied as the simulator applies them).
    helps_with: Rates that hit zero (case 024) and stocks that run empty (case 025).
    builds_on: matrix (continues floors)
    status: active
    note: Research document docs/research/censored.md.

  schedules:
    idea: Search censored's model again with every number refitted across all stocks at once, so a flow only one era or one pulse needed is dropped and a schedule is written as a schedule.
    how: >-
      Starting from censored's model (and from leaner versions of it), a beam search tries
      dropping a flow, one number for all eras or numbers per era, a constant on a move in place
      of the constant flows at its ends, a new move, a move that uses up a third stock, and
      outside flows as pulses on a fixed period (a pulse may top its stock up to a level). Each
      candidate's numbers are refitted together over every stock's row, and the one-step BIC with
      a small price per flow decides.
    helps_with: Announced eras on several moves (157), a release with a threshold (158), periodic pulses and top-ups (159).
    builds_on: censored (a copy)
    status: work in progress
    note: Research document docs/research/schedules.md.

  own_tables:
    idea: A stock's flows to and from outside as a lookup table of the stock's own level, where the flow bends with it.
    how: >-
      Taking the main line's model, each stock's change (less the moves kept) is fitted as a
      bent line of its own level whose corner points are searched for, beside the other levels
      and inputs its flows read. One sign is one table flow (a drain that bends, like a tank
      emptying through a hole); a curve that crosses zero is read as a plain drain and an inflow
      table that is flat where it can be (a heater its own heat shuts off). It is kept only if
      it scores clearly better than the straight line and the main line's model (BIC), and
      fits each half of the run from the other.
    helps_with: A concave drain (case 122) and an inflow shut by its own level (case 123).
    builds_on: matrix (its scoring copied from censored)
    status: active
    note: Research document docs/research/own_tables.md.

  drifting_drain:
    idea: A stock's drain whose rate drifts in time, unannounced, beside a steady inflow, instead of a steady drain and an inflow in many pieces.
    how: >-
      Taking the main line's model, each stock's outside inflow and own drain are replaced by a
      constant inflow and a drain whose rate changes in stretches. The inflow is found by trying
      each possible value and cutting the drain's rate into stretches (each cut must pay its
      price); for counted levels the size of the noise also says how much flows in. It is kept
      only if it scores clearly better than the main line's model (BIC; for counts, the
      likelihood of counting noise).
    helps_with: A drain that drifts (case 121), as labour-market transition rates drift with the business cycle.
    builds_on: matrix (its scoring copied from censored)
    status: active
    note: Research document docs/research/drifting_drain.md.

  gated:
    idea: Before judging, throw out candidate models that run away when simulated freely.
    how: >-
      Each candidate is run from the observed, empty and very high states. One whose stocks shoot
      far outside their observed range is rejected (or refitted once with the culprit number set
      to zero). The judge then picks among those that pass.
    helps_with: Models that fit the data but explode outside it.
    builds_on: matrix
    status: retire-candidate
    note: Research verdict "reject for the main line; keep gate.py for flexible strategies" (behaviour-consistency.md).

  gated_no_high:
    idea: gated without its test from very high starting levels.
    how: >-
      The same gate as gated, but candidates are not run from five times the observed maximum,
      which judges behaviour far outside anything the data visit. It is an ablation (a version
      with one piece removed) to see what that test contributes.
    helps_with: Measuring how much the "high" test helps or hurts gated.
    builds_on: gated
    status: retire-candidate
    note: Same research verdict as gated.

  gradient:
    idea: Fit the main line's model numbers by gradient descent through a simulator that can be differentiated.
    how: >-
      The model is written so the computer can work out how the multi-step error changes with each
      number, then the numbers are adjusted step by step to lower it. A "generous" variant also
      adds every possible effect and co-flow and prunes the small ones away.
    helps_with: Polishing numbers, and finding effects and co-flows the main line's form cannot express.
    builds_on: matrix
    status: parked
    note: Parked as slow (197 s per ladder) and no better than matrix (35% pass). Needs the optional jax package.

  hidden_delays:
    idea: Look for an unmeasured stock between two measured ones by offering delayed copies of a level.
    how: >-
      After the main line, each stock's row is offered delayed copies of every other stock's level.
      If B's row picks a delayed copy of A, a hidden stock A -> H -> B may sit between them. Such
      stocks are added one at a time while the model behaves better, with the delay tuned.
    helps_with: A delay or pipeline stock nobody measures.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination"; hidden_transit is the later method for the same case.

  hidden_transit:
    idea: Find an unmeasured transit stock between two measured stocks, fitting the pair with a Kalman filter.
    how: >-
      For each pair where A loses things and B gains them, two models are fitted by the same
      likelihood: A -> H -> B through a hidden stock H with a delay, or B getting a share of A's
      loss straight away. A Kalman filter tracks H's unseen level using the random wiggles that
      A and B share. The hidden stock is kept only when it wins clearly (BIC) and behaves better
      on the data. Then, for single stocks, a hidden stage (or a chain of three) on the stock's
      inflow: fed from outside by a constant, the stock's own level or measured inputs (a supply
      line ordered by a gap, an input that arrives late), or by the stock itself (rework that
      comes back), its delay found by least squares profiled over the delay.
    helps_with: A hidden delay stock between two measured stocks (cases 015 and 026); supply lines, delayed inputs and rework (133-135, 172; canonical 105, 107, 110).
    builds_on: matrix
    status: active
    note: Research verdict "adopt candidate" - the first strategy to pass case 015.

  mass_balance:
    idea: Reconstruct an unmeasured stock between two measured ones from what one loses and the other gains.
    how: >-
      Where A loses things to outside and B, of the same unit, gets things from outside, the
      strategy tries A -> H -> B with H's level worked out from the balance (what went in minus
      what came out). A pair whose balance does not add up (H drifts or goes negative) is rejected;
      one that makes the model behave better is kept.
    helps_with: Hidden stocks where the unit's things are conserved.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination".

  mass_balance_all:
    idea: mass_balance tried on every candidate model, not only the one the main line chose.
    how: >-
      The same mass-balance search as mass_balance, run on each of the main line's candidates.
      The judge picks among all the results.
    helps_with: Cases where the main line's chosen model hides the pair mass_balance needs.
    builds_on: mass_balance
    status: active

  sindy:
    idea: The off-the-shelf PySINDy method, given system-dynamics-shaped building blocks and conservation rules.
    how: >-
      Each stock's change is written as a sparse combination of terms from a library - the levels
      and products of two levels - with weak terms dropped by a threshold. Conservation (what
      leaves one stock arrives in another) is imposed across rows. The terms are read back as
      flows, effects and co-flows.
    helps_with: Products of levels (a flow sped up by another stock), and checking a standard tool against ours.
    builds_on: nothing (an outside method; one option combines it with matrix)
    status: retire-candidate
    note: Research verdict "reject as a strategy; carry two pieces forward" (pysindy.md). Needs pysindy and cvxpy.

  symbolic:
    idea: Search for effect curves - a flow's rate multiplied by a curve of some stock's level - and offer them as candidates.
    how: >-
      A grammar of curve shapes is screened against what the main line's rows leave unexplained.
      Promising curves are offered to the fit as extra columns and translated back into SD Lab
      effects. Every candidate, with or without effects, is judged by how it behaves.
    helps_with: Flows whose rate bends with another stock's level (effects).
    builds_on: matrix
    status: active
    note: Research - the best single mechanism on benchmark v2.1; needs a combination.

  symbolic_anchor:
    idea: symbolic's effects, accepted only when a test that inflow pieces cannot fake says they help.
    how: >-
      The main line's outside inflows in pieces can imitate almost anything, including an effect.
      So an effect is accepted only if, with a coarse inflow neither model tailored, the model
      with it predicts better than without it by more than the judge's own noise, and also does
      better with its own pieces.
    helps_with: Keeping symbolic's real effects while refusing effects that inflow pieces could have produced.
    builds_on: symbolic
    status: active
    note: Research - the "anchor" rule was rejected; the "safe" rule keeps a third of symbolic's gain with no losses.

  effect_hats:
    idea: Fit effect curves as tables of straight-line segments, all numbers fitted together by least squares.
    how: >-
      A curve of a stock's level is built from "tent" functions over a few knots, so the curve is
      exactly an SD Lab table effect and is linear in its table values. Pairs (flow, stock) are
      screened on what the rows leave unexplained, the best curves are fitted jointly across rows,
      and a candidate replaces the base model only if it explains both halves of the data and
      prices better by BIC. Every model's outside inflows are also pooled into a few values and
      re-cut where they really change, since many inflow pieces make a drain look faster than it is.
    helps_with: Effects - linear (017) and with a kink (018) - and, through the re-cut inflows, drains and chains under counting noise.
    builds_on: matrix
    status: active
    note: Research document docs/research/effect-hats.md.

  inflow_effects:
    idea: effect_hats, then outside inflows that carry an effect - a base (a measured input, or a schedule nobody announced) times a table of a stock's level.
    how: >-
      A copy of effect_hats. On its answer, each stock's inflow is tried as a base times a table curve
      of a stock's level (its own level too): the base is either a measured input (arrivals let in
      by a gate that closes as the queue fills) or a schedule of a few values that changes when the
      data say so (growth of 10 or 20 a step, times a table of nitrogen). The flow may also use up
      another stock as it arrives, or run from it. The schedule and the curve multiply each other, so
      they are fitted in turns and then all together; the other flows on those stocks keep their
      form and are rescaled. A reading replaces the old inflows only if it prices better (one-step
      BIC) and behaves no worse on the multi-step judge.
    helps_with: Effects on outside inflows (distilled 160, from sd-farm-soil) and a measured inflow gated by a table of its own stock (distilled 217, from 212).
    builds_on: effect_hats (copy)
    status: work in progress
    note: Research document docs/research/inflow_effects.md.

  realistic_flows:
    idea: realistic_hats that also finds co-flows, and keeps a stock's own drain instead of letting its outside inflow stand in for it.
    how: >-
      A copy of realistic_hats (effects, hidden transit stocks, always answers in time) with
      coflow_hats' co-flow steps added (copied): flows that use up another stock as they move, also when
      that stock runs dry. The matrix method is also run a second time with each stock's own numbers
      kept as fitted - a small rate on a large stock is not rounded away, and a drain is not cut to what
      other stocks are seen to receive unless the data agree - and the version that predicts the data
      better is used. Hidden stages are tried on the model with and without the co-flows, and the one
      that predicts better is kept.
    helps_with: Outside inflows standing in for a flow (distilled 153, 154), co-flows (128, 129), on the realistic examples.
    builds_on: realistic_hats, coflow_hats (copies)
    status: work in progress
    note: Research document docs/research/realistic-flows.md.

  realistic_hats:
    idea: effect_hats made for the realistic examples - it always answers in time, and adds hidden transit stocks between measured pairs.
    how: >-
      A copy of effect_hats (effects as table curves, inflows pooled and re-cut) that keeps its best
      model so far and stops searching when the time runs short, instead of the whole run timing out
      (effect_hats timed out on 9 of the 62 realistic runs). Then, on its answer, the hidden_transit
      method (copied) tries an unmeasured stock between each pair of measured stocks - things leave
      A, wait, and arrive in B - and keeps one only if it is clearly more likely and the model with it
      predicts better than the model without it with B's arrivals held at their mean.
    helps_with: The realistic examples - long runs, and hidden stages between measured stocks (015; distilled 156, 161).
    builds_on: effect_hats, hidden_transit (copies)
    status: active
    note: Research document docs/research/realistic-hats.md; the triage behind it is docs/research/realistic-triage.md.

  loop_transit:
    idea: realistic_hats with hidden stages that close a loop - things leave A, wait unseen, arrive in B, and B sends them back to A.
    how: >-
      A copy of realistic_hats whose hidden-stage fit reads the run more carefully. Announced
      additions to a stock are part of each step, not a jump to explain. When B also sends things
      straight back to A, that return is fitted again together with the hidden stage, and its counting
      noise - the same things leaving B and arriving in A - is treated as shared by both stocks. A
      return the main line split into "A gets something reading B" plus "B loses something" is put
      back together as one move when that is as likely with one number fewer.
    helps_with: A hidden stage on a closed loop whose total is conserved (156; from sd-ev-fleet and sd-recycling).
    builds_on: realistic_hats (copy)
    status: work in progress
    note: Research document docs/research/loop_transit.md.

  coflow_hats:
    idea: effect_hats, then co-flows and cyclic links found after its model is chosen.
    how: >-
      A copy of effect_hats. After its model is chosen, three kinds of candidate are tried, each kept
      only if it prices better and behaves no worse - a flow that uses up another stock as it moves,
      on an outside inflow (one stock's inflow steps down whenever another's steps up) or read from
      a drain that follows another stock; a co-flow whose used stock runs dry, fitted only where that
      stock held what its users wanted and stepped with the cap elsewhere; and a link whose strength
      repeats on a cycle (by day and by night), split by phase. Two drains on one effect curve are
      also offered as the base's drain using the other stock up.
    helps_with: Co-flows (128 on an outside inflow, 129 running empty) and links that follow a daily cycle (132).
    builds_on: effect_hats
    status: active
    note: Research document docs/research/coflow-hats.md.

  numopt_fd:
    idea: Refit the main line's numbers by multi-step error with a standard optimiser, gradients by finite differences.
    how: >-
      The main line's model is the start. Its numbers, and optional effects and co-flows added one
      at a time, are adjusted with scipy's least-squares solver so the model's runs match the data;
      the slope of the error is estimated by nudging each number a little (finite differences).
    helps_with: Numbers biased by one-step fitting; effects and co-flows.
    builds_on: matrix
    status: parked
    note: Parked as slow (142 s per ladder, 20% pass).

  numopt_fd_coarse:
    idea: numopt_fd with each outside inflow as a few coarse pieces whose values are fitted too.
    how: >-
      The same refit as numopt_fd, but the outside inflows are not frozen: each is cut into a few
      blocks with a free, penalised factor per block, fitted with everything else.
    helps_with: Testing whether letting inflows move during the refit helps.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (325 s per ladder, 22% pass).

  numopt_fd_profile:
    idea: numopt_fd with the outside inflows re-measured at every step of the optimisation.
    how: >-
      Every time the optimiser tries new numbers, the inflows of the affected stocks are measured
      again as whatever the stock's change leaves over. This lets an effect replace links without
      the old inflows fighting it.
    helps_with: Testing effects that change a stock's balance.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (164 s per ladder, 22% pass).

  numopt_lbfgs:
    idea: numopt with the L-BFGS-B optimiser.
    how: >-
      The same refit of the main line's numbers by multi-step error, using L-BFGS-B, a standard
      gradient-based method that keeps numbers within bounds. It exists to check whether the
      choice of optimiser matters.
    helps_with: Comparing optimisers (research found the optimiser is not the bottleneck).
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (188 s per ladder, 31% pass).

  numopt_nm:
    idea: numopt with the Nelder-Mead optimiser, which needs no gradients.
    how: >-
      The same refit, using Nelder-Mead, which moves a small cloud of trial points downhill
      without computing slopes.
    helps_with: Comparing optimisers.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (186 s per ladder, 34% pass).

  numopt_powell:
    idea: numopt with Powell's method, which searches along one direction at a time.
    how: >-
      The same refit, using Powell's method: line searches along a set of directions, no
      gradients needed.
    helps_with: Comparing optimisers.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (173 s per ladder, 34% pass).

  numopt_bo:
    idea: numopt with Bayesian optimisation, which models the error surface to choose where to try next.
    how: >-
      The same refit, using Bayesian optimisation: a statistical model of the error guesses
      which numbers are worth trying next. Fits with too many numbers are skipped.
    helps_with: Comparing optimisers on small fits.
    builds_on: numopt_fd
    status: parked
    note: Parked as the slowest (969 s per ladder, 34% pass).

  numopt_cma:
    idea: numopt with CMA-ES, an evolutionary optimiser.
    how: >-
      The same refit, using CMA-ES: a population of trial numbers is sampled, the best are kept,
      and the sampling adapts towards them.
    helps_with: Comparing optimisers.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (229 s per ladder, 34% pass). Needs the optional cma package.

  piece_proof:
    idea: Choose among the main line's candidates with a judge that the candidates' own inflow pieces cannot fool.
    how: >-
      The usual judge replays each candidate with its own outside-inflow pieces, which were fitted
      to this run, so a candidate with many pieces looks good. This judge feeds every candidate
      inflows it did not tailor before comparing them.
    helps_with: Candidates that only look good because their inflow pieces copy the data.
    builds_on: matrix
    status: retire-candidate
    note: Research verdict "reject as the main judge; keep judges.py" (inflow-conditioned-judge.md).

  pieces_gate:
    idea: The main line with one fix - a changing inflow is kept only if its average is clearly above or below zero for its own uncertainty.
    how: >-
      At the end of the main line's fit, a row's changing outside inflow is kept or dropped. Here
      the test compares the inflow's mean with its own standard error instead of with the spread
      of the pieces' values. It is an ablation (one change tested alone).
    helps_with: A bug in the main line's pieces test that inflow_attribution uncovered.
    builds_on: matrix
    status: active

  periodic_inflows:
    idea: Read an outside inflow as one period's profile repeated (a daily or weekly cycle) plus a slow level.
    how: >-
      After the main line, each stock whose inflow is better described by BIC as a repeating
      profile has that profile taken out as known. The main line then runs again on the rest, so
      the other numbers are not bent by an inflow that pieces would have had to chase.
    helps_with: Seasonal or daily cycles in what arrives from outside.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination; strong adopt candidate".

  latent_eras:
    idea: Find unannounced periods where the system's numbers change, then fit them as eras.
    how: >-
      The rows' fitted numbers are tracked over time and recurring regimes (stretches with
      different numbers) are found. Those regimes are added to the announced eras and the main
      line's "numbers per era" candidates are fitted again. A candidate with regimes must beat the
      main line clearly, since regimes add numbers.
    helps_with: Rules that change without anyone announcing it.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination"; one regime sometimes stands in for an inflow.

  starved_coflows:
    idea: Find co-flows (one flow using up another stock) by fitting only the steps where the used stock had enough.
    how: >-
      When the used stock runs low, the flow is capped and the straight-line fit is bent. So the
      steps where a stock held less than its users wanted are left out of the fit, and terms like
      "C drains faster when A is high" are read as co-flows. These join the main line's candidates
      before the judge.
    helps_with: Flows that consume another stock, which then runs dry.
    builds_on: matrix
    status: active
    note: Research verdict "adopt as extra candidates".

  recession:
    idea: Measure each drain on the quiet steps where nothing arrives from outside, and offer those as extra candidates.
    how: >-
      When a stock's inflow is quiet, its change is its drain alone, so the drain can be measured
      without inflow pieces getting in the way. Rows refitted that way, with the inflow measured
      afterwards, join the candidates.
    helps_with: Drains biased by a busy outside inflow.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination".

  impulses:
    idea: Treat one-step arrivals and short bursts as their own kind of input, so no flow has to absorb them.
    how: >-
      Sudden jumps in a stock's change are found jointly with the row's numbers (find pulses,
      refit without them, repeat). A sudden loss counts only where another stock gains in the
      same step. The pulses are then removed before fitting and returned as outside flows that
      arrive only in those steps.
    helps_with: Deliveries, batches and shocks (pulse cases).
    builds_on: matrix
    status: active
    note: Research verdict "adopt after combining with the judge/gate".

  row_crossover:
    idea: Take the judge's pick, then swap in single stocks' formulas from other candidates where the whole model behaves clearly better.
    how: >-
      Different candidates may get different stocks right. Each stock's row is swapped for
      another candidate's row and kept if the whole model's error drops by at least 5%, for a
      couple of sweeps.
    helps_with: Models where no single candidate is right everywhere.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination"; the in-sample judge can be fooled by a flexible row.

  paced_moves:
    idea: Read the fitted numbers as "what moves where" times "how fast", including moves paced by a third stock and goal-gap inflows.
    how: >-
      Each candidate is also read with moves whose speed is set by a third stock (one shared
      number), and the best reading is then offered goal-gap inflows (an inflow that grows with
      the distance to a target) one at a time. Everything goes before the same judge.
    helps_with: Moves paced by another stock, and goal-seeking inflows.
    builds_on: matrix
    status: active
    note: Research - paced moves rejected as they stand; gap inflows need a combination.

  inflow_attribution:
    idea: Test each row for an inflow that is soaking up its drain, and refit those rows with the drain measured within stretches.
    how: >-
      Each candidate's rows are checked against the size of counting noise and a partial
      simulation. A flagged row has its drain measured within stretches where the inflow holds
      still, then its inflow recovered with that drain fixed. The judge chooses among the repaired
      candidates.
    helps_with: Drains biased by outside-inflow pieces, and which stocks really get outside inflow.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination (not significant alone)"; found the pieces-gate bug.

  inflow_attribution_refine:
    idea: inflow_attribution applied only to the main line's chosen model.
    how: >-
      Only the chosen model's flagged rows are repaired, and the repair is kept only if the judge
      rates it better.
    helps_with: A cheaper, safer version of inflow_attribution.
    builds_on: inflow_attribution
    status: active

  inflow_attribution_both:
    idea: inflow_attribution with the unrepaired candidates kept beside the repaired ones.
    how: >-
      The judge chooses among both sets, so a repair that makes a candidate worse cannot win by
      default.
    helps_with: Checking whether repairs ever hurt.
    builds_on: inflow_attribution
    status: active

  earned_pieces:
    idea: The main line, but a stock's outside inflow may change only once the data earn it.
    how: >-
      Each stock's formula and inflow are chosen together, with every change in the inflow
      paying its full price (a value and a place) in BIC, instead of cheap pieces being allowed
      first. Then whether a stock passes all its loss on to other stocks (conservation) is
      decided by all rows at once, using counting noise as evidence.
    helps_with: Spurious inflow pieces, and drains that should equal what receivers take.
    builds_on: matrix
    status: work in progress
    note: Its code says "work in progress"; there is no research document for it yet.

  common_cause:
    idea: Separate independent sub-systems that only look connected because something outside drives them at the same moments.
    how: >-
      If two unrelated stocks both have inflows that step up at the same moments (a common cause),
      a fit can wrongly explain one with the other's level (a fake cross-link). Here a change
      moment already found in one stock is offered to the others at the price of only its value,
      so a cross-link survives only if it explains something the shared moments do not. For
      noise-free data it also fits to computer precision and, among exact fits, keeps the
      plainest formula.
    helps_with: Independent systems (cases 028-033) and systems with identical numbers (034-038).
    builds_on: earned_pieces
    status: active
    note: Ladder work done; the benchmark is in progress (docs/research/common_cause.md).

  lna:
    idea: Choose flows by how likely the step-by-step changes are under counting noise (the linear noise approximation).
    how: >-
      Averages alone cannot tell a move from a link plus a drain. But when whole things move, the
      random wiggles leave fingerprints - a unit leaving A shows up arriving in B, and births
      plus deaths make more wiggle than their difference alone. This strategy fits all stocks
      together by that likelihood. On noise-free data there are no wiggles to read, so it returns
      the main line's answer.
    helps_with: Telling apart readings that average the same - moves vs links, co-flows, births vs deaths, goal gaps.
    builds_on: matrix
    status: active
    note: Research verdict "adopt the mechanism for structure" - the ladder's best single strategy; not yet the main line on the examples (docs/research/lna.md).

  lna_loops:
    idea: lna, but a feedback link that closes a loop is kept whenever the data cannot rule it out.
    how: >-
      lna drops a small number when keeping it does not pay the BIC price. A link closing a
      feedback loop is often small and uncertain, so it gets dropped. Here those loop-closing
      links are offered back and kept whenever their best-fitting value is above zero.
    helps_with: Feedback loops with weak links.
    builds_on: lna
    status: active
    note: From the revisit (docs/research/revisit.md), whose verdict is do not adopt - its passes are on cells the data cannot decide, and it can make a noisy chain behave much worse. Costs extra flows where the truth has none. A stage on lna's hooks, so lna's measured inputs, stride and time limit apply.

  lna_products:
    idea: lna with a move allowed to be scaled by a third stock's level (a linear effect).
    how: >-
      Product terms (A's level times C's level) are added to lna's choices, so a move from A to B
      can speed up when C is high. They are chosen by the same counting-noise likelihood and BIC
      as every other flow. With no noise or fewer than three stocks it is lna.
    helps_with: Linear effects of a third stock (case 017) with counting noise.
    builds_on: lna
    status: active
    note: From the revisit (docs/research/revisit.md). On its own it adds no pass over lna; with lna_levels (in lna_stack) it passes 017/018 with counting noise. A stage on lna's hooks, so lna's measured inputs, stride and time limit apply.

  lna_stack:
    idea: lna with the revisit's best additions stacked in one model (pulses, recurring inflow levels, effect products, and SD-style ties on noise-free runs).
    how: >-
      It runs lna with several extra stages. One finds pulses first; one reads a stepping outside
      inflow as a few recurring levels; one allows a move scaled by a third stock's level (a
      linear effect). On noise-free runs, where the data can't choose, it writes ties the way SD
      models usually do (a goal gap, a co-flow). Each addition is kept only when the
      counting-noise likelihood and BIC prefer it, and the stack checks the result still behaves
      like the data.
    helps_with: Everything lna does, plus pulses (022), stepping inflows (027, 048), effects with counting noise (017, 018), and noise-free goal gaps and co-flows (011, 016, 047).
    builds_on: lna, lna_pulses, lna_levels, lna_products, gap_prior
    status: active
    note: From the revisit (docs/research/revisit.md). On cases 001-048 it passed 381 of 472 cells against lna's 340, with 0 losses. Its stages are now hooks on lna, so lna's measured inputs, stride and time limit apply, and it no longer times out on the realistic models.

  lna_pulses:
    idea: Find pulses (one-step arrivals, short bursts) first, then run lna on what they leave.
    how: >-
      The pulse detection of impulses is run first and the pulses are taken out of each step's
      change, so a burst is not read as a move, link or drain. lna then reads the rest. The
      pulses are returned as outside flows that arrive only in those steps.
    helps_with: Pulses in noisy data.
    builds_on: lna (with impulses' detector)
    status: active
    note: From the revisit (docs/research/revisit.md). Passes the pulse case 022 in all four variants. A stage on lna's hooks, so lna's measured inputs, stride and time limit apply.

  lna_levels:
    idea: lna, with an outside inflow that switches between a few recurring values described by those few values instead of one number per piece.
    how: >-
      An inflow that flips between, say, a high and a low value (a square wave) is grouped into a
      few recurring levels, each measured from all the steps at that level, so it costs two
      numbers instead of one per piece. Where a stock seems to grow with itself beside an outside
      inflow, the version without that growth (inflow cut afresh into pieces) is also tried. The
      lower BIC wins. Noise-free runs are lna's.
    helps_with: Unannounced inflows that switch back and forth between a few values.
    builds_on: lna
    status: active
    note: From the revisit of past ideas (regime models, inflow innovations; docs/research/revisit.md). A stage on lna's hooks, so lna's measured inputs, stride and time limit apply.

  gap_prior:
    idea: lna, with readings the data cannot tell apart written the way system-dynamics models usually write them.
    how: >-
      Without noise, "B's inflow falls as A rises" (a goal gap) and "B has a constant inflow and
      drains by A's level" are the same equation. Real SD models do not drain a stock by another
      stock's level, so where the data cannot decide, the gap is written. This is a convention for
      a choice the data cannot make, not a discovery.
    helps_with: Goal-gap cases on noise-free data.
    builds_on: lna
    status: active
    note: From the "revisit" of past ideas; its document is not written yet.

  combined:
    idea: Run the specialist strategies side by side and let one judge pick among their models.
    how: >-
      lna, common_cause, censored, hidden_transit, effect_hats and periodic_inflows are each run
      as they are. One judge scores every model by how likely the measured changes are under it
      (applied exactly as the simulator applies it) plus a BIC price for every number it wrote
      down. The lowest score wins; ties go to the simpler model.
    helps_with: Every case at once - the aim is the best of each specialist.
    builds_on: lna, common_cause, censored, hidden_transit, effect_hats, periodic_inflows
    status: work in progress
    note: Its research document (combined.md) is not written yet.

  kalman_lna:
    idea: Treat the measured levels as noisy reports of the true stocks, and choose the flows by how likely the reports are through a Kalman filter.
    how: >-
      The true stocks are hidden and move by the flows, each flow a random count (as in lna). The
      reports are what a filter sees of them - with a measurement error, at missing or uneven
      times, as weekly means, a few steps late, with a few gross errors, or with one stock counted
      at the wrong scale - and the filter's likelihood fits the rates, the error's size, the delay
      and the scale together, while the flows are chosen by BIC. Data that look clean (every step,
      no measurement error) are left to combined.
    helps_with: Real-world reporting - measurement error, gaps, weekly reports, reporting delays, outliers and a miscounted stock.
    builds_on: lna, combined
    status: active
    note: docs/research/kalman_lna.md.

  structures:
    idea: combined's model, replaced by one built from the classic SD structures when the data clearly prefer it.
    how: >-
      A search fits flows that are products of two stocks (an infection S x I, word of mouth P x A,
      crowding X x X), a hiring gap over several stocks (target - R - E) / 6, and one hidden delay
      chain of 1 to 4 stages (a supply line, a construction or transmission delay, hidden rework),
      choosing terms by BIC. Its model replaces combined's only when combined's own judge scores it
      better and it behaves at least as well over many steps.
    helps_with: The canonical cases (SIR, SEIR, Bass, logistic, workforce, supply line, rework, World3 pollution).
    builds_on: combined
    status: work in progress

  combined2:
    idea: combined's way of choosing among specialists, with the newer specialists added and a judge that cannot be fooled by a model replaying its own inflow.
    how: >-
      Measurement noise goes to the Kalman filter (kalman_lna), series under 20 steps to archetypes.
      Otherwise the specialists run side by side (censored, realistic_hats, the lna family,
      hidden_transit, periodic_inflows, coflow_hats, own_tables, drifting_drain, odefit and, when two
      stocks move alike, common_cause) and one judge scores each model by how likely the measured
      changes are (counted exactly when the counts are small) plus a price per number. Before that,
      each model forecasts from many moments of the run with its found inflow held at the value it
      had when the forecast began; a model that then runs off is set aside, however well its inflow
      pieces replay the data. Finally the structures search (products, gaps over several stocks,
      hidden delay chains) and archetypes may replace the pick when they clearly do better. Every
      specialist is its own copy.
    helps_with: One strategy for the whole ladder - noisy reports, canonical structures, short series, physics, curved and drifting flows, co-flows, and realistic models where in-data fit favours runaway models.
    builds_on: combined, kalman_lna, structures, archetypes, odefit, own_tables, drifting_drain, censored, coflow_hats, realistic_hats
    status: work in progress

  combined_misfit:
    idea: combined's choice, unless even the chosen model does not fit the counts to their noise - then the model that tracks the data best over many steps is chosen.
    how: >-
      combined's specialists run and its judge picks by the one-step likelihood and a BIC price. With
      counts, the winner's leftover wiggles are then tested: are they as big as its counting noise
      says, and do they not repeat in time? If either test fails clearly (more than 5 standard
      errors), no candidate is right, the one-step score cannot be trusted, and the candidate whose
      runs over 5, 20 and 100 steps stay closest to the data is chosen instead.
    helps_with: Realistic models, where no candidate is exactly right and the one-step score picks models that drift off over many steps.
    builds_on: combined
    status: active
    note: docs/research/combined_misfit.md.

  combined_lean:
    idea: combined's model with the inflow changes and flows the data barely earn taken out.
    how: >-
      Each outside inflow written in pieces is cut again on its own change places, each change now
      costing about one and a half times what BIC charges (the modified BIC used for change points).
      Then flows are taken out one at a time while the price-adjusted score falls and the model still
      tracks the data over many steps. It only runs where the model fits the data to their noise.
    helps_with: The strict tier - passes that carry one or two extra inflow pieces or a weak extra flow.
    builds_on: combined
    status: active
    note: docs/research/combined_lean.md.

  combined_r2:
    idea: combined_misfit's choice, then combined_lean's leaner pass - the two proposals for combined's next round together.
    how: >-
      The judge switches to many-step error where no candidate fits the counts, and the chosen model
      then loses the inflow changes and flows the data barely earn (only where it fits).
    helps_with: Realistic models and the strict tier at once.
    builds_on: combined_misfit, combined_lean
    status: active
    note: docs/research/ideas-2026-10-18.md.

  archetypes:
    idea: For short, noisy series - try the classic SD structures whole (growth, logistic crowding, competition, predator and prey, Bass and infection moves, a hidden epidemic source) and keep the one the small-sample score prefers.
    how: >-
      Each candidate structure is fitted to the measured levels its own run reaches from fitted
      starting levels, so errors in the measurements do not bias the numbers, and it must not grow
      without limit. The small-sample Akaike criterion (AICc) chooses; a structure stitched together
      from the whole list of terms pays extra for the choice. Below 20 steps, where the main line
      returns nothing, this is the answer; on longer runs combined's model is kept unless this one
      forecasts the run's last quarter better when both are refitted on the rest.
    helps_with: The real-data cases - Gause's lab cultures and the boarding-school flu (6 to 14 samples), technology adoption (Bass), predator and prey.
    builds_on: combined (on runs of 20 steps or more)
    status: work in progress
    note: docs/research/archetypes.md.

glossary:

  # the model's parts
  stock:
    term: Stock
    group: The model's parts
    text: A quantity that accumulates over time, like water in a tank, people in a queue or money in an account. The ladder measures stocks' levels each step.
  flow:
    term: Flow
    group: The model's parts
    text: A rate at which things move into, out of, or between stocks each step. Discovery has to find the flows from the stocks' levels alone.
  move:
    term: Move
    group: The model's parts
    text: A flow that takes things out of one measured stock and puts the same things into another (A -> B). What leaves A arrives in B.
  link:
    term: Link
    group: The model's parts
    text: A flow from outside whose size depends on a stock's level (B gains in proportion to A) without taking anything from that stock. On averages it can look exactly like a move plus a drain.
  co_flow:
    term: Co-flow
    group: The model's parts
    text: A flow that uses up another stock as it runs (making each product consumes some material). It stops when the used stock runs dry.
  effect:
    term: Effect
    group: The model's parts
    text: A curve that speeds up or slows down a flow depending on some stock's level (a move from A to B that is faster when C is high).
  hidden_stock:
    term: Hidden stock
    group: The model's parts
    text: A stock that exists in the true model but is not measured, such as a delay between two measured stocks. Discovery has to infer it from its fingerprints on the others.
  pieces:
    term: Pieces / change points
    group: The model's parts
    text: An outside inflow written as a run of constant stretches. Each change point (where the value steps) is a number the model has to pay for; too many pieces can imitate almost anything.
  era:
    term: Era
    group: The model's parts
    text: A stretch of time with its own rule numbers, announced to discovery (a policy change on a known date). An unannounced one is a regime the strategy has to find.
  injection:
    term: Injection
    group: The model's parts
    text: A known, one-off amount added to a stock at an announced moment (a probe). Discovery is told about it, and the response shows how the system reacts.
  floor:
    term: Floor
    group: The model's parts
    text: Rates never go below zero, and a stock cannot give more than it holds (a cap). Where a floor or cap binds, the formula stops being a straight line.
  measured_input:
    term: Measured input
    group: The model's parts
    text: An outside driver given as data, such as customer demand, a pump setting or a hiring target. Discovery is told its values each step, as it is told eras and injections, and may use it in a flow's rate.
  delay3:
    term: Third-order delay (DELAY3)
    group: The model's parts
    text: Material that leaves one stock and arrives in another after a spread-out wait, like goods on order. It is three hidden stocks in a row; what arrives bunches around the average delay instead of trickling in at once.
  smoothing:
    term: Smoothing (SMOOTH)
    group: The model's parts
    text: A slowly updated average of a level, such as expected demand. It is a hidden stock that moves part of the way towards the level each step; it carries information, not material.
  sub_step:
    term: Sub-step (dt)
    group: The model's parts
    text: The truth is simulated in smaller steps than it is measured (dt 0.25 is four steps per measurement), as the published models are. The data then follow the smooth curve more closely than one step per measurement would.
  two_way_flow:
    term: Two-way flow
    group: The model's parts
    text: A flow that can run backwards (its rate goes negative), as a net flow or a heat exchange can in published models. SD Lab's flows only run one way, so such a model cannot be a case as written.
  canonical:
    term: Canonical case
    group: The model's parts
    text: A classic system dynamics model (an epidemic, Bass diffusion, a supply line, a project with rework, ...) imported from a modeller's file through PySD, and accepted only when PySD's simulation and SD Lab's give the same numbers. Announced injections or a measured input keep it moving over the ladder's runs.

  physics_case:
    term: Physics case
    group: The model's parts
    text: Data from a physical system that is not a stock-and-flow model (a tank draining through a hole, two coupled tanks, Newton cooling, a mass-spring-damper, predator-prey, a reaction chain, a thermostat), solved in continuous time by an ODE solver and sampled once per step. There is no true SD model to recover, so it is scored against the physics' structure and the best SD model, in its own Physics view, never in the tests' pass rate. Variants are none and meas (measurement error); counting noise does not apply, since nothing moves in whole things.
  physics_structure:
    term: Structure agreement (physics)
    group: Results
    text: Which stocks and measured inputs each stock's change reads, and with what sign, compared with the physics. It is read from the found model's derivatives over the run's states, so a move and a link, or births and deaths, count the same. A coupling counts when it is at least 10% of the strongest one into that stock (sampling continuous time adds small terms the equations do not have).
  physics_shape:
    term: Shape (physics)
    group: Results
    text: How a coupling bends - linear, a square root (concave, like a tank's outflow), a product of two stocks (predation), or a switch (an on/off heater). SD Lab's forms write lines and products, not square roots or switches with memory, so the shape is reported but not required for a pass.
  physics_reference:
    term: Reference (best SD model)
    group: Results
    text: The best model SD Lab's forms can write for a physics case, with one number per physical term (a square-root outflow as a straight line, a product as a rate times a linear effect, an on/off heater as a proportional controller), fitted by an oracle that knows the physics on the long noise-free run. Its skill is the yardstick a strategy's skill is compared with; the Now board draws it as the model the found one is compared with.
  physics_pass:
    term: Physics pass
    group: Results
    text: On a physics case, the found model's coupling graph and signs agree with the physics (nothing missing, nothing invented) and its fresh-run skill@20 is within 5 points of the reference's, or better. It is counted in the Physics view only.
  physics_longrun:
    term: Long-run error (physics)
    group: Results
    text: The found model run free for 5,000 steps from a fresh start, fed the measured inputs and announced injections, against the physics run as long - the rms gap over the last 1,000 steps as a share of each stock's range (100% at most; a model that runs away counts 100%). A cycle with no driver (predator-prey) drifts out of phase, so there even the reference is far off.
  particle_case:
    term: Particle case
    group: The model's parts
    text: Individual particles (balls, molecules) moved by explicit rules - bouncing down a Galton board, hopping along a conveyor, random-walking between chambers, falling over shelves into bins, binding when they meet - and measured as the count in each region at every step. The data never come from an SD model, yet the counts have a known SD answer, the mean-field model. Tagged physics and particles, shown in the Physics view with their own columns, never in the tests' pass rate.
  mean_field_model:
    term: Mean-field model
    group: The model's parts
    text: What the region counts do on average over many particles - each region a stock, each move a proportional flow whose rate is the per-step chance of that move, each arrival stream an inflow, and two kinds meeting (A + B -> C) a product of their counts. When every particle moves on its own with fixed chances it is exact in expectation; otherwise its numbers are transition frequencies measured over a long run, and it is checked against the average of 40 particle runs.
  particle_tier:
    term: Tier (particle case)
    group: The model's parts
    text: How far a particle case's mean-field model can be trusted. Exact - particles move independently with fixed per-step chances, so the mean-field model is the truth and equations are scored. Measured - close to exact (a stirred reaction); its numbers are measured over a long run and it tracks 40 particle runs within sampling error, so equations are scored too. Prediction - no SD form is exact (a gate that passes at most m balls a step, bins that overflow, unstirred chambers), so only forecasts are scored, against the mean-field model refitted on a separate run.
  particles_equations:
    term: Equations (particle case)
    group: Results
    text: On an exact or measured particle case, the found flows against the mean-field model with the ladder's own scorer and tolerances for counting noise - pass, equivalent or fail, as on any case. The particles' own randomness is close to the ladder's counting noise (a move of k per step from n particles varies as n k (1 - k), counting noise as n k).
  particles_reference:
    term: Vs mean-field (particle case)
    group: Results
    text: Fresh-run skill@20 or @100 minus the mean-field model's own, on the same particle runs (0 = as good). On an exact case the mean-field model gives the best forecasts any model can make from the counts, so a gap below 0 is skill lost; on a prediction-only case it is the refitted mean-field model, which a strategy can beat. A prediction-only run passes when both gaps are above -5 points.
  real_case:
    term: Real-data case
    group: The model's parts
    text: A measured series with a model someone published for it - US labour force levels and their measured flows (BLS), Gause's lab populations, the 1978 boarding-school influenza, US households adopting a technology. There is no true model, so it is scored by how well the found model forecasts the part of the series discovery did not see, and by how far its structure agrees with the published one, in its own Real data columns, never in a pass rate. Each has two variants, real (the data) and twin (the published model simulated like the data).
  heldout_skill:
    term: Held-out skill
    group: Results
    text: Discovery sees the first 75% of a real series. The found model then runs free from the last sample it saw to the end, and its error is compared with holding that last level (persistence) - 100% is exact, 0 is no better than persistence, below 0 is worse. The published model, refitted on the same samples, gets the same number, so "at least as good as the published model" can be counted. A held-out part that does not move has no skill.
  agreement:
    term: Agreement (with the published structure)
    group: Results
    text: The parts of the published model (moves, inflows, links, outflows, effects, hidden stocks) that the found model has (recall), and the found model's parts that the published one has (precision). It is called agreement, not a pass - the published structure is a hypothesis that fitted the data, and a simpler model that forecasts as well is not wrong.
  measured_flows:
    term: Measured flows (BLS)
    group: Results
    text: The US labour force data measure not only the employed, unemployed and not-in-the-labour-force levels but all six gross flows between them each month. Discovery sees only the levels; the found flows between two states, on the measured levels, are compared with the measured ones - found within 25% counts as matched. The net flow between two states, which levels alone can show, is compared too.
  twin:
    term: Twin (of a real case)
    group: Variants
    text: The published model simulated by SD Lab's engine at the real data's length and sampling, with measurement error as large as the data's, and scored like a ladder case against that model. If a method recovers the twin but not the real data's published structure, the gap is the data (or the published model's misfit), not the method.

  # the results
  pass:
    term: Pass
    group: Results
    text: Every true flow found with the right kind, ends and number (within tolerance), and nothing spurious (invented) of noticeable size.
  equivalent:
    term: Equivalent
    group: Results
    text: A different structure that produces exactly the same changes as the truth, so the data cannot tell them apart (e.g. births and deaths read as their difference). Shown apart from a pass.
  recall:
    term: Recall
    group: Results
    text: The share of true flow parts the found model has (right kind and ends, whatever the number).
  precision:
    term: Precision
    group: Results
    text: The share of found flow parts, large enough to count, that are true. Low precision means invented flows.
  skill20:
    term: Skill@20
    group: Results
    text: How much of the true model's movement 20 steps ahead the found model predicts, from about 150 starting moments. 100% is as good as the truth; 0% is no better than assuming nothing changes.
  skill100:
    term: Skill@100
    group: Results
    text: The same as skill@20, but 100 steps ahead.
  fresh_run:
    term: Fresh run
    group: Results
    text: Another run of the same true model with a new random seed, which discovery never saw. Used to check that the found model generalises; without noise it is the same run.
  occam:
    term: Occam score
    group: Results
    text: Accuracy discounted by extra complexity - fit times (true complexity / found complexity, at most 1). A model twice as complicated as the truth keeps half its credit.
  complexity:
    term: Complexity
    group: Results
    text: Flows plus the numbers needed to write their rates over the run (every inflow piece, effect point, co-flow and hidden stock counts), counted the same way for the truth and the found model.
  achievable:
    term: Pass (achievable)
    group: Results
    text: The pass rate over only the runs whose data allow a pass at all, by the identifiability and best-achievable-accuracy analysis.
  strict_pass:
    term: Strict pass
    group: Results
    text: A second, stricter verdict beside pass (pass itself is unchanged). A run strict-passes when it passes, its model is no more complicated than the truth (no extra parts, however small), and it behaves as well as the truth's own structure refitted on the same kind of data - its long-run error at 10 times the truth's slowest time constant and its fresh-run skill@100 within 3 standard deviations of the refits' (never stricter than the truth with every number 2% off). A pass whose long run or reference is not computed yet has no verdict, and is not counted as a fail.
  strict_reference:
    term: Strict reference
    group: Results
    text: What the truth's own structure achieves in one case and variant - its numbers fitted on the run discovery saw and on 6 more runs of the same kind, each graded as a found model is (fresh skill@100, long-run error). It sets that cell's strict thresholds. Where even the refits run away, or the run is too short for skill@100, that criterion is data-limited and not applied.

  # the variants
  noise_none:
    term: none (no noise)
    group: Variants
    text: The data are the simulator's exact flows. The equations should be recovered essentially exactly (within 2%).
  noise_counts:
    term: counts (counting noise)
    group: Variants
    text: Whole things move, so each step's flow is a random whole number around its rate (Poisson). The wiggles hide numbers but also carry information.
  noise_meas:
    term: meas (measurement error)
    group: Variants
    text: Counting noise, and then every reported level is off by a random Gaussian error (by default 5% of the level plus 1 thing). Errors in the levels make the steps' changes look noisier than they are and pull fitted rates toward the wrong values unless a method allows for them. Only on cases that ask for it (tag noisy).
  noise_gaps:
    term: gaps (missing points)
    group: Variants
    text: Counting noise, and about 30% of the points are simply missing, so the times jump unevenly (2, 3, 5 steps). A method that treats each pair of points as one step reads the rates wrong.
  noise_weekly:
    term: weekly (weekly reports)
    group: Variants
    text: Counting noise, and only one number per 7 steps is reported, the week's average level. A seventh of the points, each one a blur of a week.
  noise_lag:
    term: lag (reporting delay)
    group: Variants
    text: Counting noise, and every level is reported 3 steps late, while announced eras and injections keep their true times. The dynamics are unchanged, but announced events show up later in the data than announced.
  noise_outliers:
    term: outliers (gross errors)
    group: Variants
    text: Counting noise, and about 1% of the reported levels are grossly wrong (off by half to all of the stock's typical level). A few bad points can drag a least-squares fit far off; a robust method can find and drop them.
  noise_bias:
    term: bias (a miscounted stock)
    group: Variants
    text: Counting noise, and one stock (the last measured one) is always reported 20% too high. What leaves one stock seems to arrive as more in the other. Where the bias multiplies a number nothing else pins down (an inflow into that stock, a link into it), the data cannot tell the true number, and the cell is unidentifiable.
  noise_cost:
    term: Noise cost
    group: Variants
    text: For the noisy variants, how much larger the best standard error of a true number is on the reported data than on the clean counting-noise run underneath (1 means the noise costs nothing). The scorer's allowance widens by exactly this factor, never by a fixed amount.
  short_long:
    term: short / long
    group: Variants
    text: How many steps the run has - short is 300 steps, long is 2000. Longer runs pin numbers down better.

  # the methods
  lna:
    term: LNA (linear noise approximation)
    group: Methods
    text: A way to write how counting noise spreads through a system - each flow's random draw leaves its source and arrives at its destination. It lets the wiggles, not just the averages, tell structures apart.
  bic:
    term: BIC
    group: Methods
    text: The Bayesian information criterion - a score of fit that charges a fixed price (about half the log of the number of steps) for every extra number, so an extra flow must earn its place.
  likelihood:
    term: Likelihood
    group: Methods
    text: How probable the observed data are if a given model were true. Fitting by likelihood means choosing the numbers that make the data most probable.
  kalman:
    term: Kalman filter
    group: Methods
    text: A step-by-step method that tracks a quantity you cannot see (like a hidden stock's level) from noisy measurements of things it affects, keeping a running best guess and its uncertainty.
  common_cause:
    term: Common cause
    group: Methods
    text: Something outside that drives several unrelated stocks at the same moments (one event raising two inflows). It makes the stocks move together, which a fit can mistake for a direct link between them.
  identifiable:
    term: Identifiable
    group: Methods
    text: A model part is identifiable when the data can, in principle, pin it down. If two different models produce the same data, the choice between them is not identifiable and no method can make it.
  cramer_rao:
    term: Cramér–Rao bound
    group: Methods
    text: The smallest uncertainty any unbiased method can achieve for a number from the given data. If a strategy misses by less than this, the data, not the strategy, are the limit.

  # the Kubernetes examples (sd-k8s-platform, sd-k8s-small; docs/research/k8s-model.md)
  hpa:
    term: HPA (Horizontal Pod Autoscaler)
    group: Kubernetes model
    text: Kubernetes' controller that sets how many copies (replicas) of a service run, from how busy they are. It aims at a CPU use per pod (say 70% of what each pod asked for), adds pods quickly when load rises, and removes them only after load has stayed low for a few minutes, between a minimum and a maximum.
  pod_lifecycle:
    term: Pending, starting, ready and terminating pods
    group: Kubernetes model
    text: A new pod waits (pending) until the scheduler finds a node with room, then starts (pulling its image and passing its readiness check, a minute or more), then serves traffic (ready). When it is removed it stops taking traffic and shuts down (terminating).
  requests_and_limits:
    term: CPU and memory requests and limits
    group: Kubernetes model
    text: Each pod asks for an amount of CPU and memory (its request), which the scheduler reserves on a node, and may use up to a cap (its limit). Above the CPU limit it is slowed down (throttled); above the memory limit it is killed (an OOM kill).
  cpu_throttling:
    term: CPU throttling
    group: Kubernetes model
    text: When a pod tries to use more CPU than its limit, the kernel makes it wait. Requests take longer, queues build and some requests time out, although the node may have CPU to spare.
  oom_kill:
    term: OOM kill
    group: Kubernetes model
    text: Out of memory - when a pod's memory reaches its limit, the kernel kills it. The pod restarts, loses the requests it was handling, and has to pass its readiness check again. A memory leak makes it happen every so often; a burst of load can make it happen again and again (a crash loop).
  cluster_autoscaler:
    term: Cluster autoscaler
    group: Kubernetes model
    text: Adds nodes (machines) to a pool when pods are pending for lack of room, which takes a few minutes to boot, and removes nodes that have been underused for a while (about ten minutes), between a minimum and a maximum.
  node_occupancy:
    term: Node occupancy (requested over allocatable)
    group: Kubernetes model
    text: How full a node pool is - the CPU or memory the scheduled pods have asked for, as a share of what the nodes can offer. Near 100% new pods cannot be placed and wait as pending until the cluster autoscaler adds a node.
  retry_loop:
    term: Retries (a retry loop)
    group: Kubernetes model
    text: Clients send a failed or timed-out request again. Under overload the retries add to the load that caused the failures - a reinforcing loop that can keep a service overloaded after the original burst has passed.
  replication_lag:
    term: Replication lag
    group: Kubernetes model
    text: How far a database's read replica is behind its primary, in seconds. It grows when the primary takes writes faster than the replica can apply them, and shrinks when writes slow down.

  # control theory (the control cases, tag control: docs/research/control-cases.md)
  setpoint:
    term: Setpoint (reference)
    group: Control theory
    text: The value a controller is told to hold, such as 20 degrees on a thermostat or 70 mph on a cruise control. On the ladder it is a measured input. The controller acts on the error, setpoint minus the measured value.
  p_control:
    term: P control (proportional)
    group: Control theory
    text: The controller pushes in proportion to the error, gain x (setpoint - level). Simple and quick, but it needs some error to keep pushing, so it usually settles a little short of the setpoint (a steady-state error). In SD terms it is a gap flow, k x setpoint - k x level.
  pi_control:
    term: PI control (proportional-integral)
    group: Control theory
    text: P control plus a term for the running sum of the error (the integral). As long as any error remains the sum keeps growing and the push with it, so the level ends exactly at the setpoint. On the ladder the integral is a stock that gains the setpoint and loses the level each step.
  pid_control:
    term: PID control
    group: Control theory
    text: PI control plus a derivative term that reacts to how fast the level is changing, damping the swing before it overshoots. A level's rate of change is its net flow, so the derivative reads the stocks that feed it.
  steady_state_error:
    term: Steady-state error
    group: Control theory
    text: How far the level stays from the setpoint once everything has settled, here as a share of a setpoint step. It is not 0 under P control alone. Integral action (or a plant that integrates by itself, like a tank with no drain) brings it to 0 for a setpoint step.
  overshoot:
    term: Overshoot
    group: Control theory
    text: How far the level passes its new value after a setpoint step before coming back, as a share of the step. A fast, aggressive loop overshoots; a well-damped one barely does.
  settling_time:
    term: Settling time
    group: Control theory
    text: How many steps after a setpoint step the level takes to stay within 2% (of the step) of its final value.
  gain_phase_margin:
    term: Gain and phase margin
    group: Control theory
    text: How far a feedback loop is from oscillating without end. The gain margin is how many times stronger the controller could be before the loop goes unstable; the phase margin is how much extra lag (a delay) it could take. A gain margin near 1 means ringing that dies away slowly.
  dead_time:
    term: Dead time (transport delay)
    group: Control theory
    text: A wait between the controller acting and the level feeling it, such as hot water travelling down a pipe. The controller keeps pushing on old news, so a strong controller overcorrects and the loop rings; too much gain and it oscillates for ever. On the ladder it is a DELAY3 chain of hidden stocks.
  windup:
    term: Integrator windup
    group: Control theory
    text: When the actuator hits a limit (a heater full on, an engine that cannot brake), the controller's integral keeps adding up an error it cannot act on. When the limit is released, the swollen integral overcorrects and the level swings far past the setpoint before recovering.
  on_off_control:
    term: On/off (bang-bang) control
    group: Control theory
    text: The actuator is either full on or off, depending on which side of the setpoint the level is, like a household thermostat. It never settles, it chatters in a band around the setpoint. On the ladder it is a steep table effect.
  feedforward:
    term: Feedforward
    group: Control theory
    text: Acting on a disturbance as soon as it is measured, before it has moved the level (opening the valve as demand rises), from a model of its effect. Feedback then cleans up what the model got wrong.
  cascade_control:
    term: Cascade control
    group: Control theory
    text: Two loops one inside the other. The outer loop decides the setpoint of a fast inner loop (the outer tank's controller asks for a level in the upper tank, and the inner controller drives the pump to reach it), so disturbances the inner loop sees are corrected before they reach the outer level.
  closed_loop_identification:
    term: Closed-loop identification
    group: Control theory
    text: Learning a system's equations from data taken while a controller is running it. The controller fights every movement, so without outside excitation (setpoint changes, a test signal) the data say little, and a constant setpoint cannot show how the loop answers a setpoint. The analysis labels such cells data-limited or unidentifiable.
  prbs:
    term: PRBS (pseudo-random binary sequence)
    group: Control theory
    text: A test signal that switches between two levels in a fixed pseudo-random pattern, exciting a system at many speeds at once. Identification engineers move a setpoint this way to learn a loop while it runs.
