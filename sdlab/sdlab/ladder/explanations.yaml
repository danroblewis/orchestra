# Plain-language explanations of the discovery strategies and of the words the ladder pages use.
#
# One entry per strategy under sdlab/discovery/strategies/ (tests/test_ladder_explanations.py checks
# that none is missing). They live here, not in the strategy packages, because the ladder hashes a
# strategy's source: an edit there would mark all its results stale.
#
# Each strategy: idea (one sentence), how (2-4 short sentences), helps_with, builds_on, status
# (active | parked | work in progress | retire-candidate) and an optional note. Sources: the
# strategy's own docstring and its document in docs/research/ (README.md maps names to documents).
# status: parked = in sdlab/ladder/parked.yaml; retire-candidate = its research document's verdict
# is "reject"; work in progress = said so in its code or documents.
#
# Served by /api/ladder/strategies (as "about") and /api/ladder/glossary (sdlab/ladder/explain.py).

strategies:

  matrix:
    idea: The main line - fit each stock's change per step as a sum of simple terms, then keep the candidate model that behaves best.
    how: >-
      For every stock, the change in each step is fitted by a straight-line formula of the stocks'
      levels (a regression), with the stock's outside inflow allowed to change in pieces. The
      fitted numbers are read back as flows: moves, links, drains. Several ways of doing the fit
      give several candidate models, and a judge runs each one forward on the data and keeps the
      one that tracks the measured levels best.
    helps_with: Ordinary linear systems - chains, drains, moves between stocks, links, constant or stepped inflows.
    builds_on: nothing (it is the base the others extend)
    status: active

  change_price:
    idea: The main line, but a stock's outside inflow may change over time only if the change is worth its textbook price.
    how: >-
      The main line lets an outside inflow change in many cheap pieces. Here, before any pieces
      are allowed, a gate asks whether a changing inflow beats a constant one when each change
      pays the standard BIC price. Inside the fit the main line's cheaper price is kept, because
      the textbook price made the fit spiral on inflows that really do change often.
    helps_with: Stocks whose inflow is really constant but gets cut into spurious pieces.
    builds_on: matrix
    status: retire-candidate
    note: Research verdict "reject (a narrower gate is neutral)" (docs/research/change-price.md).

  held_out:
    idea: Choose among the main line's candidate models by how well they predict data they were not fitted on.
    how: >-
      The run is cut into blocks. Each candidate is fitted on all blocks but one and run forward
      inside the one left out (cross-validation). The candidate with the smallest error on the
      left-out blocks is then fitted on all the data.
    helps_with: Candidates that look good only because they were fitted to the same data they are judged on.
    builds_on: matrix
    status: retire-candidate
    note: Research verdict "reject" on benchmark v1 (docs/research/held-out-judge.md).

  held_out_blend:
    idea: The main line's judge, nudged a little by the held-out error of held_out.
    how: >-
      Each candidate gets a score that is mostly the usual in-sample error plus a small weight on
      its error on left-out blocks. The lowest blended score wins.
    helps_with: The same as held_out, with less risk of throwing away the in-sample judge's good picks.
    builds_on: held_out
    status: parked
    note: Parked as slow and no better than the main line (124 s per ladder, 36% pass; parked.yaml).

  output_error:
    idea: Take the main line's model and polish its rate numbers so that runs many steps ahead stay close to the data.
    how: >-
      The main line fits one step at a time. Here the best few candidates have their rates
      adjusted so the model, started from many moments and run 5, 20 and 100 steps, stays close to
      the measured levels (output error). The outside inflows stay as found. The judge keeps
      whichever version, polished or not, it rates best.
    helps_with: Rates that are slightly off because one-step fits are biased by noise.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination - keep as a final step after structural fixes".

  shared_noise:
    idea: Tell moves, links and co-flows apart by which stocks' random wiggles happen together.
    how: >-
      When whole things move from A to B, a random extra unit leaving A shows up as an extra unit
      arriving in B in the same step. A link or an independent drain does not produce that
      matched pattern. So the leftovers of the fit (what the formulas do not explain) are
      compared between stocks to decide which reading is right.
    helps_with: Counting-noise data where a move, a link plus a drain, or a co-flow would explain the averages equally well.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination (with a fix for drain bias)". Its idea lives on in lna.

  floors:
    idea: Fit flows in the form the simulator steps them - rates never below zero, and no stock giving more than it holds.
    how: >-
      Where a stock runs empty, the outflows it could not pay are added back and the rows are
      fitted again (caps). Optionally a "hinge" column, zero below a threshold, lets a rate stop
      at zero (floors; off by default). Every version is judged like the main line's candidates.
    helps_with: Stocks that run dry and rates that hit zero.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination"; continued by censored.

  censored:
    idea: Rewrite a row's outside flows as a rate that stops at zero, or as a demand capped by what the stock holds, where the data say so.
    how: >-
      Taking the main line's model, each stock is offered rewrites. A floor is a rate that
      falls with a stock's level until it hits zero and stays there; a cap is a constant demand
      that cannot take more than the stock holds. Its outside inflow is also re-cut into fewer
      pieces (each change must pay a higher price), and a negative link is read as an inflow
      that falls with another stock. A rewrite is kept only if it scores clearly better (BIC,
      with floors and caps applied as the simulator applies them).
    helps_with: Rates that hit zero (case 024) and stocks that run empty (case 025).
    builds_on: matrix (continues floors)
    status: active
    note: Research document docs/research/censored.md.

  gated:
    idea: Before judging, throw out candidate models that run away when simulated freely.
    how: >-
      Each candidate is run from the observed, empty and very high states. One whose stocks shoot
      far outside their observed range is rejected (or refitted once with the culprit number set
      to zero). The judge then picks among those that pass.
    helps_with: Models that fit the data but explode outside it.
    builds_on: matrix
    status: retire-candidate
    note: Research verdict "reject for the main line; keep gate.py for flexible strategies" (behaviour-consistency.md).

  gated_no_high:
    idea: gated without its test from very high starting levels.
    how: >-
      The same gate as gated, but candidates are not run from five times the observed maximum,
      which judges behaviour far outside anything the data visit. It is an ablation (a version
      with one piece removed) to see what that test contributes.
    helps_with: Measuring how much the "high" test helps or hurts gated.
    builds_on: gated
    status: retire-candidate
    note: Same research verdict as gated.

  gradient:
    idea: Fit the main line's model numbers by gradient descent through a simulator that can be differentiated.
    how: >-
      The model is written so the computer can work out how the multi-step error changes with each
      number, then the numbers are adjusted step by step to lower it. A "generous" variant also
      adds every possible effect and co-flow and prunes the small ones away.
    helps_with: Polishing numbers, and finding effects and co-flows the main line's form cannot express.
    builds_on: matrix
    status: parked
    note: Parked as slow (197 s per ladder) and no better than matrix (35% pass). Needs the optional jax package.

  hidden_delays:
    idea: Look for an unmeasured stock between two measured ones by offering delayed copies of a level.
    how: >-
      After the main line, each stock's row is offered delayed copies of every other stock's level.
      If B's row picks a delayed copy of A, a hidden stock A -> H -> B may sit between them. Such
      stocks are added one at a time while the model behaves better, with the delay tuned.
    helps_with: A delay or pipeline stock nobody measures.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination"; hidden_transit is the later method for the same case.

  hidden_transit:
    idea: Find an unmeasured transit stock between two measured stocks, fitting the pair with a Kalman filter.
    how: >-
      For each pair where A loses things and B gains them, two models are fitted by the same
      likelihood: A -> H -> B through a hidden stock H with a delay, or B getting a share of A's
      loss straight away. A Kalman filter tracks H's unseen level using the random wiggles that
      A and B share. The hidden stock is kept only when it wins clearly (BIC) and behaves better
      on the data.
    helps_with: A hidden delay stock between two measured stocks (cases 015 and 026).
    builds_on: matrix
    status: active
    note: Research verdict "adopt candidate" - the first strategy to pass case 015.

  mass_balance:
    idea: Reconstruct an unmeasured stock between two measured ones from what one loses and the other gains.
    how: >-
      Where A loses things to outside and B, of the same unit, gets things from outside, the
      strategy tries A -> H -> B with H's level worked out from the balance (what went in minus
      what came out). A pair whose balance does not add up (H drifts or goes negative) is rejected;
      one that makes the model behave better is kept.
    helps_with: Hidden stocks where the unit's things are conserved.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination".

  mass_balance_all:
    idea: mass_balance tried on every candidate model, not only the one the main line chose.
    how: >-
      The same mass-balance search as mass_balance, run on each of the main line's candidates.
      The judge picks among all the results.
    helps_with: Cases where the main line's chosen model hides the pair mass_balance needs.
    builds_on: mass_balance
    status: active

  sindy:
    idea: The off-the-shelf PySINDy method, given system-dynamics-shaped building blocks and conservation rules.
    how: >-
      Each stock's change is written as a sparse combination of terms from a library - the levels
      and products of two levels - with weak terms dropped by a threshold. Conservation (what
      leaves one stock arrives in another) is imposed across rows. The terms are read back as
      flows, effects and co-flows.
    helps_with: Products of levels (a flow sped up by another stock), and checking a standard tool against ours.
    builds_on: nothing (an outside method; one option combines it with matrix)
    status: retire-candidate
    note: Research verdict "reject as a strategy; carry two pieces forward" (pysindy.md). Needs pysindy and cvxpy.

  symbolic:
    idea: Search for effect curves - a flow's rate multiplied by a curve of some stock's level - and offer them as candidates.
    how: >-
      A grammar of curve shapes is screened against what the main line's rows leave unexplained.
      Promising curves are offered to the fit as extra columns and translated back into SD Lab
      effects. Every candidate, with or without effects, is judged by how it behaves.
    helps_with: Flows whose rate bends with another stock's level (effects).
    builds_on: matrix
    status: active
    note: Research - the best single mechanism on benchmark v2.1; needs a combination.

  symbolic_anchor:
    idea: symbolic's effects, accepted only when a test that inflow pieces cannot fake says they help.
    how: >-
      The main line's outside inflows in pieces can imitate almost anything, including an effect.
      So an effect is accepted only if, with a coarse inflow neither model tailored, the model
      with it predicts better than without it by more than the judge's own noise, and also does
      better with its own pieces.
    helps_with: Keeping symbolic's real effects while refusing effects that inflow pieces could have produced.
    builds_on: symbolic
    status: active
    note: Research - the "anchor" rule was rejected; the "safe" rule keeps a third of symbolic's gain with no losses.

  effect_hats:
    idea: Fit effect curves as tables of straight-line segments, all numbers fitted together by least squares.
    how: >-
      A curve of a stock's level is built from "tent" functions over a few knots, so the curve is
      exactly an SD Lab table effect and is linear in its table values. Pairs (flow, stock) are
      screened on what the rows leave unexplained, the best curves are fitted jointly across rows,
      and a candidate replaces the base model only if it explains both halves of the data and
      prices better by BIC. Every model's outside inflows are also pooled into a few values and
      re-cut where they really change, since many inflow pieces make a drain look faster than it is.
    helps_with: Effects - linear (017) and with a kink (018) - and, through the re-cut inflows, drains and chains under counting noise.
    builds_on: matrix
    status: active
    note: Research document docs/research/effect-hats.md.

  numopt_fd:
    idea: Refit the main line's numbers by multi-step error with a standard optimiser, gradients by finite differences.
    how: >-
      The main line's model is the start. Its numbers, and optional effects and co-flows added one
      at a time, are adjusted with scipy's least-squares solver so the model's runs match the data;
      the slope of the error is estimated by nudging each number a little (finite differences).
    helps_with: Numbers biased by one-step fitting; effects and co-flows.
    builds_on: matrix
    status: parked
    note: Parked as slow (142 s per ladder, 20% pass).

  numopt_fd_coarse:
    idea: numopt_fd with each outside inflow as a few coarse pieces whose values are fitted too.
    how: >-
      The same refit as numopt_fd, but the outside inflows are not frozen: each is cut into a few
      blocks with a free, penalised factor per block, fitted with everything else.
    helps_with: Testing whether letting inflows move during the refit helps.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (325 s per ladder, 22% pass).

  numopt_fd_profile:
    idea: numopt_fd with the outside inflows re-measured at every step of the optimisation.
    how: >-
      Every time the optimiser tries new numbers, the inflows of the affected stocks are measured
      again as whatever the stock's change leaves over. This lets an effect replace links without
      the old inflows fighting it.
    helps_with: Testing effects that change a stock's balance.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (164 s per ladder, 22% pass).

  numopt_lbfgs:
    idea: numopt with the L-BFGS-B optimiser.
    how: >-
      The same refit of the main line's numbers by multi-step error, using L-BFGS-B, a standard
      gradient-based method that keeps numbers within bounds. It exists to check whether the
      choice of optimiser matters.
    helps_with: Comparing optimisers (research found the optimiser is not the bottleneck).
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (188 s per ladder, 31% pass).

  numopt_nm:
    idea: numopt with the Nelder-Mead optimiser, which needs no gradients.
    how: >-
      The same refit, using Nelder-Mead, which moves a small cloud of trial points downhill
      without computing slopes.
    helps_with: Comparing optimisers.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (186 s per ladder, 34% pass).

  numopt_powell:
    idea: numopt with Powell's method, which searches along one direction at a time.
    how: >-
      The same refit, using Powell's method: line searches along a set of directions, no
      gradients needed.
    helps_with: Comparing optimisers.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (173 s per ladder, 34% pass).

  numopt_bo:
    idea: numopt with Bayesian optimisation, which models the error surface to choose where to try next.
    how: >-
      The same refit, using Bayesian optimisation: a statistical model of the error guesses
      which numbers are worth trying next. Fits with too many numbers are skipped.
    helps_with: Comparing optimisers on small fits.
    builds_on: numopt_fd
    status: parked
    note: Parked as the slowest (969 s per ladder, 34% pass).

  numopt_cma:
    idea: numopt with CMA-ES, an evolutionary optimiser.
    how: >-
      The same refit, using CMA-ES: a population of trial numbers is sampled, the best are kept,
      and the sampling adapts towards them.
    helps_with: Comparing optimisers.
    builds_on: numopt_fd
    status: parked
    note: Parked as slow (229 s per ladder, 34% pass). Needs the optional cma package.

  piece_proof:
    idea: Choose among the main line's candidates with a judge that the candidates' own inflow pieces cannot fool.
    how: >-
      The usual judge replays each candidate with its own outside-inflow pieces, which were fitted
      to this run, so a candidate with many pieces looks good. This judge feeds every candidate
      inflows it did not tailor before comparing them.
    helps_with: Candidates that only look good because their inflow pieces copy the data.
    builds_on: matrix
    status: retire-candidate
    note: Research verdict "reject as the main judge; keep judges.py" (inflow-conditioned-judge.md).

  pieces_gate:
    idea: The main line with one fix - a changing inflow is kept only if its average is clearly above or below zero for its own uncertainty.
    how: >-
      At the end of the main line's fit, a row's changing outside inflow is kept or dropped. Here
      the test compares the inflow's mean with its own standard error instead of with the spread
      of the pieces' values. It is an ablation (one change tested alone).
    helps_with: A bug in the main line's pieces test that inflow_attribution uncovered.
    builds_on: matrix
    status: active

  periodic_inflows:
    idea: Read an outside inflow as one period's profile repeated (a daily or weekly cycle) plus a slow level.
    how: >-
      After the main line, each stock whose inflow is better described by BIC as a repeating
      profile has that profile taken out as known. The main line then runs again on the rest, so
      the other numbers are not bent by an inflow that pieces would have had to chase.
    helps_with: Seasonal or daily cycles in what arrives from outside.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination; strong adopt candidate".

  latent_eras:
    idea: Find unannounced periods where the system's numbers change, then fit them as eras.
    how: >-
      The rows' fitted numbers are tracked over time and recurring regimes (stretches with
      different numbers) are found. Those regimes are added to the announced eras and the main
      line's "numbers per era" candidates are fitted again. A candidate with regimes must beat the
      main line clearly, since regimes add numbers.
    helps_with: Rules that change without anyone announcing it.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination"; one regime sometimes stands in for an inflow.

  starved_coflows:
    idea: Find co-flows (one flow using up another stock) by fitting only the steps where the used stock had enough.
    how: >-
      When the used stock runs low, the flow is capped and the straight-line fit is bent. So the
      steps where a stock held less than its users wanted are left out of the fit, and terms like
      "C drains faster when A is high" are read as co-flows. These join the main line's candidates
      before the judge.
    helps_with: Flows that consume another stock, which then runs dry.
    builds_on: matrix
    status: active
    note: Research verdict "adopt as extra candidates".

  recession:
    idea: Measure each drain on the quiet steps where nothing arrives from outside, and offer those as extra candidates.
    how: >-
      When a stock's inflow is quiet, its change is its drain alone, so the drain can be measured
      without inflow pieces getting in the way. Rows refitted that way, with the inflow measured
      afterwards, join the candidates.
    helps_with: Drains biased by a busy outside inflow.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination".

  impulses:
    idea: Treat one-step arrivals and short bursts as their own kind of input, so no flow has to absorb them.
    how: >-
      Sudden jumps in a stock's change are found jointly with the row's numbers (find pulses,
      refit without them, repeat). A sudden loss counts only where another stock gains in the
      same step. The pulses are then removed before fitting and returned as outside flows that
      arrive only in those steps.
    helps_with: Deliveries, batches and shocks (pulse cases).
    builds_on: matrix
    status: active
    note: Research verdict "adopt after combining with the judge/gate".

  row_crossover:
    idea: Take the judge's pick, then swap in single stocks' formulas from other candidates where the whole model behaves clearly better.
    how: >-
      Different candidates may get different stocks right. Each stock's row is swapped for
      another candidate's row and kept if the whole model's error drops by at least 5%, for a
      couple of sweeps.
    helps_with: Models where no single candidate is right everywhere.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination"; the in-sample judge can be fooled by a flexible row.

  paced_moves:
    idea: Read the fitted numbers as "what moves where" times "how fast", including moves paced by a third stock and goal-gap inflows.
    how: >-
      Each candidate is also read with moves whose speed is set by a third stock (one shared
      number), and the best reading is then offered goal-gap inflows (an inflow that grows with
      the distance to a target) one at a time. Everything goes before the same judge.
    helps_with: Moves paced by another stock, and goal-seeking inflows.
    builds_on: matrix
    status: active
    note: Research - paced moves rejected as they stand; gap inflows need a combination.

  inflow_attribution:
    idea: Test each row for an inflow that is soaking up its drain, and refit those rows with the drain measured within stretches.
    how: >-
      Each candidate's rows are checked against the size of counting noise and a partial
      simulation. A flagged row has its drain measured within stretches where the inflow holds
      still, then its inflow recovered with that drain fixed. The judge chooses among the repaired
      candidates.
    helps_with: Drains biased by outside-inflow pieces, and which stocks really get outside inflow.
    builds_on: matrix
    status: active
    note: Research verdict "needs a combination (not significant alone)"; found the pieces-gate bug.

  inflow_attribution_refine:
    idea: inflow_attribution applied only to the main line's chosen model.
    how: >-
      Only the chosen model's flagged rows are repaired, and the repair is kept only if the judge
      rates it better.
    helps_with: A cheaper, safer version of inflow_attribution.
    builds_on: inflow_attribution
    status: active

  inflow_attribution_both:
    idea: inflow_attribution with the unrepaired candidates kept beside the repaired ones.
    how: >-
      The judge chooses among both sets, so a repair that makes a candidate worse cannot win by
      default.
    helps_with: Checking whether repairs ever hurt.
    builds_on: inflow_attribution
    status: active

  earned_pieces:
    idea: The main line, but a stock's outside inflow may change only once the data earn it.
    how: >-
      Each stock's formula and inflow are chosen together, with every change in the inflow
      paying its full price (a value and a place) in BIC, instead of cheap pieces being allowed
      first. Then whether a stock passes all its loss on to other stocks (conservation) is
      decided by all rows at once, using counting noise as evidence.
    helps_with: Spurious inflow pieces, and drains that should equal what receivers take.
    builds_on: matrix
    status: work in progress
    note: Its code says "work in progress"; there is no research document for it yet.

  common_cause:
    idea: Separate independent sub-systems that only look connected because something outside drives them at the same moments.
    how: >-
      If two unrelated stocks both have inflows that step up at the same moments (a common cause),
      a fit can wrongly explain one with the other's level (a fake cross-link). Here a change
      moment already found in one stock is offered to the others at the price of only its value,
      so a cross-link survives only if it explains something the shared moments do not. For
      noise-free data it also fits to computer precision and, among exact fits, keeps the
      plainest formula.
    helps_with: Independent systems (cases 028-033) and systems with identical numbers (034-038).
    builds_on: earned_pieces
    status: active
    note: Ladder work done; the benchmark is in progress (docs/research/common_cause.md).

  lna:
    idea: Choose flows by how likely the step-by-step changes are under counting noise (the linear noise approximation).
    how: >-
      Averages alone cannot tell a move from a link plus a drain. But when whole things move, the
      random wiggles leave fingerprints - a unit leaving A shows up arriving in B, and births
      plus deaths make more wiggle than their difference alone. This strategy fits all stocks
      together by that likelihood. On noise-free data there are no wiggles to read, so it returns
      the main line's answer.
    helps_with: Telling apart readings that average the same - moves vs links, co-flows, births vs deaths, goal gaps.
    builds_on: matrix
    status: active
    note: Research verdict "adopt the mechanism for structure" - the ladder's best single strategy; not yet the main line on the examples (docs/research/lna.md).

  lna_loops:
    idea: lna, but a feedback link that closes a loop is kept whenever the data cannot rule it out.
    how: >-
      lna drops a small number when keeping it does not pay the BIC price. A link closing a
      feedback loop is often small and uncertain, so it gets dropped. Here those loop-closing
      links are offered back and kept whenever their best-fitting value is above zero.
    helps_with: Feedback loops with weak links.
    builds_on: lna
    status: active
    note: From the "revisit" of past ideas; its document (revisit.md) is not written yet. Costs extra flows where the truth has none.

  lna_products:
    idea: lna with a move allowed to be scaled by a third stock's level (a linear effect).
    how: >-
      Product terms (A's level times C's level) are added to lna's choices, so a move from A to B
      can speed up when C is high. They are chosen by the same counting-noise likelihood and BIC
      as every other flow. With no noise or fewer than three stocks it is lna.
    helps_with: Linear effects of a third stock (case 017) with counting noise.
    builds_on: lna
    status: work in progress
    note: From the "revisit" of past ideas; its code is being edited and its document is not written yet.

  lna_pulses:
    idea: Find pulses (one-step arrivals, short bursts) first, then run lna on what they leave.
    how: >-
      The pulse detection of impulses is run first and the pulses are taken out of each step's
      change, so a burst is not read as a move, link or drain. lna then reads the rest. The
      pulses are returned as outside flows that arrive only in those steps.
    helps_with: Pulses in noisy data.
    builds_on: lna (with impulses' detector)
    status: active
    note: From the "revisit" of past ideas; its document is not written yet.

  lna_levels:
    idea: lna, with an outside inflow that switches between a few recurring values described by those few values instead of one number per piece.
    how: >-
      An inflow that flips between, say, a high and a low value (a square wave) is grouped into a
      few recurring levels, each measured from all the steps at that level, so it costs two
      numbers instead of one per piece. Where a stock seems to grow with itself beside an outside
      inflow, the version without that growth (inflow cut afresh into pieces) is also tried. The
      lower BIC wins. Noise-free runs are lna's.
    helps_with: Unannounced inflows that switch back and forth between a few values.
    builds_on: lna
    status: work in progress
    note: From the "revisit" of past ideas (regime models, inflow innovations); new and uncommitted, its document is not written yet.

  gap_prior:
    idea: lna, with readings the data cannot tell apart written the way system-dynamics models usually write them.
    how: >-
      Without noise, "B's inflow falls as A rises" (a goal gap) and "B has a constant inflow and
      drains by A's level" are the same equation. Real SD models do not drain a stock by another
      stock's level, so where the data cannot decide, the gap is written. This is a convention for
      a choice the data cannot make, not a discovery.
    helps_with: Goal-gap cases on noise-free data.
    builds_on: lna
    status: active
    note: From the "revisit" of past ideas; its document is not written yet.

  combined:
    idea: Run the specialist strategies side by side and let one judge pick among their models.
    how: >-
      lna, common_cause, censored, hidden_transit, effect_hats and periodic_inflows are each run
      as they are. One judge scores every model by how likely the measured changes are under it
      (applied exactly as the simulator applies it) plus a BIC price for every number it wrote
      down. The lowest score wins; ties go to the simpler model.
    helps_with: Every case at once - the aim is the best of each specialist.
    builds_on: lna, common_cause, censored, hidden_transit, effect_hats, periodic_inflows
    status: work in progress
    note: Its research document (combined.md) is not written yet.

glossary:

  # the model's parts
  stock:
    term: Stock
    group: The model's parts
    text: A quantity that accumulates over time, like water in a tank, people in a queue or money in an account. The ladder measures stocks' levels each step.
  flow:
    term: Flow
    group: The model's parts
    text: A rate at which things move into, out of, or between stocks each step. Discovery has to find the flows from the stocks' levels alone.
  move:
    term: Move
    group: The model's parts
    text: A flow that takes things out of one measured stock and puts the same things into another (A -> B). What leaves A arrives in B.
  link:
    term: Link
    group: The model's parts
    text: A flow from outside whose size depends on a stock's level (B gains in proportion to A) without taking anything from that stock. On averages it can look exactly like a move plus a drain.
  co_flow:
    term: Co-flow
    group: The model's parts
    text: A flow that uses up another stock as it runs (making each product consumes some material). It stops when the used stock runs dry.
  effect:
    term: Effect
    group: The model's parts
    text: A curve that speeds up or slows down a flow depending on some stock's level (a move from A to B that is faster when C is high).
  hidden_stock:
    term: Hidden stock
    group: The model's parts
    text: A stock that exists in the true model but is not measured, such as a delay between two measured stocks. Discovery has to infer it from its fingerprints on the others.
  pieces:
    term: Pieces / change points
    group: The model's parts
    text: An outside inflow written as a run of constant stretches. Each change point (where the value steps) is a number the model has to pay for; too many pieces can imitate almost anything.
  era:
    term: Era
    group: The model's parts
    text: A stretch of time with its own rule numbers, announced to discovery (a policy change on a known date). An unannounced one is a regime the strategy has to find.
  injection:
    term: Injection
    group: The model's parts
    text: A known, one-off amount added to a stock at an announced moment (a probe). Discovery is told about it, and the response shows how the system reacts.
  floor:
    term: Floor
    group: The model's parts
    text: Rates never go below zero, and a stock cannot give more than it holds (a cap). Where a floor or cap binds, the formula stops being a straight line.

  # the results
  pass:
    term: Pass
    group: Results
    text: Every true flow found with the right kind, ends and number (within tolerance), and nothing spurious (invented) of noticeable size.
  equivalent:
    term: Equivalent
    group: Results
    text: A different structure that produces exactly the same changes as the truth, so the data cannot tell them apart (e.g. births and deaths read as their difference). Shown apart from a pass.
  recall:
    term: Recall
    group: Results
    text: The share of true flow parts the found model has (right kind and ends, whatever the number).
  precision:
    term: Precision
    group: Results
    text: The share of found flow parts, large enough to count, that are true. Low precision means invented flows.
  skill20:
    term: Skill@20
    group: Results
    text: How much of the true model's movement 20 steps ahead the found model predicts, from about 150 starting moments. 100% is as good as the truth; 0% is no better than assuming nothing changes.
  skill100:
    term: Skill@100
    group: Results
    text: The same as skill@20, but 100 steps ahead.
  fresh_run:
    term: Fresh run
    group: Results
    text: Another run of the same true model with a new random seed, which discovery never saw. Used to check that the found model generalises; without noise it is the same run.
  occam:
    term: Occam score
    group: Results
    text: Accuracy discounted by extra complexity - fit times (true complexity / found complexity, at most 1). A model twice as complicated as the truth keeps half its credit.
  complexity:
    term: Complexity
    group: Results
    text: Flows plus the numbers needed to write their rates over the run (every inflow piece, effect point, co-flow and hidden stock counts), counted the same way for the truth and the found model.
  achievable:
    term: Pass (achievable)
    group: Results
    text: The pass rate over only the runs whose data allow a pass at all, by the identifiability and best-achievable-accuracy analysis.

  # the variants
  noise_none:
    term: none (no noise)
    group: Variants
    text: The data are the simulator's exact flows. The equations should be recovered essentially exactly (within 2%).
  noise_counts:
    term: counts (counting noise)
    group: Variants
    text: Whole things move, so each step's flow is a random whole number around its rate (Poisson). The wiggles hide numbers but also carry information.
  short_long:
    term: short / long
    group: Variants
    text: How many steps the run has - short is 300 steps, long is 2000. Longer runs pin numbers down better.

  # the methods
  lna:
    term: LNA (linear noise approximation)
    group: Methods
    text: A way to write how counting noise spreads through a system - each flow's random draw leaves its source and arrives at its destination. It lets the wiggles, not just the averages, tell structures apart.
  bic:
    term: BIC
    group: Methods
    text: The Bayesian information criterion - a score of fit that charges a fixed price (about half the log of the number of steps) for every extra number, so an extra flow must earn its place.
  likelihood:
    term: Likelihood
    group: Methods
    text: How probable the observed data are if a given model were true. Fitting by likelihood means choosing the numbers that make the data most probable.
  kalman:
    term: Kalman filter
    group: Methods
    text: A step-by-step method that tracks a quantity you cannot see (like a hidden stock's level) from noisy measurements of things it affects, keeping a running best guess and its uncertainty.
  common_cause:
    term: Common cause
    group: Methods
    text: Something outside that drives several unrelated stocks at the same moments (one event raising two inflows). It makes the stocks move together, which a fit can mistake for a direct link between them.
  identifiable:
    term: Identifiable
    group: Methods
    text: A model part is identifiable when the data can, in principle, pin it down. If two different models produce the same data, the choice between them is not identifiable and no method can make it.
  cramer_rao:
    term: Cramér–Rao bound
    group: Methods
    text: The smallest uncertainty any unbiased method can achieve for a number from the given data. If a strategy misses by less than this, the data, not the strategy, are the limit.
