title: "A heater switched by a steep table of its own stock"
level: 10
tags: [distilled, effect, effect-table, inflow, nonlinear, control]
tests: "an inflow of 5 that shuts off between levels 18 and 22 of the stock it feeds (a steep table of its own level), drained at 0.1; from phys-thermostat (a heater switched by T; its memory is not expressible, so this is the switch without hysteresis), sd-sawmill's sharpening (6 x table(sharpness)) and 108's production: the inflow is recovered as a switch of T, not as a constant inflow and a faster drain or a linear controller; announced heat of 15 every 60 steps"
seed: 123
stocks: {T: 20}
flows:
  outside -> T: "5 * effect(T, table, [[0, 1], [18, 1], [22, 0], [100, 0]])"
  T -> outside: 0.1 * T
