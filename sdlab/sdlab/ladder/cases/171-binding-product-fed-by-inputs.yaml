title: "Binding A + B -> C: a product with its co-flow, both fed by measured inputs"
level: 21
tags: [distilled, product, effect, effect-linear, coflow, input]
tests: "distilled from part-reacting-particles (every leader fails it): A -> C at 0.000378 x A x B (a proportional rate times a linear effect of B) using up one B per C, A and B fed by measured inputs that step independently, A, B and C drained: recovered as the product with its co-flow and the two input inflows, not as linear moves between all three"
seed: 171
