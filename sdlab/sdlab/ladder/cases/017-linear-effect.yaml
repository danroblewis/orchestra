title: A linear effect
level: 12
tags: [effect, effect-linear]
tests: "a move whose rate is multiplied by a third stock's level (linear: C / 50, at most 2) is recovered with its effect"
seed: 17
stocks: {A: 0, B: 0, C: 50}
flows:
  outside -> A: 10
  A -> B: 0.3 * A * effect(C, linear, normal=50, max=2)
  B -> outside: 0.2 * B
  outside -> C: 3
  C -> outside: 0.1 * C
schedule:
  every: 200
  at 1 low: {outside -> C: 3}
  at 101 high: {outside -> C: 7}
