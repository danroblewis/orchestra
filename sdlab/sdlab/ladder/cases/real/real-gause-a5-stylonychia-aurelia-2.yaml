# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: Stylonychia with P. aurelia, culture 2 (Gause 1934, table A5)
level: 30
tags:
- real
- gauser
- mixture
tests: 'two species competing for one food (Lotka-Volterra competition): each one''s crowding by the other'
real:
  source: gauseR
  select:
    table: gause_1934_book_app_t05
    time: Time
    step: 1
    unit: day
    stocks:
      S:
        value: Individuals
        where:
          Experiment: 2
          Culture: '2'
          Species: Stylonychia pustulata
      Pa:
        value: Individuals
        where:
          Experiment: 2
          Culture: '2'
          Species: Paramecium aurelia
  points: 18
  train: 15
  time:
    unit: day
    first: 2.0
    last: 19.0
    train_last: 16.0
  sha256: d6166261a86dcbed
  measured_flows: []
  published:
    family: glv
    refit: least squares of the free run from the first sample on the first 15 samples (gauseR's generalised Lotka-Volterra, every r_i and a_ij)
  twin:
    rel:
      S: 0.40941
      Pa: 0.16158
    floor:
      S: 3.75
      Pa: 23.75
  cite: Gause (1934) The Struggle for Existence
  licence: GPL-3 (the package); the counts are Gause's published observations
  url: https://cran.r-project.org/src/contrib/gauseR_1.3.tar.gz
stocks:
  S: {initial: 16, unit: "individuals"}
  Pa: {initial: 15, unit: "individuals"}
flows:
  outside -> S as s_r:
    rate: 0.769318 * S
  S -> outside as s_s:
    rate: 0.00412091 * S * effect(S, linear, normal=1, max=8000)
  S -> outside as s_pa:
    rate: 0.00361151 * S * effect(Pa, linear, normal=1, max=50000)
  outside -> Pa as pa_r:
    rate: 0.937131 * Pa
  outside -> Pa as pa_s:
    rate: 0.00426237 * Pa * effect(S, linear, normal=1, max=8000)
  Pa -> outside as pa_pa:
    rate: 0.00316015 * Pa * effect(Pa, linear, normal=1, max=50000)
