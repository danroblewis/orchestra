# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: P. aurelia alone, one loop medium (Gause 1934, table A4)
level: 30
tags:
- real
- gauser
- mono
tests: 'one species growing alone (logistic): its growth and its crowding read from its level'
real:
  source: gauseR
  select:
    table: gause_1934_book_app_t04
    time: Time
    step: 1
    unit: day
    stocks:
      Pa:
        value: Individuals
        where:
          Species: Paramecium aurelia
          Treatment: one loop
  points: 17
  train: 13
  time:
    unit: day
    first: 0.0
    last: 16.0
    train_last: 12.0
  sha256: 630982756e98db79
  measured_flows: []
  published:
    family: glv
    refit: least squares of the free run from the first sample on the first 13 samples (gauseR's generalised Lotka-Volterra, every r_i and a_ij)
  twin:
    rel:
      Pa: 0.14113
    floor:
      Pa: 22.7
  cite: Gause (1934) The Struggle for Existence
  licence: GPL-3 (the package); the counts are Gause's published observations
  url: https://cran.r-project.org/src/contrib/gauseR_1.3.tar.gz
stocks:
  Pa: {initial: 2, unit: "individuals"}
flows:
  outside -> Pa as pa_r:
    rate: 1.11412 * Pa
  Pa -> outside as pa_pa:
    rate: 0.00292554 * Pa * effect(Pa, linear, normal=1, max=50000)
