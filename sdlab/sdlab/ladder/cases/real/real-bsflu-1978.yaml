# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: Influenza in a boarding school, 1978
level: 30
tags:
- real
- pomp
- epidemic
tests: 'an epidemic seen only through two later stages (in bed, convalescent): the susceptible and infected boys are hidden'
real:
  source: pomp
  select: {}
  points: 14
  train: 10
  time:
    unit: day
    first: 1
    last: 14
    train_last: 10
  sha256: 4fa1a0f49d776aeb
  measured_flows: []
  published:
    family: sir_bc
    refit: least squares of the free run on the first 10 days (N = 763 boys; S and I start from the fitted I0)
  twin:
    rel:
      B: 0.17882
      C: 0.68677
    floor:
      B: 14.65
      C: 8.65
  cite: King et al., pomp (CRAN), dataset bsflu; Anonymous (1978) Influenza in a boarding school, BMJ 1:587
  licence: GPL (the package); the counts are from Anonymous (1978), BMJ 1(6112):587
  url: https://cran.r-project.org/src/contrib/pomp_6.4.tar.gz
stocks:
  S: {initial: 755.467, unit: "boys", hidden: true}
  I: {initial: 6.53262, unit: "boys", hidden: true}
  B: {initial: 1, unit: "boys"}
  C: {initial: 0, unit: "boys"}
flows:
  S -> I as si:
    rate: 4.36095 * S * effect(I, linear, normal=763, max=1)
  I -> B as ib:
    rate: 0.237097 * I
  B -> C as bc:
    rate: 0.363745 * B
  C -> outside as c_out:
    rate: 0.51379 * C
