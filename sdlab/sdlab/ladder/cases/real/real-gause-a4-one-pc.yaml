# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: P. caudatum alone, one loop medium (Gause 1934, table A4)
level: 30
tags:
- real
- gauser
- mono
tests: 'one species growing alone (logistic): its growth and its crowding read from its level'
real:
  source: gauseR
  select:
    table: gause_1934_book_app_t04
    time: Time
    step: 1
    unit: day
    stocks:
      Pc:
        value: Individuals
        where:
          Species: Paramecium caudatum
          Treatment: one loop
  points: 17
  train: 14
  time:
    unit: day
    first: 0.0
    last: 16.0
    train_last: 13.0
  sha256: 92bcf96ea3b51bd3
  measured_flows: []
  published:
    family: glv
    refit: least squares of the free run from the first sample on the first 14 samples (gauseR's generalised Lotka-Volterra, every r_i and a_ij)
  twin:
    rel:
      Pc: 0.15862
    floor:
      Pc: 8.1
  cite: Gause (1934) The Struggle for Existence
  licence: GPL-3 (the package); the counts are Gause's published observations
  url: https://cran.r-project.org/src/contrib/gauseR_1.3.tar.gz
stocks:
  Pc: {initial: 2, unit: "individuals"}
flows:
  outside -> Pc as pc_r:
    rate: 1.01827 * Pc
  Pc -> outside as pc_pc:
    rate: 0.00746588 * Pc * effect(Pc, linear, normal=1, max=20000)
