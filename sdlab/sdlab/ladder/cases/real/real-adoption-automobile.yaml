# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: 'US households with: Automobile'
level: 30
tags:
- real
- owid
- adoption
tests: 'technology diffusion (Bass): adoption from innovation and from imitation of those who already have it'
real:
  source: owid
  select:
    entity: Automobile
  points: 91
  train: 68
  time:
    unit: year
    first: 1915
    last: 2005
    train_last: 1982
  sha256: 4a3452d81799396c
  measured_flows: []
  published:
    family: bass
    refit: least squares of the free run on the first 68 years (p, q and the market potential m, at most 100%)
  twin:
    rel:
      A: 0.02092
    floor:
      A: 4.3
    complement:
      N:
        of: A
        total: 100
  cite: Our World in Data, Technology adoption by households in the United States (Comin and Hobijn 2004, and others)
  licence: CC BY 4.0 (Our World in Data)
  url: https://ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states.csv
stocks:
  N: {initial: 90, unit: "% of households"}
  A: {initial: 10, unit: "% of households"}
flows:
  N -> A as innovation:
    rate: max(0, -0.537881 + 0.0393621 * N)
  N -> A as imitation:
    rate: max(0, -0.0000000000000000000000708704 + 0.00000000000000000000000518629 * N) * effect(A, linear, normal=1, max=101)
