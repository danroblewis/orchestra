# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: 'US households with: Social media usage'
level: 30
tags:
- real
- owid
- adoption
tests: 'technology diffusion (Bass): adoption from innovation and from imitation of those who already have it'
real:
  source: owid
  select:
    entity: Social media usage
  points: 15
  train: 11
  time:
    unit: year
    first: 2005
    last: 2019
    train_last: 2015
  sha256: 6d166e4871575763
  measured_flows: []
  published:
    family: bass
    refit: least squares of the free run on the first 11 years (p, q and the market potential m, at most 100%)
  twin:
    rel:
      A: 0.07507
    floor:
      A: 3.25
    complement:
      N:
        of: A
        total: 100
  cite: Our World in Data, Technology adoption by households in the United States (Comin and Hobijn 2004, and others)
  licence: CC BY 4.0 (Our World in Data)
  url: https://ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states.csv
stocks:
  N: {initial: 95, unit: "% of households"}
  A: {initial: 5, unit: "% of households"}
flows:
  N -> A as innovation:
    rate: max(0, -1.1827 + 0.0337915 * N)
  N -> A as imitation:
    rate: max(0, -0.303119 + 0.00866055 * N) * effect(A, linear, normal=1, max=101)
