# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: 'US households with: Internet'
level: 30
tags:
- real
- owid
- adoption
tests: 'technology diffusion (Bass): adoption from innovation and from imitation of those who already have it'
real:
  source: owid
  select:
    entity: Internet
  points: 24
  train: 21
  time:
    unit: year
    first: 1993
    last: 2016
    train_last: 2013
  sha256: 55510b48e667cc8b
  measured_flows: []
  published:
    family: bass
    refit: least squares of the free run on the first 21 years (p, q and the market potential m, at most 100%)
  twin:
    rel:
      A: 0.0251
    floor:
      A: 4.1
    complement:
      N:
        of: A
        total: 100
  cite: Our World in Data, Technology adoption by households in the United States (Comin and Hobijn 2004, and others)
  licence: CC BY 4.0 (Our World in Data)
  url: https://ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states.csv
stocks:
  N: {initial: 90, unit: "% of households"}
  A: {initial: 10, unit: "% of households"}
flows:
  N -> A as innovation:
    rate: max(0, -0.276383 + 0.0159084 * N)
  N -> A as imitation:
    rate: max(0, -0.0432495 + 0.00248941 * N) * effect(A, linear, normal=1, max=101)
