# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: 'US households with: Home air conditioning'
level: 30
tags:
- real
- owid
- adoption
tests: 'technology diffusion (Bass): adoption from innovation and from imitation of those who already have it'
real:
  source: owid
  select:
    entity: Home air conditioning
  points: 55
  train: 41
  time:
    unit: year
    first: 1957
    last: 2011
    train_last: 1997
  sha256: af29a767b2007c55
  measured_flows: []
  published:
    family: bass
    refit: least squares of the free run on the first 41 years (p, q and the market potential m, at most 100%)
  twin:
    rel:
      A: 0.02077
    floor:
      A: 3.65
    complement:
      N:
        of: A
        total: 100
  cite: Our World in Data, Technology adoption by households in the United States (Comin and Hobijn 2004, and others)
  licence: CC BY 4.0 (Our World in Data)
  url: https://ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states.csv
stocks:
  N: {initial: 90, unit: "% of households"}
  A: {initial: 10, unit: "% of households"}
flows:
  N -> A as innovation:
    rate: max(0, -0.00027 + 0.00001 * N)
  N -> A as imitation:
    rate: max(0, -0.0508691 + 0.00188404 * N) * effect(A, linear, normal=1, max=101)
