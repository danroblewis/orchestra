# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: 'US households with: Nox pollution controls (boilers)'
level: 30
tags:
- real
- owid
- adoption
tests: 'technology diffusion (Bass): adoption from innovation and from imitation of those who already have it'
real:
  source: owid
  select:
    entity: Nox pollution controls (boilers)
  points: 16
  train: 13
  time:
    unit: year
    first: 1990
    last: 2005
    train_last: 2002
  sha256: bf49824a0ebc40d4
  measured_flows: []
  published:
    family: bass
    refit: least squares of the free run on the first 13 years (p, q and the market potential m, at most 100%)
  twin:
    rel:
      A: 0.04343
    floor:
      A: 3.85
    complement:
      N:
        of: A
        total: 100
  cite: Our World in Data, Technology adoption by households in the United States (Comin and Hobijn 2004, and others)
  licence: CC BY 4.0 (Our World in Data)
  url: https://ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states.csv
stocks:
  N: {initial: 84, unit: "% of households"}
  A: {initial: 16, unit: "% of households"}
flows:
  N -> A as innovation:
    rate: 0.0206233 * N
  N -> A as imitation:
    rate: 0.00177328 * N * effect(A, linear, normal=1, max=101)
