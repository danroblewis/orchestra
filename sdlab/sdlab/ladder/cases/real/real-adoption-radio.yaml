# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: 'US households with: Radio'
level: 30
tags:
- real
- owid
- adoption
tests: 'technology diffusion (Bass): adoption from innovation and from imitation of those who already have it'
real:
  source: owid
  select:
    entity: Radio
  points: 81
  train: 61
  time:
    unit: year
    first: 1925
    last: 2005
    train_last: 1985
  sha256: ae7607e57ffd833d
  measured_flows: []
  published:
    family: bass
    refit: least squares of the free run on the first 61 years (p, q and the market potential m, at most 100%)
  twin:
    rel:
      A: 0.02626
    floor:
      A: 4.95
    complement:
      N:
        of: A
        total: 100
  cite: Our World in Data, Technology adoption by households in the United States (Comin and Hobijn 2004, and others)
  licence: CC BY 4.0 (Our World in Data)
  url: https://ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states.csv
stocks:
  N: {initial: 90, unit: "% of households"}
  A: {initial: 10, unit: "% of households"}
flows:
  N -> A as innovation:
    rate: max(0, -0.0931281 + 0.0931281 * N)
  N -> A as imitation:
    rate: max(0, -0.000127458 + 0.000127458 * N) * effect(A, linear, normal=1, max=101)
