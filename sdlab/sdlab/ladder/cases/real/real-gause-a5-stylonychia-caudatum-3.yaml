# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: Stylonychia with P. caudatum, culture 3 (Gause 1934, table A5)
level: 30
tags:
- real
- gauser
- mixture
tests: 'two species competing for one food (Lotka-Volterra competition): each one''s crowding by the other'
real:
  source: gauseR
  select:
    table: gause_1934_book_app_t05
    time: Time
    step: 1
    unit: day
    stocks:
      S:
        value: Individuals
        where:
          Experiment: 3
          Culture: '3'
          Species: Stylonychia pustulata
      Pc:
        value: Individuals
        where:
          Experiment: 3
          Culture: '3'
          Species: Paramecium caudatum
  points: 18
  train: 15
  time:
    unit: day
    first: 2.0
    last: 19.0
    train_last: 16.0
  sha256: f02b1d654fd8d4cf
  measured_flows: []
  published:
    family: glv
    refit: least squares of the free run from the first sample on the first 15 samples (gauseR's generalised Lotka-Volterra, every r_i and a_ij)
  twin:
    rel:
      S: 0.3134
      Pc: 0.15464
    floor:
      S: 4.7
      Pc: 8.0
  cite: Gause (1934) The Struggle for Existence
  licence: GPL-3 (the package); the counts are Gause's published observations
  url: https://cran.r-project.org/src/contrib/gauseR_1.3.tar.gz
stocks:
  S: {initial: 14, unit: "individuals"}
  Pc: {initial: 4, unit: "individuals"}
flows:
  outside -> S as s_r:
    rate: 0.849879 * S
  S -> outside as s_s:
    rate: 0.0000000000707103 * S * effect(S, linear, normal=1, max=10000)
  S -> outside as s_pc:
    rate: 0.0231878 * S * effect(Pc, linear, normal=1, max=20000)
  outside -> Pc as pc_r:
    rate: 0.952195 * Pc
  outside -> Pc as pc_s:
    rate: 0.00209422 * Pc * effect(S, linear, normal=1, max=10000)
  Pc -> outside as pc_pc:
    rate: 0.00852702 * Pc * effect(Pc, linear, normal=1, max=20000)
