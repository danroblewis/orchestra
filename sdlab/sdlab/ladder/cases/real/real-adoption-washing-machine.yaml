# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: 'US households with: Washing machine'
level: 30
tags:
- real
- owid
- adoption
tests: 'technology diffusion (Bass): adoption from innovation and from imitation of those who already have it'
real:
  source: owid
  select:
    entity: Washing machine
  points: 79
  train: 59
  time:
    unit: year
    first: 1930
    last: 2008
    train_last: 1988
  sha256: 6158bbf9e43ade1a
  measured_flows: []
  published:
    family: bass
    refit: least squares of the free run on the first 59 years (p, q and the market potential m, at most 100%)
  twin:
    rel:
      A: 0.01763
    floor:
      A: 3.7
    complement:
      N:
        of: A
        total: 100
  cite: Our World in Data, Technology adoption by households in the United States (Comin and Hobijn 2004, and others)
  licence: CC BY 4.0 (Our World in Data)
  url: https://ourworldindata.org/grapher/technology-adoption-by-households-in-the-united-states.csv
stocks:
  N: {initial: 90, unit: "% of households"}
  A: {initial: 10, unit: "% of households"}
flows:
  N -> A as innovation:
    rate: max(0, -0.0000300427 + 0.00001 * N)
  N -> A as imitation:
    rate: max(0, -0.00194634 + 0.000647857 * N) * effect(A, linear, normal=1, max=101)
