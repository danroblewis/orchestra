# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: P. aurelia and P. caudatum together, half loop medium (Gause 1934, table A4)
level: 30
tags:
- real
- gauser
- mixture
tests: 'two species competing for one food (Lotka-Volterra competition): each one''s crowding by the other'
real:
  source: gauseR
  select:
    table: gause_1934_book_app_t04
    time: Time
    step: 1
    unit: day
    stocks:
      Pa:
        value: Individuals_Mixture
        where:
          Species: Paramecium aurelia
          Treatment: half loop
      Pc:
        value: Individuals_Mixture
        where:
          Species: Paramecium caudatum
          Treatment: half loop
  points: 9
  train: 7
  time:
    unit: day
    first: 8.0
    last: 16.0
    train_last: 14.0
  sha256: f08945f673ec0dea
  measured_flows: []
  published:
    family: glv
    refit: least squares of the free run from the first sample on the first 7 samples (gauseR's generalised Lotka-Volterra, every r_i and a_ij)
  twin:
    rel:
      Pa: 0.10134
      Pc: 0.18557
    floor:
      Pa: 14.25
      Pc: 1.05
  cite: Gause (1934) The Struggle for Existence
  licence: GPL-3 (the package); the counts are Gause's published observations
  url: https://cran.r-project.org/src/contrib/gauseR_1.3.tar.gz
stocks:
  Pa: {initial: 162, unit: "individuals"}
  Pc: {initial: 21, unit: "individuals"}
flows:
  outside -> Pa as pa_r:
    rate: 1.01188 * Pa
  Pa -> outside as pa_pa:
    rate: 0.00297726 * Pa * effect(Pa, linear, normal=1, max=30000)
  Pa -> outside as pa_pc:
    rate: 0.0232846 * Pa * effect(Pc, linear, normal=1, max=3000)
  outside -> Pc as pc_r:
    rate: 0.711416 * Pc
  Pc -> outside as pc_pa:
    rate: 0.000161519 * Pc * effect(Pa, linear, normal=1, max=30000)
  Pc -> outside as pc_pc:
    rate: 0.074399 * Pc * effect(Pc, linear, normal=1, max=3000)
