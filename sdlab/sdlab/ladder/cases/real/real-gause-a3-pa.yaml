# A real-data case (sdlab/ladder/real): written by `python -m sdlab.ladder.real build`; do not edit by hand.
title: P. aurelia alone, mean of three (Gause 1934, table A3)
level: 30
tags:
- real
- gauser
- mono
tests: 'one species growing alone (logistic): its growth and its crowding read from its level'
real:
  source: gauseR
  select:
    table: gause_1934_book_app_t03
    time: Time
    step: 1
    unit: day
    stocks:
      Pa:
        value: Individuals
        where:
          Species: Paramecium aurelia
          Treatment: Monoculture
  points: 24
  train: 18
  time:
    unit: day
    first: 2.0
    last: 25.0
    train_last: 19.0
  sha256: fe079185e00ac3de
  measured_flows: []
  published:
    family: glv
    refit: least squares of the free run from the first sample on the first 18 samples (gauseR's generalised Lotka-Volterra, every r_i and a_ij)
  twin:
    rel:
      Pa: 0.07143
    floor:
      Pa: 30.5
  cite: Gause (1934) The Struggle for Existence
  licence: GPL-3 (the package); the counts are Gause's published observations
  url: https://cran.r-project.org/src/contrib/gauseR_1.3.tar.gz
stocks:
  Pa: {initial: 14, unit: "individuals"}
flows:
  outside -> Pa as pa_r:
    rate: 0.842473 * Pa
  Pa -> outside as pa_pa:
    rate: 0.00151828 * Pa * effect(Pa, linear, normal=1, max=70000)
