title: Stylonychia with P. caudatum, culture 2 (Gause 1934, table A5)
level: 30
tags:
- real
- gauser
- mixture
tests: 'two species competing for one food (Lotka-Volterra competition): each one''s crowding by the other'
real:
  source: gauseR
  select:
    table: gause_1934_book_app_t05
    time: Time
    step: 1
    unit: day
    stocks:
      S:
        value: Individuals
        where:
          Experiment: 3
          Culture: '2'
          Species: Stylonychia pustulata
      Pc:
        value: Individuals
        where:
          Experiment: 3
          Culture: '2'
          Species: Paramecium caudatum
  points: 18
  train: 14
  time:
    unit: day
    first: 2.0
    last: 19.0
    train_last: 15.0
  sha256: 5667f5d80dca42ac
  measured_flows: []
  published:
    family: glv
    refit: least squares of the free run from the first sample on the first 14 samples (gauseR's generalised Lotka-Volterra, every r_i and a_ij)
  twin:
    rel:
      S: 0.21068
      Pc: 0.125
    floor:
      S: 3.3
      Pc: 6.6
  cite: Gause (1934) The Struggle for Existence
  licence: GPL-3 (the package); the counts are Gause's published observations
  url: https://cran.r-project.org/src/contrib/gauseR_1.3.tar.gz
stocks:
  S: {initial: 11, unit: "individuals"}
  Pc: {initial: 7, unit: "individuals"}
flows:
  outside -> S as s_r:
    rate: 0.960698 * S
  S -> outside as s_s:
    rate: 0.000194943 * S * effect(S, linear, normal=1, max=7000)
  S -> outside as s_pc:
    rate: 0.0222462 * S * effect(Pc, linear, normal=1, max=20000)
  outside -> Pc as pc_r:
    rate: 0.969189 * Pc
  outside -> Pc as pc_s:
    rate: 0.00129218 * Pc * effect(S, linear, normal=1, max=7000)
  Pc -> outside as pc_pc:
    rate: 0.00939604 * Pc * effect(Pc, linear, normal=1, max=20000)
