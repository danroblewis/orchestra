title: "Harmonic oscillator (SDXorg sample)"
level: 13
tags: [canonical, signed, two-way, coupled, dt]
tests: "a spring (position' = speed, speed' = -0.05 x position, Euler at dt 1/100) is recovered as two two-way flows of signed stocks: position fills (and empties) at its speed, and speed at -0.05 x position; both swing through 0 with a period of about 28 steps, so neither stock nor rate keeps a sign; without counting noise (whole things moved at random would pump energy into an undamped spring)"
source: "SDXorg/test-models samples/simple_harmonic_oscillator/simple_harmonic_oscillator.mdl (MIT licence, Copyright 2015 The test-models Authors; models/LICENSE-sdxorg-test-models), imported unchanged through PySD"
seed: 113
variants: {noise: [none], lengths: {short: 300, long: 2000}}
dt: 0.01
stocks:
  position: 50 signed
  speed: 0 signed
flows:
  outside <-> position as position_term_1: "speed"
  outside <-> speed as elastic_acceleration: "-0.05 * position"
boundary:
  position: {in: estimate}
  speed: {in: estimate}
