# axis: relative measurement error (sd / level)
# axis values: 0, 0.01, 0.02, 0.05, 0.1, 0.15, 0.2
title: "Sweep: a chain of two, measurement error 0 to 20%"
level: 2
tags: [sweep, chain, move, noisy]
tests: "003's chain with each level measured with a relative Gaussian error from 0 to 20% (on top of counting noise; no absolute part, so 0 is the counts run): where does each method break, and where does the data first stop allowing the rates?"
seed: 3
stocks: {A: 0, B: 0}
flows:
  outside -> A: 20
  A -> B: 0.5 * A
  B -> outside: 0.2 * B
variants:
  noise: [counts, {meas: {rel: grid(0, 0.01, 0.02, 0.05, 0.1, 0.15, 0.2), abs: 0}}]
boundary:
  A: {in: estimate}
  B: {out: estimate}
