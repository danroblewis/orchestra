title: "A reinforcing link loop, real-world noise"
level: 6
tags: [loop, link, move, noisy]
tests: "008 (a feedback loop closed by a link) under measurement error, gaps, weekly reports, a reporting delay, outliers and a biased count"
seed: 8
stocks: {A: 0, B: 0}
flows:
  outside -> A: 10
  A -> B: 0.5 * A
  B -> outside: 0.2 * B
  outside -> A as births: 0.05 * B
variants:
  noise: [counts, meas, gaps, weekly, lag, outliers, bias]
boundary:
  A: {in: [estimate, estimate]}
  B: {out: estimate}
