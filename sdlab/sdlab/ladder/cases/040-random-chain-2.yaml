title: Chain of two, random numbers
level: 2
tags: [chain, move, parametric]
tests: 003 with its inflow, move and exit drawn at random (8 draws); each draw's three numbers are recovered
seed: 40
draws: 8
stocks: {A: 0, B: 0}
flows:
