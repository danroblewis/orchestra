title: "An oscillator in offset stocks, measured with error"
level: 12
tags: [distilled, oscillation, link, noisy]
tests: "measurement error on a lightly damped oscillator written as two offset stocks (P = position + 10000, V = velocity + 1000, in thousandths (units mm and mm per step: nothing moves between them) so that the levels' rounding to whole numbers is negligible; P gains V and loses 1000 a step, V gains 150 and loses 0.01 P + 0.05 V), kicked by announced injections into V; from phys-mass-spring-damper meas: V's error is about half its swing and seven times its change in a step, and every leader loses V <- P (a one-step fit's errors in variables shrink it); the flows are exact (nothing moves in whole things), so only the measurement is noisy"
seed: 141
stocks: {P: {initial: 10000, unit: mm}, V: {initial: 1000, unit: mm_per_step}}
flows:
  outside -> P:
    rate: 1 * V
    exact: true
  P -> outside:
    rate: 1000
    exact: true
  outside -> V as v_in:
    rate: 150
    exact: true
  V -> outside:
    rate: 0.01 * P + 0.05 * V
    exact: true
injections:
  - {t: 30, stock: V, amount: 200}
  - {t: 100, stock: V, amount: 350}
