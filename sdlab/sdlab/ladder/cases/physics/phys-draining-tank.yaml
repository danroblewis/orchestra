# A tank fed by a measured pump, draining through a hole at k sqrt(H) (Torricelli). Not a
# stock-and-flow model: the outflow is a square root of the level, which SD Lab's forms cannot write.
system: draining-tank
title: Draining tank (outflow k sqrt(H))
level: 20
tags: [physics, sqrt, input]
tests: "a sqrt outflow and a measured pump: the coupling H <- H is negative and concave (sqrt), the pump enters linearly; the best SD model drains in proportion to H"
seed: 1
meas: {rel: 0.02, abs: 0.05}
