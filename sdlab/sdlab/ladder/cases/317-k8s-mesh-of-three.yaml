# Kubernetes ladder (tag kubernetes, docs/research/kubernetes-ladder.md): a 5-minute step, Prometheus-style
# stock names, `query` the PromQL each measured stock stands for. Rungs 14-17 grow the topology on rung 4's service
# (queue -> inflight -> responses_total, daily traffic); rung 18 is the mesh with every feature of rungs 1-13.
title: "Kubernetes 18: a mesh of three services with every feature"
level: 18
tags: [kubernetes, input, chain, move, final, periodic, link, min, capacity, split, loop, nonlinear, max, delay, effect, effect-table, hidden, injection]
tests: "every feature of rungs 1-17 at once: frontend (fed by the traffic) calls catalog and cart, and cart calls catalog (a mesh); each service has rung 13's queue, retries, errors, capacity MIN, CPU, HPA on desired, pending pods, a memory leak (hidden) with OOM kills; the three share a node pool (pods start in the room left, shared by their pending counts) with the cluster autoscaler (hidden provisioning stage) and a Postgres pool fed by catalog and cart; announced node failures on Monday, Wednesday and Friday at 10:50; 36 measured stocks and 4 hidden; recovered flow by flow, or at least its behaviour (skill@20)"
seed: 317
inputs:
  traffic: 400 + sin(220, 288, 96) - pulse_train(120, 1440, 576, 2016)
stocks:
  frontend_queue: {initial: 50, unit: requests, query: "sum(envoy_cluster_upstream_rq_pending_active{cluster=\"frontend\"})"}
  frontend_inflight: {initial: 100, unit: requests, query: "sum(increase(http_server_requests_total{service=\"frontend\"}[5m]))"}
  frontend_responses_total: {initial: 0, unit: requests, final: true, query: "sum(http_server_requests_total{service=\"frontend\",code!~\"5..\"}) (a counter)"}
  frontend_errors_total: {initial: 0, unit: requests, final: true, query: "sum(http_server_requests_total{service=\"frontend\",code=~\"5..\"}) (a counter)"}
  frontend_retries: {initial: 0, unit: requests, query: "sum(increase(envoy_cluster_upstream_rq_retry{cluster=\"frontend\"}[5m]))"}
  frontend_ready: {initial: 9, unit: pods, query: "kube_deployment_status_replicas_ready{deployment=\"frontend\"}"}
  frontend_cpu: {initial: 800, unit: millicores, query: "1000 * sum(rate(container_cpu_usage_seconds_total{container=\"frontend\"}[10m]))"}
  frontend_desired: {initial: 9, unit: pods, query: "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"frontend\"}"}
  frontend_pending: {initial: 0, unit: pods, query: "sum(kube_pod_status_phase{phase=\"Pending\",pod=~\"frontend-.*\"})"}
  frontend_mem: {initial: 250, unit: MiB, query: "avg(container_memory_working_set_bytes{container=\"frontend\"}) / 2^20"}
  frontend_leak: {initial: 0, unit: MiB, hidden: true}
  frontend_oom_kills_total: {initial: 0, unit: pods, final: true, query: "sum(kube_pod_container_status_restarts_total{container=\"frontend\"}) for OOMKilled (a counter)"}
  catalog_queue: {initial: 50, unit: requests, query: "sum(envoy_cluster_upstream_rq_pending_active{cluster=\"catalog\"})"}
  catalog_inflight: {initial: 100, unit: requests, query: "sum(increase(http_server_requests_total{service=\"catalog\"}[5m]))"}
  catalog_responses_total: {initial: 0, unit: requests, final: true, query: "sum(http_server_requests_total{service=\"catalog\",code!~\"5..\"}) (a counter)"}
  catalog_errors_total: {initial: 0, unit: requests, final: true, query: "sum(http_server_requests_total{service=\"catalog\",code=~\"5..\"}) (a counter)"}
  catalog_retries: {initial: 0, unit: requests, query: "sum(increase(envoy_cluster_upstream_rq_retry{cluster=\"catalog\"}[5m]))"}
  catalog_ready: {initial: 6, unit: pods, query: "kube_deployment_status_replicas_ready{deployment=\"catalog\"}"}
  catalog_cpu: {initial: 800, unit: millicores, query: "1000 * sum(rate(container_cpu_usage_seconds_total{container=\"catalog\"}[10m]))"}
  catalog_desired: {initial: 6, unit: pods, query: "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"catalog\"}"}
  catalog_pending: {initial: 0, unit: pods, query: "sum(kube_pod_status_phase{phase=\"Pending\",pod=~\"catalog-.*\"})"}
  catalog_mem: {initial: 250, unit: MiB, query: "avg(container_memory_working_set_bytes{container=\"catalog\"}) / 2^20"}
  catalog_leak: {initial: 0, unit: MiB, hidden: true}
  catalog_oom_kills_total: {initial: 0, unit: pods, final: true, query: "sum(kube_pod_container_status_restarts_total{container=\"catalog\"}) for OOMKilled (a counter)"}
  cart_queue: {initial: 50, unit: requests, query: "sum(envoy_cluster_upstream_rq_pending_active{cluster=\"cart\"})"}
  cart_inflight: {initial: 100, unit: requests, query: "sum(increase(http_server_requests_total{service=\"cart\"}[5m]))"}
  cart_responses_total: {initial: 0, unit: requests, final: true, query: "sum(http_server_requests_total{service=\"cart\",code!~\"5..\"}) (a counter)"}
  cart_errors_total: {initial: 0, unit: requests, final: true, query: "sum(http_server_requests_total{service=\"cart\",code=~\"5..\"}) (a counter)"}
  cart_retries: {initial: 0, unit: requests, query: "sum(increase(envoy_cluster_upstream_rq_retry{cluster=\"cart\"}[5m]))"}
  cart_ready: {initial: 3, unit: pods, query: "kube_deployment_status_replicas_ready{deployment=\"cart\"}"}
  cart_cpu: {initial: 800, unit: millicores, query: "1000 * sum(rate(container_cpu_usage_seconds_total{container=\"cart\"}[10m]))"}
  cart_desired: {initial: 3, unit: pods, query: "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"cart\"}"}
  cart_pending: {initial: 0, unit: pods, query: "sum(kube_pod_status_phase{phase=\"Pending\",pod=~\"cart-.*\"})"}
  cart_mem: {initial: 250, unit: MiB, query: "avg(container_memory_working_set_bytes{container=\"cart\"}) / 2^20"}
  cart_leak: {initial: 0, unit: MiB, hidden: true}
  cart_oom_kills_total: {initial: 0, unit: pods, final: true, query: "sum(kube_pod_container_status_restarts_total{container=\"cart\"}) for OOMKilled (a counter)"}
  nodes: {initial: 5, unit: nodes, query: "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}
  db_waiting: {initial: 10, unit: queries, query: "sum(pgbouncer_pools_client_waiting_connections{database=\"shop\"})"}
  db_active: {initial: 60, unit: connections, query: "sum(pg_stat_activity_count{datname=\"shop\",state=\"active\"})"}
flows:
  outside -> frontend_queue as requests: 1 * traffic
  frontend_queue -> frontend_inflight as frontend_dispatched: "min(0.6 * frontend_queue, 40 * frontend_ready)"
  frontend_queue -> frontend_retries as frontend_timeouts: 0.08 * frontend_queue
  frontend_retries -> frontend_queue as frontend_retried: 0.6 * frontend_retries
  frontend_retries -> outside as frontend_gave_up: 0.4 * frontend_retries
  frontend_inflight -> frontend_responses_total as frontend_completed: 0.5 * frontend_inflight
  frontend_inflight -> frontend_errors_total as frontend_errors: 0.03 * frontend_inflight
  outside -> frontend_cpu as frontend_used: 1.25 * frontend_inflight + 20 * frontend_ready
  frontend_cpu -> outside as frontend_window: 0.5 * frontend_cpu
  outside -> frontend_desired as frontend_hpa_up: {rate: "max(0, min(16, ceil(frontend_cpu / 192.5)) - frontend_desired)", exact: true}
  frontend_desired -> outside as frontend_hpa_down: {rate: "1 * (frontend_desired > max(3, ceil(frontend_cpu / 157.5)))", exact: true}
  outside -> frontend_pending as frontend_created: {rate: "max(0, frontend_desired - frontend_pending - frontend_ready)", exact: true}
  frontend_pending -> frontend_ready as frontend_started: "min(0.5 * frontend_pending, max(0, 4 * nodes - (frontend_ready + catalog_ready + cart_ready)) * frontend_pending / max(1, (frontend_pending + catalog_pending + cart_pending)))"
  frontend_ready -> outside as frontend_deleted: {rate: "max(0, frontend_ready - frontend_desired)", exact: true}
  outside -> frontend_mem as frontend_allocated: "0.5 * (150 + frontend_leak + 2 * frontend_inflight / max(1, frontend_ready))"
  frontend_mem -> outside as frontend_freed: 0.5 * frontend_mem
  outside -> frontend_leak as frontend_leaking: 1
  frontend_ready -> frontend_pending as frontend_oom_killed:
    rate: 1 * frontend_ready * effect(frontend_mem, table, [[0, 0], [480, 0], [512, 0.3], [560, 0.8], [5000, 1]])
  outside -> frontend_oom_kills_total as frontend_oom_counted: {rate: "flow(frontend_oom_killed)", exact: true}
  frontend_leak -> outside as frontend_oom_reset:
    rate: 1 * frontend_leak * effect(frontend_mem, table, [[0, 0], [480, 0], [512, 0.3], [560, 0.8], [5000, 1]])
  outside -> catalog_queue as catalog_calls: 0.3 * frontend_inflight
  outside -> catalog_queue as catalog_calls_from_cart: 0.2 * cart_inflight
  catalog_queue -> catalog_inflight as catalog_dispatched: "min(0.6 * catalog_queue, 40 * catalog_ready)"
  catalog_queue -> catalog_retries as catalog_timeouts: 0.08 * catalog_queue
  catalog_retries -> catalog_queue as catalog_retried: 0.6 * catalog_retries
  catalog_retries -> outside as catalog_gave_up: 0.4 * catalog_retries
  catalog_inflight -> catalog_responses_total as catalog_completed: 0.5 * catalog_inflight
  catalog_inflight -> catalog_errors_total as catalog_errors: 0.03 * catalog_inflight
  outside -> catalog_cpu as catalog_used: 1.25 * catalog_inflight + 20 * catalog_ready
  catalog_cpu -> outside as catalog_window: 0.5 * catalog_cpu
  outside -> catalog_desired as catalog_hpa_up: {rate: "max(0, min(12, ceil(catalog_cpu / 192.5)) - catalog_desired)", exact: true}
  catalog_desired -> outside as catalog_hpa_down: {rate: "1 * (catalog_desired > max(2, ceil(catalog_cpu / 157.5)))", exact: true}
  outside -> catalog_pending as catalog_created: {rate: "max(0, catalog_desired - catalog_pending - catalog_ready)", exact: true}
  catalog_pending -> catalog_ready as catalog_started: "min(0.5 * catalog_pending, max(0, 4 * nodes - (frontend_ready + catalog_ready + cart_ready)) * catalog_pending / max(1, (frontend_pending + catalog_pending + cart_pending)))"
  catalog_ready -> outside as catalog_deleted: {rate: "max(0, catalog_ready - catalog_desired)", exact: true}
  outside -> catalog_mem as catalog_allocated: "0.5 * (150 + catalog_leak + 2 * catalog_inflight / max(1, catalog_ready))"
  catalog_mem -> outside as catalog_freed: 0.5 * catalog_mem
  outside -> catalog_leak as catalog_leaking: 1.2
  catalog_ready -> catalog_pending as catalog_oom_killed:
    rate: 1 * catalog_ready * effect(catalog_mem, table, [[0, 0], [480, 0], [512, 0.3], [560, 0.8], [5000, 1]])
  outside -> catalog_oom_kills_total as catalog_oom_counted: {rate: "flow(catalog_oom_killed)", exact: true}
  catalog_leak -> outside as catalog_oom_reset:
    rate: 1 * catalog_leak * effect(catalog_mem, table, [[0, 0], [480, 0], [512, 0.3], [560, 0.8], [5000, 1]])
  outside -> cart_queue as cart_calls: 0.15 * frontend_inflight
  cart_queue -> cart_inflight as cart_dispatched: "min(0.6 * cart_queue, 40 * cart_ready)"
  cart_queue -> cart_retries as cart_timeouts: 0.08 * cart_queue
  cart_retries -> cart_queue as cart_retried: 0.6 * cart_retries
  cart_retries -> outside as cart_gave_up: 0.4 * cart_retries
  cart_inflight -> cart_responses_total as cart_completed: 0.5 * cart_inflight
  cart_inflight -> cart_errors_total as cart_errors: 0.03 * cart_inflight
  outside -> cart_cpu as cart_used: 1.25 * cart_inflight + 20 * cart_ready
  cart_cpu -> outside as cart_window: 0.5 * cart_cpu
  outside -> cart_desired as cart_hpa_up: {rate: "max(0, min(8, ceil(cart_cpu / 192.5)) - cart_desired)", exact: true}
  cart_desired -> outside as cart_hpa_down: {rate: "1 * (cart_desired > max(2, ceil(cart_cpu / 157.5)))", exact: true}
  outside -> cart_pending as cart_created: {rate: "max(0, cart_desired - cart_pending - cart_ready)", exact: true}
  cart_pending -> cart_ready as cart_started: "min(0.5 * cart_pending, max(0, 4 * nodes - (frontend_ready + catalog_ready + cart_ready)) * cart_pending / max(1, (frontend_pending + catalog_pending + cart_pending)))"
  cart_ready -> outside as cart_deleted: {rate: "max(0, cart_ready - cart_desired)", exact: true}
  outside -> cart_mem as cart_allocated: "0.5 * (150 + cart_leak + 2 * cart_inflight / max(1, cart_ready))"
  cart_mem -> outside as cart_freed: 0.5 * cart_mem
  outside -> cart_leak as cart_leaking: 1.3
  cart_ready -> cart_pending as cart_oom_killed:
    rate: 1 * cart_ready * effect(cart_mem, table, [[0, 0], [480, 0], [512, 0.3], [560, 0.8], [5000, 1]])
  outside -> cart_oom_kills_total as cart_oom_counted: {rate: "flow(cart_oom_killed)", exact: true}
  cart_leak -> outside as cart_oom_reset:
    rate: 1 * cart_leak * effect(cart_mem, table, [[0, 0], [480, 0], [512, 0.3], [560, 0.8], [5000, 1]])
  outside -> nodes as provisioned: delay1(0.3 * max(0, frontend_pending + catalog_pending + cart_pending - max(0, 4 * nodes - (frontend_ready + catalog_ready + cart_ready))) / 4, 2)
  nodes -> outside as removed: {rate: "0.05 * max(0, nodes - max(3, (frontend_ready + catalog_ready + cart_ready + frontend_pending + catalog_pending + cart_pending) / 2))", exact: true}
  outside -> db_waiting as catalog_queries: 0.04 * catalog_inflight
  outside -> db_waiting as cart_queries: 0.1 * cart_inflight
  db_waiting -> db_active as acquired: "min(0.8 * db_waiting, 80 - 0.2 * db_active)"
  db_active -> outside as released: 0.8 * db_active
injections:
  - {t: 130, stock: nodes, amount: -1}
  - {t: 130, stock: frontend_ready, amount: -2}
  - {t: 130, stock: frontend_pending, amount: 2}
  - {t: 130, stock: catalog_ready, amount: -1}
  - {t: 130, stock: catalog_pending, amount: 1}
  - {t: 706, stock: nodes, amount: -1}
  - {t: 706, stock: frontend_ready, amount: -2}
  - {t: 706, stock: frontend_pending, amount: 2}
  - {t: 706, stock: catalog_ready, amount: -1}
  - {t: 706, stock: catalog_pending, amount: 1}
  - {t: 1282, stock: nodes, amount: -1}
  - {t: 1282, stock: frontend_ready, amount: -2}
  - {t: 1282, stock: frontend_pending, amount: 2}
  - {t: 1282, stock: catalog_ready, amount: -1}
  - {t: 1282, stock: catalog_pending, amount: 1}
variants:
  noise: [none, counts, meas]
boundary:
  frontend_queue: {in: input}
  frontend_retries: {out: estimate}
  frontend_ready: {out: estimate}
  frontend_cpu: {in: estimate, out: estimate}
  frontend_desired: {in: estimate, out: estimate}
  frontend_pending: {in: estimate}
  frontend_mem: {in: estimate, out: estimate}
  frontend_oom_kills_total: {in: estimate}
  catalog_queue: {in: [estimate, estimate]}
  catalog_retries: {out: estimate}
  catalog_ready: {out: estimate}
  catalog_cpu: {in: estimate, out: estimate}
  catalog_desired: {in: estimate, out: estimate}
  catalog_pending: {in: estimate}
  catalog_mem: {in: estimate, out: estimate}
  catalog_oom_kills_total: {in: estimate}
  cart_queue: {in: estimate}
  cart_retries: {out: estimate}
  cart_ready: {out: estimate}
  cart_cpu: {in: estimate, out: estimate}
  cart_desired: {in: estimate, out: estimate}
  cart_pending: {in: estimate}
  cart_mem: {in: estimate, out: estimate}
  cart_oom_kills_total: {in: estimate}
  nodes: {in: estimate, out: estimate}
  db_waiting: {in: [estimate, estimate]}
  db_active: {out: estimate}
