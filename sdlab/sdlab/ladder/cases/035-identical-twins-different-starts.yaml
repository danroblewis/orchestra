title: Three identical stocks, different starts
level: 3
tags: [independent, identical, identifiability]
tests: "the stocks of 034 started at different levels: still not separable without noise (each one's gap to 100 shrinks by the same 20% a step, so the levels stay in a fixed ratio); the simplest answer, no flow between them, is the right one"
seed: 35
stocks: {A: 0, B: 50, C: 250}
flows:
  outside -> A: 20
  A -> outside: 0.2 * A
  outside -> B: 20
  B -> outside: 0.2 * B
  outside -> C: 20
  C -> outside: 0.2 * C
