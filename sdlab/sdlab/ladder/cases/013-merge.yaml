title: Two inputs merging
level: 10
tags: [merge, move]
tests: "two stocks each fed from outside drain into one: both moves and both inflows are recovered"
seed: 13
stocks: {A: 0, B: 0, C: 0}
flows:
  outside -> A as a_in: 10
  outside -> B: 15
  A -> C: 0.3 * A
  B -> C: 0.2 * B
  C -> outside: 0.1 * C
boundary:
  A: {in: estimate}
  B: {in: estimate}
  C: {out: estimate}
