title: "Web server queue with admission control"
level: 13
tags: [control, input, effect, effect-table, nonlinear, final]
tests: "admission control of a request queue (Astrom & Murray's queue, an SRE's load shedder): requests arrive at a measured rate (6 a step, with rush hours of 13); the server's throughput rises with the queue Q and saturates at 10 a step (Agnew's 10 x Q / (Q + 1), as a table); the admission controller admits the arrivals in full while Q is below 30, none above 40, and a share falling in a straight line in between (sat(0.1 x (40 - Q)): P control of the queue with saturation); rejected requests are counted in Rejected and served ones in Served (both measured, final); in a rush the queue is held near 35 instead of growing without bound; recovered as arrivals x a falling table of Q into Q, arrivals x a rising table of Q into Rejected, and a saturating table of Q from Q to Served (Astrom & Murray, Feedback Systems, Example 2.10 and Exercise 2.8; sec. 3.4)"
seed: 212
inputs:
  arrivals: "6 + pulse_train(7, 100.5, 60, 250) + pulse_train(3, 30.5, 40, 170)"
stocks:
  Q: {initial: 2, unit: requests}
  Served: {initial: 0, unit: requests, final: true}
  Rejected: {initial: 0, unit: requests, final: true}
flows:
  outside -> Q as admitted: "1 * arrivals * effect(Q, table, [[0, 1], [30, 1], [40, 0], [1000, 0]])"
  outside -> Rejected as rejected: "1 * arrivals * effect(Q, table, [[0, 0], [30, 0], [40, 1], [1000, 1]])"
  Q -> Served: "10 * effect(Q, table, [[0, 0], [1, 0.5], [2, 0.667], [4, 0.8], [9, 0.9], [19, 0.95], [49, 0.98], [1000, 0.999]])"
boundary:
  Q: {in: estimate}
  Rejected: {in: estimate}
