# A + B -> C in a stirred tank: particles meet in random cells and bind. The expected bindings are
# kappa x A x B to within the measured numbers' error: discovery must find a product.
system: reaction
title: "Sticky particles: A + B -> C in a stirred tank"
level: 21
tags: [physics, particles, measured, input, product, effect, coflow]
