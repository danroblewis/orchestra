title: "Logistic growth under measurement error"
level: 12
tags: [distilled, product, crowding, effect, effect-linear, noisy]
tests: "measurement error on a product: 103's logistic growth (births 0.15 x X, crowding 0.15 x X x X / 2000, restocked every 100 steps) with 2% measurement error on the levels beside its counts variants; from the gLV and adoption twins (published model plus 2-20% measurement error): the crowding product is recovered under measurement noise, not replaced by a linear drain and pieces"
seed: 139
stocks:
  Population: 20
flows:
  outside -> Population as births: "0.15 * Population"
  Population -> outside as crowding_deaths: "0.015 * Population * effect(Population, linear, normal=200, max=1000)"
