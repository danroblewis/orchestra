[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra-ai"
version = "0.3.0"
description = "A multi-layer, AI-driven software development workflow orchestrator built on the Pi agent harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["orchestra"]

[tool.pytest.ini_options]
testpaths = ["orchestra"]
pythonpath = ["backend"]
