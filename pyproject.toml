[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra"
version = "1.0.0a1"
description = "Ticket tracker, milestone planner, and CI/CD workflow operated by AI agents on Pi or Claude Code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["orchestra"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/e2e"]

[tool.ruff]
line-length = 100
target-version = "py312"
