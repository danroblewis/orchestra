[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestra"
version = "1.0.0a1"
description = "An event bus, a metrics store, and a system dynamics model of the machines that use them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=5.9",
    "tomlkit>=0.13",   # config_edit: a change to orchestra.toml or the overlay keeps the file's comments
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
bus-redis = ["redis>=5.0"]
bus-rabbitmq = ["pika>=1.3"]
bus-kafka = ["confluent-kafka>=2.5"]
bus = ["redis>=5.0", "pika>=1.3", "confluent-kafka>=2.5"]
# SD Lab's discovery strategies (orchestra/sdlab)
sd = ["numpy>=2.0", "scipy>=1.14", "numba>=0.61", "highspy>=1.8", "sympy>=1.13"]
sd-research = ["cma>=4.0", "cvxpy>=1.6", "jax>=0.5", "pysindy>=2.0"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["orchestra"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/bus", "tests/metrics", "tests/sources"]

[tool.ruff]
line-length = 100
extend-exclude = ["orchestra/sdlab"]
target-version = "py312"
