# Demo servers for developing Orchestra's kernel: event-bus backends and a time-series store.
#
#   docker compose -f deploy/dev/compose.yaml up -d
#   docker compose -f deploy/dev/compose.yaml down          # add -v to drop the data
#
# The event-bus acceptance suite (tests/bus) runs against whichever of these are named in its
# environment variables; see tests/bus/README.md. Ports are bound to localhost only.
name: orchestra-dev

services:
  redis:
    image: redis:7.4.1
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30}

  rabbitmq:
    image: rabbitmq:4.0.3-management
    environment:
      RABBITMQ_DEFAULT_USER: orchestra
      RABBITMQ_DEFAULT_PASS: orchestra
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 3s, retries: 40}

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: -1
    ports: ["127.0.0.1:9092:9092"]
    volumes: ["kafka:/var/lib/kafka/data"]

  nats:
    image: nats:2.10.22
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    volumes: ["nats:/data"]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    command: ["-storageDataPath=/storage", "-retentionPeriod=100y", "-httpListenAddr=:8428"]
    ports: ["127.0.0.1:8428:8428"]
    volumes: ["victoriametrics:/storage"]

volumes: {redis: {}, rabbitmq: {}, kafka: {}, nats: {}, victoriametrics: {}}
