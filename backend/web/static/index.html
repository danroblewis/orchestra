<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orchestra</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-alt: #0d1117;
        --border: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --active: #3fb950;
        --idle: #6e7681;
        --backlog: #8b949e;
        --in-progress: #d29922;
        --done: #3fb950;
        --blocked: #f85149;
        --failed: #f85149;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 { font-size: 20px; margin: 0; }
      header h1 .dot { color: var(--active); }
      .tunnel { font-size: 13px; color: var(--accent); }
      .tunnel a { color: var(--accent); }
      .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 61px); }
      .sidebar { border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
      .main { overflow: auto; padding: 24px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
      .task {
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 4px solid var(--backlog);
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .task:hover { border-color: var(--accent); }
      .task.done { border-left-color: var(--done); }
      .task.in-progress { border-left-color: var(--in-progress); }
      .task.blocked { border-left-color: var(--blocked); }
      .task.failed { border-left-color: var(--failed); }
      .task .title { font-weight: 600; font-size: 14px; }
      .task .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 10px;
        background: var(--border);
        margin-top: 6px;
      }
      .badge.active { background: rgba(63, 185, 80, 0.2); color: var(--active); }
      .badge.idle { background: var(--panel-alt); color: var(--muted); }
      .badge.in-progress { background: rgba(210, 153, 34, 0.2); color: var(--in-progress); }
      .milestone { margin-bottom: 20px; }
      .milestone h2 { font-size: 16px; margin: 0 0 10px; color: var(--accent); }
      .empty { color: var(--muted); font-size: 13px; }
      .dep { font-size: 11px; color: var(--muted); }
      .session-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
      /* Single flat agent list: each card has a colored left border per agent
         type, a fixed height, the ticket it works on, and its last message. */
      .agent-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 5px solid var(--muted);
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 6px;
        cursor: pointer;
        height: 92px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      }
      .agent-card:hover { border-color: var(--accent); }
      .agent-card .agent-head { display: flex; align-items: center; gap: 8px; }
      .agent-card .agent-title { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
      .agent-card .agent-title .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .agent-card .agent-ticket { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .agent-card .agent-last { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        display: inline-block; flex-shrink: 0;
      }
      .dot.active { background: var(--active); box-shadow: 0 0 6px var(--active); animation: pulse 1.5s infinite; }
      .dot.idle { background: var(--idle); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .agent-card.supervisor { border-left-color: #8b5cf6; }
      .agent-card.coordinator { border-left-color: #0ea5e9; }
      .agent-card.pipeline-manager { border-left-color: #f59e0b; }
      .agent-card.worker { border-left-color: #10b981; }
      .agent-card.reviewer { border-left-color: #ef4444; }
      .agent-card.running .dot.active { display: inline-block; }
      .agent-list-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 14px 0 6px; }
      .agent-section-head {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--muted); margin: 10px 0 6px; cursor: pointer;
        display: flex; align-items: center; gap: 6px;
      }
      .agent-section-head .chevron { transition: transform 0.15s; display: inline-block; }
      .agent-section-head.collapsed .chevron { transform: rotate(-90deg); }
      .agent-section-body.collapsed { display: none; }
      .section-count {
        background: var(--border); color: var(--muted); border-radius: 10px;
        padding: 0 6px; font-size: 10px; margin-left: auto;
      }
      .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex; align-items: center; justify-content: center;
        z-index: 1000;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        max-width: 90%;
        max-height: 85%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 0;
        min-width: 640px;
      }
      .modal-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .modal-header h2 { margin: 0; font-size: 17px; color: var(--accent); }
      .modal-close {
        background: var(--border);
        border: none;
        color: var(--text);
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      .modal-close:hover { background: var(--accent); color: var(--bg); }
      .modal-body { padding: 20px; overflow: auto; flex: 1; }
      .modal-detail-grid { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; margin-bottom: 16px; }
      .modal-detail-grid dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
      .modal-detail-grid dd { margin: 0; font-size: 14px; }
      .session-link { color: var(--accent); cursor: pointer; }
      .session-link:hover { text-decoration: underline; }
      .ticket-link { color: var(--accent); cursor: pointer; font-weight: 600; }
      .ticket-link:hover { text-decoration: underline; }
      .modal-desc {
        background: var(--panel-alt);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        font-size: 13px;
        white-space: pre-wrap;
        margin: 12px 0;
      }
      .transcript { margin-top: 16px; }
      .transcript h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 10px; }
      .msg {
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 10px;
        overflow: hidden;
      }
      .msg-head {
        display: flex; align-items: center; gap: 10px;
        padding: 6px 12px;
        background: var(--panel-alt);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .msg-head .role { font-weight: 600; }
      .msg-head .role.user { color: var(--accent); }
      .msg-head .role.assistant { color: var(--active); }
      .msg-head .role.system { color: var(--in-progress); }
      .msg-head .ts { color: var(--muted); margin-left: auto; font-size: 11px; }
      .msg-body { padding: 10px 12px; font-size: 13px; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.4; max-height: 320px; overflow: auto; }
      .status-pill {
        display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
        font-weight: 600;
      }
      .status-pill.done { background: rgba(63, 185, 80, 0.2); color: var(--done); }
      .status-pill.in-progress { background: rgba(210, 153, 34, 0.2); color: var(--in-progress); }
      .status-pill.blocked { background: rgba(248, 81, 73, 0.2); color: var(--blocked); }
      .status-pill.failed { background: rgba(248, 81, 73, 0.2); color: var(--failed); }
      .status-pill.backlog { background: var(--border); color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="dot active"></span> Orchestra</h1>
      <div class="tunnel" id="tunnel"></div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="card">
          <h3>Next In Queue</h3>
          <div id="next-in-queue"></div>
        </div>
        <div class="card">
          <div class="agent-list-title">Agents</div>
          <div id="agent-list"></div>
        </div>
      </aside>
      <main class="main">
        <div class="card">
          <h2>Milestones &amp; Tasks</h2>
          <div id="milestones"></div>
        </div>
        <div class="card">
          <h2>Build Outputs</h2>
          <div id="builds"></div>
        </div>
      </main>
    </div>

    <!-- Agent / Task / Session modal -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-title">Details</h2>
          <button class="modal-close" onclick="closeModal()">Close</button>
        </div>
        <div class="modal-body" id="modal-content"></div>
      </div>
    </div>
    <script>
      async function loadState() {
        const res = await fetch("/api/state");
        return await res.json();
      }

      function statusClass(status) {
        return status.replace(/_/g, "-");
      }

      function statusPill(status) {
        return `<span class="status-pill ${statusClass(status)}">${status}</span>`;
      }

      // Truncate a long session/task name for compact sidebar display.
      function shortName(name) {
        if (!name) return "";
        // Strip common prefixes like "worker-" / "reviewer-"
        return name.replace(/^(worker|reviewer|supervisor|coordinator|pipeline-manager)-/, "");
      }

      function renderTask(t, allTasks) {
        const deps = (t.dependency_ids || [])
          .map((id) => {
            const dep = allTasks.find((x) => x.id === id);
            return dep ? dep.title : id;
          })
          .join(", ");
        return `
          <div class="task ${statusClass(t.status)}" onclick="openTask('${t.id}')" title="Click to view details">
            <div class="title">${esc(t.title)}</div>
            <div class="meta">Priority ${t.priority}${t.milestone_id ? " · " + shortMilestone(t.milestone_id) : ""}</div>
            <div class="badge">${statusPill(t.status)}${t.build_status ? " · build: " + t.build_status : ""}</div>
            ${deps ? `<div class="dep">Depends on: ${esc(deps)}</div>` : ""}
          </div>
        `;
      }

      function shortMilestone(id) { return id.slice(0, 8); }

      function esc(s) {
        if (s == null) return "";
        return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      // Collapse a long name for the agent sidebar.
      function agentShortName(name) {
        if (!name) return name;
        // Keep the layer prefix for readability: "worker-slug" -> "worker: slug"
        return name.replace("-", ": ");
      }

      function render() {
        loadState().then((state) => {
          const taskById = {};
          state.tasks.forEach((t) => { taskById[t.id] = t; });

          // -- Milestones & tasks (clickable -> openTask) --
          const msDiv = document.getElementById("milestones");
          if (state.milestones.length === 0) {
            msDiv.innerHTML = '<div class="empty">No milestones yet.</div>';
          } else {
            msDiv.innerHTML = state.milestones
              .map((m) => {
                const tasks = state.tasks.filter((t) => t.milestone_id === m.id);
                return `
                  <div class="milestone">
                    <h2>${esc(m.name)} (${tasks.length})</h2>
                    ${tasks.map((t) => renderTask(t, state.tasks)).join("")}
                  </div>
                `;
              })
              .join("");
          }

          // -- Next in queue --
          const nextDiv = document.getElementById("next-in-queue");
          if (state.nextInQueue.length === 0) {
            nextDiv.innerHTML = '<div class="empty">Nothing ready yet.</div>';
          } else {
            nextDiv.innerHTML = state.nextInQueue
              .map((t) => renderTask(t, state.tasks))
              .join("");
          }

          // -- Single flat agent list: every session as a colored card. --
          // Only show agents that are currently active (running). Completed
          // reviewers/workers that have gone idle drop out, keeping the list to
          // just who's working right now.
          const logs = (state.sessionLogs || []).filter((s) => s.status === "running");
          const agentDiv = document.getElementById("agent-list");
          if (logs.length === 0) {
            agentDiv.innerHTML = '<div class="empty">No agents active.</div>';
          } else {
            agentDiv.innerHTML = logs
              .sort((a, b) => (a.status === "running" ? -1 : b.status === "running" ? 1 : 0))
              .map((s) => renderAgent(s, state))
              .join("");
          }

          // -- Builds --
          const buildsDiv = document.getElementById("builds");
          if (state.builds.length === 0) {
            buildsDiv.innerHTML = '<div class="empty">No builds recorded.</div>';
          } else {
            buildsDiv.innerHTML = state.builds
              .map(
                (b) => `
                  <div class="task ${statusClass(b.status)}">
                    <div class="title">Build ${b.task_id.slice(0, 8)}</div>
                    <div class="meta">${b.status}${b.duration_seconds ? " · " + b.duration_seconds + "s" : ""}</div>
                    <div class="badge">${b.started_at}</div>
                  </div>
                `
              )
              .join("");
          }
        });
      }

      // Group sessions by layer. Active (running) sessions are shown in an
      // expanded "Active" group; idle/recoverable sessions are grouped by layer
      // and *collapsed* by default so the sidebar doesn't clutter.
      function agentLayerName(name) {
        if (!name) return "agent";
        // "worker-slug" -> "worker", "pipeline-manager" -> "pipeline-manager"
        const m = name.match(/^(worker|reviewer|supervisor|coordinator|pipeline-manager)/);
        return m ? m[1] : "agent";
      }

      // Pick the ticket this agent is working on (workers/reviewers are named
      // after a task slug) so the card shows which task it owns.
      function agentTicketName(session, state) {
        const parts = (session.session_name || "").split("-");
        const role = agentLayerName(session.session_name);
        // worker-<task-slug> or reviewer-<task-slug>
        if ((role === "worker" || role === "reviewer") && parts.length > 1) {
          const slug = parts.slice(1).join("-");
          const task = state.tasks.find((t) => t.slug === slug);
          if (task) return task.title;
          return slug.replace(/-/g, " ");
        }
        // top-layer agents: show the task they are assigned to, if any
        if (session.assignee_task_id) {
          const t = state.tasks.find((x) => x.id === session.assignee_task_id);
          if (t) return t.title;
        }
        return null;
      }

      // Fetch the last message for a session (via the session API) and show it on
      // the card. Kept simple: a single truncated line.
      async function loadLastMessage(session, state) {
        try {
          const res = await fetch(`/api/sessions/${session.id}`);
          if (!res.ok) return null;
          const s = await res.json();
          const msgs = (s.messages || []);
          if (!msgs.length) return null;
          const last = msgs[msgs.length - 1];
          return last.content || last.text || (last.parts || []).map((p) => p.text || "").join("") || null;
        } catch (e) {
          return null;
        }
      }

      function renderAgent(s, state) {
        const cls = s.status === "running" ? "running" : "idle";
        const layer = agentLayerName(s.session_name);
        const shown = agentShortName(s.session_name);
        const ticket = agentTicketName(s, state);
        const ticketHtml = ticket
          ? `<div class="agent-ticket">${esc(ticket)}</div>`
          : "";
        const dotCls = s.status === "running" ? "dot active" : "dot";
        const msgs = s.message_count;
        return `
          <div class="agent-card ${cls} ${layer}" onclick="openAgent('${s.id}')" data-session-id="${s.id}" title="Click to view transcript">
            <div class="agent-head">
              <div class="agent-title">
                <span class="${dotCls}"></span>
                <span class="name">${esc(shown)}</span>
              </div>
              <span class="badge ${cls === 'running' ? 'active' : 'idle'}">${s.status === 'running' ? 'active' : s.status}</span>
            </div>
            ${ticketHtml}
            <div class="agent-last" data-last-for="${s.id}">${s.status === 'running' ? 'working…' : msgs + ' message' + (msgs === 1 ? '' : 's')}</div>
          </div>
        `;
      }

      // Populate the last-message line for each card once the session API loads.
      async function refreshLastMessages() {
        const cards = document.querySelectorAll('.agent-card');
        for (const card of cards) {
          const id = card.getAttribute('data-session-id');
          const el = card.querySelector('[data-last-for]');
          if (!el || el.dataset.done === '1') continue;
          try {
            const res = await fetch(`/api/sessions/${id}`);
            if (!res.ok) continue;
            const s = await res.json();
            const msgs = (s.messages || []);
            if (msgs.length) {
              const last = msgs[msgs.length - 1];
              const txt = last.content || last.text || (last.parts || []).map((p) => p.text || "").join("") || '';
              el.textContent = txt.length > 48 ? txt.slice(0, 46) + '…' : (txt || 'no messages');
            }
          } catch (e) {
            // ignore
            el.dataset.done = '1';
          }
        }
      }

      // Tunnel URL
      fetch("/api/tunnel").then((r) => r.json()).then((j) => {
        const el = document.getElementById("tunnel");
        if (j.url) {
          el.innerHTML = `<a href="${j.url}" target="_blank">🔗 ${j.url}</a>`;
        }
      });

      // -- Modals --
      async function openSession(sessionId) {
        const agentId = sessionId;
        openAgent(agentId);
      }

      async function openAgent(sessionId) {
        const res = await fetch(`/api/sessions/${sessionId}`);
        if (!res.ok) { alert("Session not found"); return; }
        const session = await res.json();

        document.getElementById("modal-title").textContent = session.session_name;

        // Build the detail grid.
        let html = '<dl class="modal-detail-grid">';
        html += `<dt>Layer</dt><dd>${esc(session.layer || "—")}</dd>`;
        html += `<dt>Status</dt><dd>${statusPill(session.status)}</dd>`;
        html += `<dt>Messages</dt><dd>${session.message_count}</dd>`;
        html += `<dt>Created</dt><dd>${esc(session.created_at || "—")}</dd>`;
        html += `<dt>Updated</dt><dd>${esc(session.updated_at || "—")}</dd>`;
        html += '</dl>';

        // Transcript (scrollable).
        const msgs = session.messages || [];
        if (msgs.length === 0) {
          html += '<div class="transcript"><div class="empty">No messages in this session yet.</div></div>';
        } else {
          html += '<div class="transcript"><h3>Transcript</h3>';
          msgs.forEach((msg) => {
            const roleClass = (msg.role || "assistant").toLowerCase();
            html += `
              <div class="msg">
                <div class="msg-head">
                  <span class="role ${roleClass}">${esc(msg.role)}</span>
                  <span class="ts">${esc(msg.created_at || "")}</span>
                </div>
                <div class="msg-body">${esc(msg.content)}</div>
              </div>
            `;
          });
          html += '</div>';
        }
        document.getElementById("modal-content").innerHTML = html;
        document.getElementById("modal-overlay").style.display = 'flex';
      }

      async function openTask(taskId) {
        const res = await fetch("/api/state");
        const state = await res.json();
        const t = state.tasks.find((x) => x.id === taskId);
        if (!t) { alert("Task not found"); return; }

        document.getElementById("modal-title").textContent = t.title;

        // Find the agent assigned to this task (by assignee_session_id).
        const assignee = state.sessionLogs.find((s) => s.id === t.assignee_session_id) ||
          state.sessionLogs.find((s) => s.session_name === t.assignee_session_id);

        let html = '<dl class="modal-detail-grid">';
        html += `<dt>ID</dt><dd><span class="ticket-link" onclick="openTask('${t.id}')">${esc(t.id)}</span></dd>`;
        html += `<dt>Status</dt><dd>${statusPill(t.status)}</dd>`;
        html += `<dt>Priority</dt><dd>${t.priority}</dd>`;
        html += `<dt>Milestone</dt><dd>${esc((state.milestones.find((m) => m.id === t.milestone_id) || {}).name || "—")}</dd>`;
        const deps = (t.dependency_ids || []).map((id) => {
          const dep = state.tasks.find((x) => x.id === id);
          return dep ? dep.title : id;
        }).join(", ");
        html += `<dt>Dependencies</dt><dd>${esc(deps) || "—"}</dd>`;
        if (t.build_status) html += `<dt>Build</dt><dd>${esc(t.build_status)}</dd>`;
        if (assignee) html += `<dt>Assigned agent</dt><dd><span class="session-link" onclick="openAgent('${assignee.id}')">${esc(assignee.session_name)}</span></dd>`;
        html += '</dl>';

        // Description.
        html += '<h3 style="font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);margin:16px 0 8px;">Description</h3>';
        html += `<div class="modal-desc">${esc(t.description || "No description provided.")}</div>`;

        // Transcript of the assigned agent, if any.
        if (assignee) {
          const sres = await fetch(`/api/sessions/${assignee.id}`);
          if (sres.ok) {
            const session = await sres.json();
            const msgs = session.messages || [];
            if (msgs.length > 0) {
              html += '<div class="transcript"><h3>Agent Transcript</h3>';
              msgs.forEach((msg) => {
                const roleClass = (msg.role || "assistant").toLowerCase();
                html += `
                  <div class="msg">
                    <div class="msg-head">
                      <span class="role ${roleClass}">${esc(msg.role)}</span>
                      <span class="ts">${esc(msg.created_at || "")}</span>
                    </div>
                    <div class="msg-body">${esc(msg.content)}</div>
                  </div>
                `;
              });
              html += '</div>';
            }
          }
        }

        document.getElementById("modal-content").innerHTML = html;
        document.getElementById("modal-overlay").style.display = 'flex';
      }

      function closeModal() {
        document.getElementById("modal-overlay").style.display = 'none';
      }

      // Close modal on overlay click (outside modal)
      document.getElementById("modal-overlay").addEventListener('click', (e) => {
        if (e.target.id === 'modal-overlay') closeModal();
      });

      // Close modal on Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });

      // Render immediately and refresh every 2 seconds.
      render();
      setInterval(render, 2000);
      // Populate each card's last-message line (async, once per card).
      refreshLastMessages();
      setInterval(refreshLastMessages, 4000);
    </script>
  </body>
</html>
